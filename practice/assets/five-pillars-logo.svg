<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Five Pillars Governance Logo</title>
  <desc id="desc">Circular governance emblem with lock and five surrounding icons.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1c3b" />
      <stop offset="100%" stop-color="#0b0f24" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#ring)" stroke-width="14" filter="url(#glow)" opacity="0.9" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="8" opacity="0.55" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.35" />
  <g id="lock" filter="url(#glow)" opacity="0.95">
    <rect x="196" y="230" width="120" height="110" rx="18" ry="18" fill="#0b152d" stroke="url(#icon)" stroke-width="10" />
    <path d="M212 230v-28c0-25 20-46 44-46s44 21 44 46v28" fill="none" stroke="url(#icon)" stroke-width="14" stroke-linecap="round" />
    <circle cx="256" cy="285" r="14" fill="#0b152d" stroke="url(#icon)" stroke-width="10" />
    <rect x="248" y="298" width="16" height="26" rx="8" fill="url(#icon)" />
  </g>
  <g fill="none" stroke="url(#icon)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <circle cx="256" cy="86" r="44" fill="#0b152d" stroke-width="8" />
    <ellipse cx="256" cy="86" rx="30" ry="12" />
    <path d="M226 86c0 14 14 26 30 26s30-12 30-26" />
  </g>
  <g transform="translate(388 184)" fill="none" stroke="url(#icon)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <circle cx="0" cy="0" r="44" fill="#0b152d" stroke-width="8" />
    <path d="M-14 10c0-14 10-24 24-24s24 10 24 24-10 24-24 24c-8 0-15-4-19-10" />
    <path d="M18 -32v-10" />
    <path d="M30 -40h-24" />
    <path d="M-36 40c6-16 18-24 36-24" />
  </g>
  <g transform="translate(366 346)" fill="none" stroke="url(#icon)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <circle cx="0" cy="0" r="44" fill="#0b152d" stroke-width="8" />
    <path d="M-10 -10h-12v48h12z" />
    <path d="M8 -26H-4v64h12z" />
    <path d="M26 6H14v32h12z" />
    <path d="M-22 18l-14 18" />
  </g>
  <g transform="translate(146 346)" fill="none" stroke="url(#icon)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <circle cx="0" cy="0" r="44" fill="#0b152d" stroke-width="8" />
    <path d="M-18 20v-30c0-10 8-18 18-18s18 8 18 18c0 18-18 30-18 30" />
    <circle cx="18" cy="-16" r="8" />
    <path d="M-28 -20h52" />
  </g>
  <g transform="translate(124 184)" fill="none" stroke="url(#icon)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <circle cx="0" cy="0" r="44" fill="#0b152d" stroke-width="8" />
    <path d="M-22 0c6-14 20-24 36-24s30 10 36 24c-6 14-20 24-36 24s-30-10-36-24z" />
    <circle cx="14" cy="0" r="12" />
  </g>
</svg>
