<!doctype html>

  <style>
    :root{color-scheme:dark;--ink:#000025;--blue:#00aeff;--aqua:#00ffff;--text:#eeeeee;--muted:#aeb8d2}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,rgba(0,174,255,.16),transparent 32rem),var(--ink);color:var(--text);font-family:"Helvetica Neue","HelveticaNeue",Arial,sans-serif}.wrap{width:min(1320px,calc(100% - 36px));margin:auto;padding:28px 0 64px}.top{display:flex;min-height:60px;align-items:center;justify-content:space-between;gap:20px}.top a{color:var(--muted);font-size:.8rem;text-underline-offset:4px}.eyebrow{margin:38px 0 0;color:var(--aqua);font-size:.68rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{max-width:900px;margin:10px 0 0;color:#fff;font-size:clamp(2.7rem,11vw,5.5rem);font-weight:950;letter-spacing:-.06em;line-height:.94}header>p:last-child{max-width:760px;margin:18px 0 0;color:var(--muted);font-size:1rem;line-height:1.55}.grid{display:grid;gap:16px;margin-top:34px}figure{margin:0;overflow:hidden;border:1px solid rgba(120,220,255,.22);border-radius:17px;background:#060625}img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}figcaption{display:grid;gap:5px;padding:16px}figcaption strong{color:#fff;font-size:1.05rem}figcaption span{color:var(--muted);font-size:.8rem;line-height:1.45}.generated{border-color:rgba(0,255,255,.48)}.generated figcaption strong{color:var(--aqua)}a:focus-visible{outline:3px solid var(--aqua);outline-offset:4px}@media(min-width:760px){.wrap{width:min(1320px,calc(100% - 68px));padding-top:42px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>

  <main class="wrap">
    <div class="top"><a href="../conductor/">← The Conductor</a><a href="../">AI Practice home</a></div>
    <header>
      <p class="eyebrow">World reference · working set</p>
      <h1>The Innovation Engine visual world.</h1>
      <p>These scenes define the shared materials, scale, lighting, and visual grammar for the capability, journey, engine, and orchestration experiences.</p>
    </header>
    <section class="grid" aria-label="Innovation Engine reference images">
      <figure><img src="./capability-owner-index.png" alt="Circular cyber-industrial control hall with operators and blue-lit data systems" loading="lazy"><figcaption><strong>Capability owner index</strong><span>Spatial organisation, distributed control, and a visible centre of gravity.</span></figcaption></figure>
      <figure><img src="./ai-enablement-journey.png" alt="Industrial AI complex with an illuminated path rising through successive levels" loading="lazy"><figcaption><strong>AI enablement journey</strong><span>Forward movement, staged progression, and an observable route through complexity.</span></figcaption></figure>
      <figure><img src="./innovation-engine.png" alt="Large cyber-industrial engine with cyan conduits and dark metal machinery" loading="lazy"><figcaption><strong>Innovation Engine</strong><span>Core machinery, cool-toned energy, and a system built to keep operating.</span></figcaption></figure>
      <figure class="generated"><img src="./conductor-orchestration-engine.jpg" alt="Cyan and violet data paths converge on a central orchestration core" loading="lazy"><figcaption><strong>The Conductor</strong><span>Generated for this prototype: promotion flows through the gates while certification evidence moves around them.</span></figcaption></figure>
    </section>
