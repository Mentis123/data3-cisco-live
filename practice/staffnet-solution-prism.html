<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Data#3 SolCat Matrix</title>
<meta name="theme-color" content="#000025">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23007BC3'/><text x='32' y='47' font-family='Helvetica Neue,Helvetica,Arial' font-size='44' font-weight='900' fill='%23ffffff' text-anchor='middle'>%23</text></svg>">
<style>
/* ═══════════════════════════════════════════════════════════════
   Data#3 SolCat Matrix
   Colours: Data#3 Brand Guidelines (Aug 2024) palette only.
   Primary #000025 #007BC3 #00AEFF #78DCFF #9D9FA2 #EEEEEE
   Secondary #00FFFF #0000FF #7300FF #9B9BFF #FF00FF #000087
   Data viz  #004F33 #00FF00 #B30089 #245B79 #FFB7FF #DAFF00
   ═══════════════════════════════════════════════════════════════ */
:root{
  --blue-black:#000025; --d3-blue:#007BC3; --light-blue:#00AEFF; --pale-blue:#78DCFF;
  --light-grey:#9D9FA2; --grey-white:#EEEEEE;
  --aqua:#00FFFF; --blue1:#0000FF; --cool-purple:#7300FF; --cool-lilac:#9B9BFF; --magenta:#FF00FF; --dark-blue:#000087;
  --dark-green:#004F33; --green1:#00FF00; --dark-magenta:#B30089; --dark-teal:#245B79; --light-pink:#FFB7FF; --green-yellow:#DAFF00;

  --lens-advisory:#00AEFF; --lens-packaged:#00FFFF; --lens-bespoke:#9B9BFF; --lens-managed:#FF00FF;

  --bg:#000025; --txt:#FFFFFF; --dim:#9D9FA2;
  --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.085); --surface3:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.17); --line-soft:rgba(255,255,255,.09);
  --r:12px; --r-sm:8px; --r-lg:18px;
  --shadow:0 18px 46px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;text-align:left;
  background-image:radial-gradient(1100px 620px at 82% -12%,rgba(0,174,255,.14),transparent 62%),radial-gradient(900px 520px at -8% 8%,rgba(115,0,255,.11),transparent 60%);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:var(--light-blue)}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:800;letter-spacing:-.02em}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}h4{font-size:16px}
p{margin:0}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--light-blue);outline-offset:2px;border-radius:4px}
::selection{background:rgba(0,174,255,.35)}
sup{font-size:.62em;vertical-align:super;line-height:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

/* ── Top bar ─────────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:40;background:rgba(0,0,37,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topin{max-width:1680px;margin:auto;padding:0 20px;display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap}
.wordmark{display:flex;align-items:baseline;gap:9px;white-space:nowrap;padding:9px 0}
.wordmark b{font-size:20px;font-weight:900;letter-spacing:-.03em}
.wordmark span{font-size:13px;color:var(--pale-blue);font-weight:600;letter-spacing:.01em}
.nav{display:flex;gap:2px;flex:1;flex-wrap:wrap;min-width:0}
.nav button{display:flex;align-items:center;gap:6px;padding:9px 9px;border-radius:var(--r-sm);color:var(--pale-blue);
  font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s,color .15s}
.nav button:hover{background:var(--surface2);color:#fff}
.nav button.on{background:rgba(0,174,255,.17);color:#fff}
.nav button .ico{opacity:.9;display:none}
.navsep{width:1px;background:var(--line);margin:12px 7px;align-self:stretch}
.navlabel{display:flex;align-items:center;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;color:rgba(255,255,255,.4);padding-right:3px;white-space:nowrap}
.topright{display:flex;align-items:center;gap:10px;margin-left:auto}
.rolebox{display:flex;flex-direction:column;gap:2px}
.rolebox label{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;color:rgba(255,255,255,.45)}
select.ctl,input.ctl{background:rgba(0,0,60,.85);color:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px;font-size:14px;max-width:230px}
select.ctl:hover,input.ctl:hover{border-color:var(--light-blue)}
input.ctl::placeholder{color:var(--light-grey)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:#fff;
  border-radius:var(--r-sm);padding:9px 13px;font-size:14px;font-weight:700;transition:.15s;min-height:40px}
.btn:hover{border-color:var(--light-blue);background:var(--surface2)}
.btn.primary{background:var(--d3-blue);border-color:var(--d3-blue)}
.btn.primary:hover{background:var(--light-blue);border-color:var(--light-blue);color:var(--blue-black)}
.btn.sm{padding:6px 10px;font-size:13px;min-height:34px}
.btn.danger:hover{border-color:var(--magenta);background:rgba(255,0,255,.14)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.on{background:rgba(0,174,255,.2);border-color:var(--light-blue)}

/* ── Shell ───────────────────────────────────────────────── */
.shell{max-width:1680px;margin:auto;padding:22px 20px 80px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.eyebrow{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:var(--light-blue);margin-bottom:6px}
.lede{color:var(--pale-blue);font-size:15px;max-width:760px;margin-top:7px}
.sub{color:var(--dim);font-size:14px;max-width:820px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin-bottom:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.sec{margin-top:30px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ── Chips, badges, status ───────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;
  padding:3px 9px;font-size:11.5px;font-weight:700;color:var(--pale-blue);white-space:nowrap}
.chip.plain{color:var(--dim)}
.lenschip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px 3px 4px;font-size:11.5px;font-weight:800;
  border:1px solid currentColor;background:rgba(255,255,255,.05);white-space:nowrap}
.letter{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;
  background:currentColor;font-size:10.5px;font-weight:900;flex:0 0 auto}
.letter b{color:var(--blue-black)}
.l-advisory{color:var(--lens-advisory)}.l-packaged{color:var(--lens-packaged)}
.l-bespoke{color:var(--lens-bespoke)}.l-managed{color:var(--lens-managed)}
.st{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:800;
  letter-spacing:.02em;border:1px solid;white-space:nowrap}
.st-saleable{color:var(--aqua);border-color:rgba(0,255,255,.5);background:rgba(0,255,255,.09)}
.st-proposed{color:var(--green-yellow);border-color:rgba(218,255,0,.5);background:rgba(218,255,0,.08)}
.st-development{color:var(--light-pink);border-color:rgba(255,183,255,.5);background:rgba(255,183,255,.08)}
.st-internal{color:var(--light-grey);border-color:rgba(157,159,162,.5);background:rgba(157,159,162,.09)}
.st-archived{color:var(--light-grey);border-color:rgba(157,159,162,.35);background:transparent}
.cf-verified{color:var(--aqua)}.cf-current{color:var(--pale-blue)}
.cf-needs-review{color:var(--green-yellow)}.cf-draft{color:var(--cool-lilac)}.cf-archived{color:var(--light-grey)}
.rel-core{color:var(--aqua)}.rel-strong{color:var(--pale-blue)}.rel-applicable{color:var(--light-grey)}
.rel-emerging{color:var(--green-yellow)}.rel-illustrative{color:var(--light-pink)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}

/* ── Matrix ──────────────────────────────────────────────── */
.mwrap{border:1px solid var(--line);border-radius:var(--r-lg);overflow-x:auto;background:rgba(0,0,20,.42)}
@media(min-width:1081px){
  .mwrap{overflow:visible}
  .matrix>.mhead{position:sticky;top:calc(var(--topH,60px) + var(--filterH,86px));z-index:8}
  .matrix>.mhead:first-child{z-index:9}
}
.stack{display:none}
.stackband{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:var(--light-blue);
  padding:12px 2px 7px}
.stackacc>summary{font-size:14.5px}
.stacklens{margin-bottom:12px}
.stacklens:last-child{margin-bottom:0}
.stacklenshead{margin-bottom:7px}
@media(max-width:860px){
  .stack{display:block}
  .mwrap{display:none}
}
.matrix{display:grid;grid-template-columns:236px repeat(4,minmax(190px,1fr));min-width:1080px}
.mhead{z-index:6;background:#03032e;padding:12px 13px;border-bottom:1px solid var(--line);border-left:1px solid var(--line-soft)}
.mhead:first-child{border-left:0;z-index:7;position:sticky;left:0}
.mhead .lensname{font-size:14.5px;font-weight:900;letter-spacing:-.01em}
.mhead .lensq{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.35}
.band{grid-column:1/-1;position:sticky;left:0;background:#03032e;display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:rgba(0,174,255,.09);border-top:1px solid var(--line);border-bottom:1px solid var(--line-soft)}
.band b{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--light-blue);font-weight:800}
.band span{font-size:11.5px;color:var(--dim)}
.prow{display:contents}
.pcell{position:sticky;left:0;z-index:4;background:#03032e;border-top:1px solid var(--line-soft);padding:12px 13px;
  border-right:1px solid var(--line)}
.pcell .pname{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px}
.pcell .pbar{width:4px;align-self:stretch;border-radius:2px;background:currentColor;min-height:20px}
.pcell .pmeta{font-size:11px;color:var(--dim);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.cell{border-top:1px solid var(--line-soft);border-left:1px solid var(--line-soft);padding:9px;display:flex;flex-direction:column;gap:7px;min-height:74px}
.cell.empty{background:repeating-linear-gradient(135deg,transparent,transparent 7px,rgba(255,255,255,.028) 7px,rgba(255,255,255,.028) 14px)}
.gapnote{border:1px dashed rgba(218,255,0,.55);border-radius:var(--r-sm);padding:8px 9px;font-size:11.5px;color:var(--green-yellow);line-height:1.4}
.gapnote b{display:block;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;margin-bottom:3px}
.relwrap{display:flex;flex-direction:column;gap:5px}
.relunder{padding-left:2px}
.schip{width:100%;border:1px solid var(--line);border-left:3px solid var(--lens-advisory);border-radius:var(--r-sm);
  background:var(--surface);padding:8px 10px;transition:.14s;position:relative;overflow:hidden}
.schip:hover{background:var(--surface2);border-color:var(--light-blue);transform:translateY(-1px)}
.schip .sname{font-size:13px;font-weight:700;line-height:1.3}
.schip .sout{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.35}
.schip .smeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;align-items:center}
.schip .tiny{font-size:10.5px;color:var(--light-grey);display:inline-flex;align-items:center;gap:4px}
.schip.prov-synthesised-opportunity,.schip.prov-mock-illustrative{border-style:dashed;border-left-style:solid}
.ribbon{position:absolute;top:0;right:0;font-size:8.5px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;
  padding:2px 7px;border-radius:0 0 0 7px;background:rgba(218,255,0,.2);color:var(--green-yellow)}
.ribbon.ill{background:rgba(255,183,255,.2);color:var(--light-pink)}
body.dens-executive .schip .sout,body.dens-executive .schip .smeta{display:none}
body.dens-detailed .schip .sdetail{display:block}
.schip .sdetail{display:none;font-size:11px;color:var(--light-grey);margin-top:6px;border-top:1px solid var(--line-soft);padding-top:6px;line-height:1.45}

/* ── Filter bar ──────────────────────────────────────────── */
.filterdock{position:sticky;top:var(--topH,60px);z-index:30;background:rgba(0,0,37,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:7px 20px 8px}
.filterdock .filters{max-width:1680px;margin:auto;gap:6px 8px;align-items:end}
.filterdock .fgrp label{font-size:8.5px;letter-spacing:.9px;margin-bottom:1px}
.filterdock .ctl{padding:5px 7px;font-size:12.5px;max-width:none}
.filterdock select.ctl{width:118px}
.filterdock #fq{width:180px}
.filterdock .btn.sm{min-height:29px;padding:4px 9px;font-size:12px}
.filterdock .count{font-size:12px}
.filterdock.hidden{display:none}
/* Practice identities: colour AND pattern, so colour is never the only signal */
.pmark{width:14px;height:14px;border-radius:4px;display:inline-block;position:relative;overflow:hidden;flex:0 0 auto;
  background-color:currentColor;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.pmark.lg{width:20px;height:20px;border-radius:5px}
.pat-dots{background-image:radial-gradient(rgba(0,0,37,.62) 1px,transparent 1.1px);background-size:4px 4px}
.pat-diag{background-image:repeating-linear-gradient(45deg,rgba(0,0,37,.55) 0 2px,transparent 2px 5px)}
.pat-block{background-image:repeating-linear-gradient(0deg,rgba(0,0,37,.5) 0 2px,transparent 2px 6px)}
.pat-bars{background-image:repeating-linear-gradient(90deg,rgba(0,0,37,.5) 0 2px,transparent 2px 5px)}
.pat-net{background-image:repeating-linear-gradient(45deg,rgba(0,0,37,.45) 0 1px,transparent 1px 6px),repeating-linear-gradient(-45deg,rgba(0,0,37,.4) 0 1px,transparent 1px 8px)}
.pat-wave{background-image:repeating-linear-gradient(0deg,rgba(0,0,37,.45) 0 1px,transparent 1px 5px)}
.pat-rings{background-image:radial-gradient(circle at 50% 50%,transparent 2px,rgba(0,0,37,.5) 2.4px,transparent 3.2px,rgba(0,0,37,.4) 3.6px,transparent 4.6px)}
.pat-grid{background-image:repeating-linear-gradient(0deg,rgba(0,0,37,.45) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(0,0,37,.45) 0 1px,transparent 1px 4px)}
.pat-steps{background-image:repeating-linear-gradient(135deg,rgba(0,0,37,.5) 0 2px,transparent 2px 4px,rgba(0,0,37,.3) 4px 5px,transparent 5px 8px)}
.idlegend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 13px;font-size:12px;margin-bottom:13px}
.idlegend .li{display:flex;align-items:center;gap:6px;color:var(--txt);font-weight:700}
.picon{display:inline-flex;align-items:center;flex:0 0 auto}
.picon svg path:first-child{stroke:currentColor}
.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.acc+.acc{margin-top:10px}
.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 15px;font-weight:800;font-size:15px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:hover{background:var(--surface2)}
.acc>summary .sright{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.accchev{color:var(--dim);font-size:11px;transition:transform .15s}
.acc[open]>summary .accchev{transform:rotate(180deg)}
.acc[open]>summary{border-bottom:1px solid var(--line-soft)}
.accbody{padding:13px 15px 15px;display:flex;flex-direction:column;gap:7px}
.scopechip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--light-blue);background:rgba(0,174,255,.14);
  border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:800;color:var(--light-blue)}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;background:transparent;border:0;
  border-radius:var(--r);padding:0;margin:0}
.fgrp{display:flex;flex-direction:column;gap:4px}
.fgrp label{font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;font-weight:800;color:var(--dim)}
.count{font-size:13px;color:var(--dim);margin-left:auto;align-self:center}

/* ── Tables ──────────────────────────────────────────────── */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
table.tbl th{background:#03032e;text-align:left;padding:10px;font-size:10.5px;letter-spacing:1px;
  text-transform:uppercase;color:var(--dim);font-weight:800;white-space:nowrap;border-bottom:1px solid var(--line);z-index:2}
table.tbl td{padding:9px 10px;border-top:1px solid var(--line-soft);vertical-align:middle}
table.tbl tr:hover td{background:var(--surface)}
table.tbl input,table.tbl select{background:rgba(0,0,60,.8);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12.5px;max-width:190px}
.linkish{color:var(--light-blue);font-weight:700}
.linkish:hover{text-decoration:underline}

/* ── Stats & health ──────────────────────────────────────── */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:28px;font-weight:900;letter-spacing:-.03em;color:var(--light-blue)}
.stat span{font-size:12.5px;color:var(--dim)}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:9px}
.meter i{display:block;height:100%;background:var(--light-blue)}
.warn{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-left:3px solid var(--green-yellow);
  border-radius:var(--r-sm);padding:10px 12px;background:var(--surface)}
.warn.sev-high{border-left-color:var(--magenta)}
.warn.sev-info{border-left-color:var(--pale-blue)}
.warn .wmsg{font-size:13.5px}
.warn .wrule{font-size:10.5px;color:var(--dim);letter-spacing:.6px;text-transform:uppercase;font-weight:800;margin-top:3px}

/* ── Drawer ──────────────────────────────────────────────── */
.drawer{position:fixed;inset:0;z-index:60;pointer-events:none}
.shade{position:absolute;inset:0;background:rgba(0,0,15,.72);opacity:0;transition:opacity .2s}
.dbox{position:absolute;top:0;right:0;height:100%;width:min(760px,100%);background:#02022a;border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .24s;overflow:auto;box-shadow:var(--shadow)}
.drawer.open{pointer-events:auto}.drawer.open .shade{opacity:1}.drawer.open .dbox{transform:none}
.dhead{position:sticky;top:0;background:#02022a;z-index:3;padding:16px 22px 13px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.dbody{padding:18px 22px 40px}
.close{border:1px solid var(--line);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.close:hover{border-color:var(--light-blue);background:var(--surface2)}
.kv{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:9px 11px}
.kv b{display:block;font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);margin-bottom:4px;font-weight:800}
.kv span{font-size:13.5px}
.field{margin-bottom:14px}
.field>b{display:block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--light-blue);font-weight:800;margin-bottom:7px}
.field ul{margin:0;padding-left:19px}.field li{font-size:13.5px;margin:3px 0;line-height:1.45}
.note{border-left:3px solid var(--light-blue);background:rgba(0,174,255,.08);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:11px 13px;font-size:13.5px;line-height:1.5}
.note.caution{border-left-color:var(--green-yellow);background:rgba(218,255,0,.07)}

/* ── Modal ───────────────────────────────────────────────── */

function expandThin(){
  const out=[];
  Object.keys(CATALOGUE).forEach(pid=>{
    ['advisory','packaged','bespoke','managed'].forEach(lk=>{
      (CATALOGUE[pid][lk]||[]).forEach(raw=>{
        let name=raw, status='saleable', confidence='current', provenance='evidence-backed', customerFacing=true;
        while(name.length && '!~?%@'.indexOf(name.slice(-1))>-1){
          const m=name.slice(-1); name=name.slice(0,-1);
          if(m==='!'){status='proposed'; provenance='synthesised-opportunity'; confidence='draft';}
          else if(m==='~'){provenance='evidence-backed-lens-synthesised';}
          else if(m==='?'){confidence='needs-review';}
          else if(m==='%'){status='development'; confidence='needs-review';}
          else if(m==='@'){status='internal'; customerFacing=false;}
        }
        /* Products are attached only on a literal name match. Nothing is inferred. */
        const products = SEED_PRODUCTS.filter(p => name.toLowerCase().indexOf(p.name.toLowerCase())>-1).map(p=>p.id);
        out.push({
          id:'solution-'+slug(name), name:name, shortName:'', displayName:'',
          shortDescription:'', customerProblem:LENS_PROBLEM[lk], customerOutcome:LENS_OUTCOME[lk],
          primaryPractice:pid, contributingPractices:[], primaryLens:'lens-'+lk, supportingLenses:[],
          capabilityCategory:'', solutionType:'', products:products, vendors:[],
          status:status, maturity:'', confidence:confidence, provenance:provenance, customerFacing:customerFacing,
          triggers:[], personas:[], qualification:{questions:[],inclusion:[],exclusion:[],prerequisites:[]},
          delivery:{scope:'',activities:[],outputs:[],deliveryModel:'',commercialModel:'',duration:'',pricingVisibility:'not-published',roles:[],availability:''},
          tech:{platforms:[],dataRequirements:'',security:'',governance:'',integration:''},
          governance:{owner:'Owner to be confirmed',curator:'Curator to be confirmed',approver:'',contributors:[],
                      lastReviewed:'',nextReview:'',gaps:[]},
          content:{collateral:[],caseStudies:[],staffnetLinks:[],sidLinks:[]},
          relationships:{precededBy:[],nextSolutions:[],managedDestination:'',alternatives:[],pairings:[]},
          enriched:false
        });
      });
    });
  });
  return out;
}

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function mergeInto(base, patch){
  Object.keys(patch||{}).forEach(k=>{
    const v=patch[k];
    if(v && typeof v==='object' && !Array.isArray(v)){ base[k]=mergeInto(base[k]?deepClone(base[k]):{}, v); }
    else base[k]=Array.isArray(v)?v.slice():v;
  });
  return base;
}

function buildSeed(){
  const solutions=[], seen={}, dupes=[];
  expandThin().forEach(s=>{
    if(seen[s.id]){
      /* Same capability name recorded under two practices — keep both, flag as a duplicate candidate. */
      const suffix = s.primaryPractice.replace('practice-','');
      dupes.push({a:seen[s.id], b:s.id+'-'+suffix, name:s.name});
      s.id = s.id+'-'+suffix;
    }
    seen[s.id]=s.id; solutions.push(s);
  });
  CROSS_PRACTICE.forEach(cp=>{
    const lk = cp.primaryLens.replace('lens-','');
    const rec = mergeInto(deepClone(BLANK_SOLUTION), {
      id:cp.id, name:cp.name, customerProblem:LENS_PROBLEM[lk], customerOutcome:LENS_OUTCOME[lk],
      primaryPractice:cp.primaryPractice, primaryLens:cp.primaryLens, contributingPractices:cp.contributingPractices,
      status:cp.status, confidence:cp.confidence, provenance:cp.provenance,
      customerFacing:cp.customerFacing===false?false:true
    });
    solutions.push(rec);
  });
  /* Enrichment */
  solutions.forEach(s=>{ if(HERO[s.id]){ mergeInto(s, HERO[s.id]); s.enriched=true; } });
  /* Progression chains */
  const byId = {}; solutions.forEach(s=>byId[s.id]=s);
  CHAINS.forEach(chain=>{
    const managed = chain[chain.length-1];
    chain.forEach((id,i)=>{
      const s=byId[id]; if(!s) return;
      if(i>0 && byId[chain[i-1]] && s.relationships.precededBy.indexOf(chain[i-1])<0) s.relationships.precededBy.push(chain[i-1]);
      if(i<chain.length-1 && byId[chain[i+1]] && s.relationships.nextSolutions.indexOf(chain[i+1])<0) s.relationships.nextSolutions.push(chain[i+1]);
      if(byId[managed] && id!==managed && !s.relationships.managedDestination) s.relationships.managedDestination = managed;
    });
  });
  const rels = SEED_IND_REL.map((r,i)=>({
    id:'solution-industry-'+String(i+1).padStart(3,'0'),
    solutionId:r[0], industryId:r[1], relevance:r[2], status:r[3], rationale:r[4],
    customerTriggers:[], useCases:[], evidenceLinks:[], staffnetVisibility:(r[3]==='jointly-confirmed'?'approved':'proposed'),
    practiceApproval:(r[3]==='practice-confirmed'||r[3]==='jointly-confirmed')?'approved':(r[3]==='rejected'?'rejected':'pending'),
    industryApproval:(r[3]==='industry-confirmed'||r[3]==='jointly-confirmed')?'approved':(r[3]==='rejected'?'rejected':'pending'),
    submittedBy:'Seed data', submittedAt:'2026-07-01', lastReviewed:(r[3]==='proposed'?'':'2026-07-15'), history:[]
  })).filter(r => solutions.some(s=>s.id===r.solutionId));

  return {
    version:APP_VERSION, seedVersion:SEED_VERSION, savedAt:'',
    practices:deepClone(SEED_PRACTICES), lenses:deepClone(SEED_LENSES), industries:deepClone(SEED_INDUSTRIES),
    products:deepClone(SEED_PRODUCTS), vendors:deepClone(SEED_VENDORS), triggers:CUSTOMER_TRIGGERS.slice(),
    solutions:solutions, industryRelationships:rels, gaps:deepClone(SEED_GAPS), duplicateSeeds:dupes,
    audit:[{at:'2026-08-03', actor:'Seed', action:'seed-loaded', targetId:'', detail:'Prototype catalogue seeded.'}],
    prefs:{density:'standard'}
  };
}

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.solutions && parsed.seedVersion === SEED_VERSION){ db = parsed; return 'restored'; }
      if(parsed && parsed.solutions){ db = buildSeed(); return 'reseeded'; }
    }
  }catch(e){ /* fall through to a clean seed */ }
  db = buildSeed(); return 'seeded';
}
function save(){
  try{ db.savedAt = todayISO(); localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch(e){ toast('This browser will not store any more local changes.'); }
}
function audit(action, targetId, detail){

}

/* ═══════════════════════════════════════════════════════════
   4. Data quality engine — one pure function, every dashboard
      reads from it (PRD section 30).

function validate(){
  const w=[], add=(rule,severity,message,targetId,route,practiceId)=>w.push({rule,severity,message,targetId,route,practiceId});
  const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const byName = {};
  db.solutions.forEach(s=>{
    const route='#/solution/'+s.id, pid=s.primaryPractice;
    if(!s.primaryPractice) add('no-primary-practice','high','"'+s.name+'" has no primary practice.',s.id,route,pid);
    if(!s.primaryLens) add('no-primary-lens','high','"'+s.name+'" has no primary lens.',s.id,route,pid);
    if(!s.governance.owner || /to be confirmed/i.test(s.governance.owner)) add('no-owner','medium','"'+s.name+'" has no confirmed owner.',s.id,route,pid);
    if(!s.governance.curator || /to be confirmed/i.test(s.governance.curator)) add('no-curator','medium','"'+s.name+'" has no confirmed curator.',s.id,route,pid);
    if(!s.customerOutcome) add('no-customer-outcome','medium','"'+s.name+'" has no customer outcome.',s.id,route,pid);
    if(s.customerFacing===undefined||s.customerFacing===null) add('no-customer-facing-status','info','"'+s.name+'" has no customer-facing status.',s.id,route,pid);
    if(s.status==='saleable' && !(s.content.collateral||[]).length) add('saleable-no-collateral','high','"'+s.name+'" is marked saleable but has no collateral.',s.id,route,pid);
    if(s.primaryLens==='lens-packaged' && !(s.relationships.nextSolutions||[]).length) add('packaged-no-next-motion','medium','Packaged offer "'+s.name+'" has no next motion.',s.id,route,pid);
    if(s.primaryLens==='lens-bespoke' && !s.relationships.managedDestination) add('bespoke-no-managed-destination','medium','Bespoke solution "'+s.name+'" has no managed destination.',s.id,route,pid);
    if(s.primaryLens==='lens-managed' && !(s.relationships.precededBy||[]).length) add('managed-no-entry-pathway','medium','Managed offer "'+s.name+'" has no entry pathway.',s.id,route,pid);
    const isProduct = db.products.some(p=>norm(p.name)===norm(s.name));
    if(isProduct) add('product-as-solution','high','"'+s.name+'" is named identically to a product. Confirm it is a solution, not a product.',s.id,route,pid);
    const allRefs=[].concat(s.relationships.precededBy||[],s.relationships.nextSolutions||[],s.relationships.alternatives||[],s.relationships.managedDestination?[s.relationships.managedDestination]:[]);
    allRefs.forEach(r=>{ if(r && !SOL(r)) add('broken-relationship','high','"'+s.name+'" references a record that no longer exists.',s.id,route,pid); });
    (s.contributingPractices||[]).forEach(cp=>{ if(!db.practices.some(p=>p.id===cp)) add('broken-relationship','high','"'+s.name+'" lists a contributing practice that does not exist.',s.id,route,pid); });
    (byName[norm(s.name)] = byName[norm(s.name)] || []).push(s);
    if(s.governance.nextReview && s.governance.nextReview < todayISO()) add('stale-record','medium','"'+s.name+'" passed its review date on '+auDate(s.governance.nextReview)+'.',s.id,route,pid);
  });
  Object.keys(byName).forEach(k=>{
    if(byName[k].length>1){
      const names = byName[k].map(s=>P(s.primaryPractice).displayName).join(' and ');
      add('possible-duplicate','medium','"'+byName[k][0].name+'" is recorded under '+names+'. Confirm whether these are one offer.',byName[k][0].id,'#/solution/'+byName[k][0].id,byName[k][0].primaryPractice);
    }
  });
  db.industryRelationships.forEach(r=>{
    const s=SOL(r.solutionId);
    if(!s){ add('broken-relationship','high','An industry mapping points at a record that no longer exists.',r.id,'#/admin/industry'); return; }
    if(!r.rationale || r.rationale.length<10) add('industry-mapping-no-rationale','medium','The '+I(r.industryId).name+' mapping on "'+s.name+'" has no rationale.',r.id,'#/solution/'+s.id,s.primaryPractice);
    if(r.status==='proposed' && !r.lastReviewed) add('industry-mapping-stale','info','The '+I(r.industryId).name+' mapping on "'+s.name+'" has never been reviewed.',r.id,'#/admin/industry',s.primaryPractice);
  });
  db.practices.forEach(p=>{
    if(p.namingStatus==='requires-confirmation') add('practice-name-needs-confirmation','info','The practice name "'+p.displayName+'" requires confirmation.',p.id,'#/practice/'+p.id,p.id);
  });
  db.industries.forEach(i=>{
    if(!relsForIndustry(i.id).length) add('industry-no-coverage','info',i.name+' has no mapped solutions.',i.id,'#/industry/'+i.id);
  });
  return w;
}

  'saleable-no-collateral':'Saleable without collateral','packaged-no-next-motion':'Packaged offer without a next motion',
  'bespoke-no-managed-destination':'Bespoke without a managed destination','managed-no-entry-pathway':'Managed without an entry pathway',
  'industry-mapping-no-rationale':'Industry mapping without rationale','industry-mapping-stale':'Industry mapping never reviewed',
  'product-as-solution':'Product presented as a solution','broken-relationship':'Broken relationship',
  'possible-duplicate':'Possible duplicate','practice-name-needs-confirmation':'Practice name needs confirmation',
  'stale-record':'Past its review date','industry-no-coverage':'Industry without coverage'

function matchesFilters(s){
  const f=S.filters;
  if(f.practice && s.primaryPractice!==f.practice && (s.contributingPractices||[]).indexOf(f.practice)<0) return false;
  if(f.lens && s.primaryLens!==f.lens && (s.supportingLenses||[]).indexOf(f.lens)<0) return false;
  if(f.status && s.status!==f.status) return false;
  if(f.provenance && s.provenance!==f.provenance) return false;
  if(f.confidence && s.confidence!==f.confidence) return false;
  if(f.product && (s.products||[]).indexOf(f.product)<0) return false;
  if(f.vendor && !(s.products||[]).some(p=>PR(p).vendor===f.vendor)) return false;
  if(f.cross && !(s.contributingPractices||[]).length) return false;
  if(f.industry){ if(!relsFor(s.id).some(r=>r.industryId===f.industry)) return false; }
  if(f.relevance){ if(!relsFor(s.id).some(r=>r.relevance===f.relevance)) return false; }
  if(f.relStatus){ if(!relsFor(s.id).some(r=>r.status===f.relStatus)) return false; }
  if(S.q){
    const q=S.q.toLowerCase();
    const bag=[s.name,s.shortDescription,s.customerProblem,s.customerOutcome,s.capabilityCategory,s.solutionType,
      P(s.primaryPractice).displayName, L(s.primaryLens).name, STATUS_LABEL[s.status],
      (s.triggers||[]).join(' '), (s.products||[]).map(p=>PR(p).name).join(' '),
      (s.products||[]).map(p=>V(PR(p).vendor).name).join(' '),
      relsFor(s.id).map(r=>I(r.industryId).name+' '+(I(r.industryId).aliases||[]).join(' ')).join(' '),
      s.governance.owner, (s.content.collateral||[]).join(' ')].join(' ').toLowerCase();
    if(bag.indexOf(q)<0) return false;
  }
  return true;
}
function whyMatched(s){
  if(!S.q) return '';
  const q=S.q.toLowerCase(), hits=[];
  if(s.name.toLowerCase().indexOf(q)>-1) hits.push('name');
  if((s.customerOutcome||'').toLowerCase().indexOf(q)>-1) hits.push('customer outcome');
  if((s.triggers||[]).join(' ').toLowerCase().indexOf(q)>-1) hits.push('customer trigger');
  if((s.products||[]).map(p=>PR(p).name).join(' ').toLowerCase().indexOf(q)>-1) hits.push('product');
  if(relsFor(s.id).map(r=>I(r.industryId).name).join(' ').toLowerCase().indexOf(q)>-1) hits.push('industry');
  if(P(s.primaryPractice).displayName.toLowerCase().indexOf(q)>-1) hits.push('practice');
  return hits.length? 'Matched on '+hits.join(', ')+'.' : 'Matched on record content.';
}
function nextAction(s){
  if(s.status==='proposed') return 'Validate the scope with the owning practice before positioning.';
  if(s.status==='development') return 'Not yet saleable. Confirm availability with the practice.';
  if(s.status==='internal') return 'Internal capability concept. Do not position to customers.';
  if(!(s.content.collateral||[]).length) return 'Saleable, but no collateral is attached. Ask the practice for material.';
  if((s.relationships.nextSolutions||[]).length) return 'Position now, then follow with '+SOL(s.relationships.nextSolutions[0]).name+'.';
  return 'Position now and qualify with the practice.';
}

  const sols=S.filters.practice ? matched.filter(s=>s.primaryPractice===S.filters.practice) : matched;
  const contributed=matched.length-sols.length;
  const anyFilter=Object.keys(S.filters).some(k=>S.filters[k])||!!S.q;
  /* With a filter on, a row or column that cannot hold anything is noise, not information. */
  const lensCols = S.filters.lens ? db.lenses.filter(l=>l.id===S.filters.lens) : db.lenses;
  const rowHas = p => sols.some(s=>s.primaryPractice===p.id && lensCols.some(l=>l.id===s.primaryLens));
  const shownPractices = S.filters.practice ? db.practices.filter(p=>p.id===S.filters.practice)
    : anyFilter ? db.practices.filter(rowHas) : db.practices;
  const hiddenCount = db.practices.length - shownPractices.length;
  let h='<div class="head"><div><div class="eyebrow">Practice by commercial lens</div><h1>The portfolio on one screen</h1>'+
    '<p class="lede">Rows follow the Service and Solutions Capability structure. Columns are the four commercial motions. Empty cells are as informative as full ones.</p></div>'+
    '<div class="row noprint"><div class="fgrp"><label for="fdens">Density</label><select class="ctl" id="fdens">'+
      ['executive','standard','detailed'].map(d=>'<option value="'+d+'"'+(S.density===d?' selected':'')+'>'+d.charAt(0).toUpperCase()+d.slice(1)+'</option>').join('')+
    '</select></div></div></div>';
  h+=legend();
  if(anyFilter && !shownPractices.length)
    return h+'<div class="empty"><h3>Nothing matches these filters</h3><p>No practice holds a record for this combination. That is itself worth knowing &mdash; it may be a portfolio gap.</p>'+
      '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="S.filters={};S.q=\'\';render()">Clear the filters</button></div></div>';
  /* Small screens get practice-first navigation rather than a matrix squeezed
     until it is unreadable. Same records, same filters, different shape. */
  h+='<div class="stack" aria-label="Practices">'+
    LAYERS.map(layer=>{
      const practices=shownPractices.filter(p=>p.layer===layer.id);
      if(!practices.length) return '';
      return (shownPractices.length>1?'<div class="stackband">'+esc(layer.name)+'</div>':'')+
        practices.map(p=>{
          const mine=sols.filter(s=>s.primaryPractice===p.id);
          const open=!(S.stackClosed||{})[p.id];
          return '<details class="acc stackacc"'+(open?' open':'')+'><summary data-stack="'+p.id+'">'+
            '<span style="display:flex;align-items:center;gap:9px;color:'+p.colour+'">'+picon(p.id,17)+pmark(p.id)+
            '<span style="color:var(--txt)">'+esc(p.displayName)+'</span></span>'+
            '<span class="sright"><span class="qcount">'+num(mine.length)+'</span><span class="accchev">&#9660;</span></span></summary>'+
            '<div class="accbody">'+
              (lensCols.map(l=>{
                const cell=mine.filter(s=>s.primaryLens===l.id);
                const gap=db.gaps.find(g=>g.practiceId===p.id && g.lensKey===l.key);
                if(!cell.length && !gap) return '';
                return '<div class="stacklens"><div class="stacklenshead">'+lensChip(l.id)+'</div>'+
                  cell.map(s=>solutionChip(s)).join('')+
                  (gap?'<div class="gapnote"><b>Portfolio gap</b>'+esc(gap.title)+'</div>':'')+'</div>';
              }).join('') || '<p class="sub">No record matches the current filters.</p>')+
            '</div></details>';
        }).join('');
    }).join('')+'</div>';
  h+='<div class="mwrap"><div class="matrix" style="grid-template-columns:236px repeat('+lensCols.length+',minmax(190px,1fr))">';
  h+='<div class="mhead"><div class="lensname">Practice</div><div class="lensq">Capability structure</div></div>';
  lensCols.forEach(l=>{
    h+='<div class="mhead" style="border-top:3px solid '+l.colour+'"><div class="lensname" style="color:'+l.colour+'">'+
       '<span class="lenschip l-'+l.key+'" style="border:0;background:none;padding:0"><span class="letter"><b>'+l.letter+'</b></span>'+esc(l.name)+'</span></div>'+
       '<div class="lensq">'+esc(l.question)+'</div></div>';
  });
  const showBands=shownPractices.length>1;
  LAYERS.forEach(layer=>{
    const practices=shownPractices.filter(p=>p.layer===layer.id);
    if(!practices.length) return;
    if(showBands) h+='<div class="band"><b>'+esc(layer.name)+'</b><span>'+esc(layer.note)+'</span></div>';
    practices.forEach(p=>{
      h+='<div class="pcell" style="color:'+p.colour+'">'+
         '<a class="pname" href="#/practice/'+p.id+'" style="color:'+p.colour+'"><span class="pbar"></span>'+picon(p.id,18)+pmark(p.id,true)+
         '<span style="color:var(--txt)">'+esc(p.displayName)+'</span></a>'+
         '<div class="pmeta"><span class="chip plain">'+esc(DELIVERY[p.delivery]||'')+'</span>'+
         (p.isCapabilityLayer?'<span class="chip plain">Capability layer</span>':'')+'</div></div>';
      lensCols.forEach(l=>{
        const cell=sols.filter(s=>s.primaryPractice===p.id && s.primaryLens===l.id);
        const gap=db.gaps.find(g=>g.practiceId===p.id && g.lensKey===l.key);
        h+='<div class="cell'+(cell.length?'':' empty')+'">';
        h+=cell.map(s=>solutionChip(s)).join('');
        if(gap) h+='<div class="gapnote"><b>Portfolio gap</b>'+esc(gap.title)+'</div>';
        if(!cell.length && !gap) h+='<div style="font-size:11.5px;color:var(--dim)">No record matches the current filters.</div>';
        h+='</div>';
      });
    });
  });
  h+='</div></div>';
  h+='<p class="sub" style="margin-top:12px">Showing '+num(sols.length)+' of '+num(visibleSolutions().length)+' records'+
     (hiddenCount?', across '+num(shownPractices.length)+' of '+num(db.practices.length)+' practices. '+
       num(hiddenCount)+' with nothing matching '+(hiddenCount===1?'is':'are')+' hidden':'')+
     (S.filters.lens?'. Showing the '+esc(L(S.filters.lens).name)+' motion only':'')+'.'+
     (contributed?' A further '+num(contributed)+' '+plural(contributed,'record')+' '+(contributed===1?'lists':'list')+' '+
       esc(P(S.filters.practice).displayName)+' as a contributing practice and '+(contributed===1?'sits':'sit')+
       ' under '+(contributed===1?'its':'their')+' own owner. <a class="linkish" href="#/practice/'+S.filters.practice+'">See them on the practice view</a>.':'')+'</p>';
  return h;
}

/* ═══════════════════════════════════════════════════════════

function coverageFor(pid){
  const own=practiceSolutions(pid), ids=own.map(s=>s.id);
  const rels=db.industryRelationships.filter(r=>ids.indexOf(r.solutionId)>-1);
  const byInd={};
  db.industries.forEach(i=>byInd[i.id]={ind:i, confirmed:0, suggested:0, disputed:0, total:0});
  rels.forEach(r=>{
    const b=byInd[r.industryId]; if(!b) return; b.total++;
    if(r.status==='jointly-confirmed') b.confirmed++;
    else if(r.status==='rejected') b.disputed++;
    else b.suggested++;
  });
  const unmapped=own.filter(s=>!rels.some(r=>r.solutionId===s.id));
  return {byInd:byInd, unmapped:unmapped, rels:rels};
}

  const p=P(pid); if(!p.displayName) return viewMissing('practice');

       '</div></div>';
  });
  h+='</div></div>';

  /* Industry coverage */
  h+='<div class="sec"><h2>Industry coverage</h2><p class="sub">Which industries consume this practice, and who confirmed it.</p>'+
     '<div class="tw" style="margin-top:12px"><table class="tbl"><thead><tr><th>Industry</th><th>Solutions</th><th>Jointly confirmed</th><th>Awaiting confirmation</th><th>Rejected</th><th></th></tr></thead><tbody>'+
     db.industries.map(i=>{ const b=cov.byInd[i.id];
       return '<tr><td><b>'+esc(i.name)+'</b></td><td>'+num(b.total)+'</td><td>'+num(b.confirmed)+'</td><td>'+num(b.suggested)+'</td><td>'+num(b.disputed)+'</td>'+
       '<td><a class="linkish" href="#/industry/'+i.id+'">Open</a></td></tr>'; }).join('')+
     '</tbody></table></div>';
  if(cov.unmapped.length) h+='<p class="sub" style="margin-top:10px">'+num(cov.unmapped.length)+' '+plural(cov.unmapped.length,'record')+' in this practice '+(cov.unmapped.length===1?'has':'have')+' no industry mapping at all.</p>';
  h+='</div>';

  /* Contributions and products */
  h+='<div class="sec grid g2">'+
    '<div class="card"><h3>Contributes to</h3><p class="sub" style="margin-bottom:10px">Records owned elsewhere that need this practice in the room.</p>'+
    '<div class="grid" style="gap:8px">'+(contrib.length?contrib.map(s=>solutionChip(s,{showPractice:true})).join(''):'<p class="sub">No contributed records.</p>')+'</div></div>'+
    '<div class="card"><h3>Products and vendors</h3><p class="sub" style="margin-bottom:10px">Products support these solutions. They are not the catalogue structure.</p><div class="row">'+
    (function(){ const ids={}; own.forEach(s=>(s.products||[]).forEach(p=>ids[p]=1));

       : '<p class="sub">No warnings for this practice.</p>')+'</div></div>';
  return h;
}

function viewLens(lensId){
  const l=L(lensId); const sols=visibleSolutions().filter(matchesFilters).filter(s=>s.primaryLens===lensId);
  let h='<div class="head"><div><div class="eyebrow" style="color:'+l.colour+'">Commercial lens</div>'+
    '<h1>'+esc(l.name)+'</h1><p class="lede">'+esc(l.question)+'</p><p class="sub">'+esc(l.promise)+'</p></div>'+
    '<div class="row noprint">'+
    '<button class="btn'+(S.lensMode==='grid'?' on':'')+'" data-lensmode="grid">By practice</button>'+
    '<button class="btn'+(S.lensMode==='gap'?' on':'')+'" data-lensmode="gap">Gap mode</button>'+
    '<button class="btn'+(S.lensMode==='compare'?' on':'')+'" data-lensmode="compare">Compare</button>'+
    '</div></div>';

  if(S.lensMode==='compare'){
    const a=S.practiceScope, b=S.compareWith||db.practices.filter(p=>p.id!==a)[0].id;
    h+='<div class="row noprint" style="margin-bottom:12px">'+
      '<div class="fgrp"><label for="cmpA">Practice A</label><select class="ctl" id="cmpA">'+selOpts(db.practices,a,'id','displayName','')+'</select></div>'+
      '<div class="fgrp"><label for="cmpB">Practice B</label><select class="ctl" id="cmpB">'+selOpts(db.practices,b,'id','displayName','')+'</select></div>'+
      '<a class="btn sm" href="#/lens/'+lensId+'" onclick="return true">All practices</a></div>';
    h+='<div class="grid g2">'+[a,b].map(pid=>{
      const cell=sols.filter(s=>s.primaryPractice===pid);
      const gap=db.gaps.find(g=>g.practiceId===pid && g.lensKey===l.key);
      return '<div class="card" style="border-top:3px solid '+P(pid).colour+'"><h3>'+esc(P(pid).displayName)+'</h3>'+
        '<p class="sub" style="margin-bottom:10px">'+num(cell.length)+' '+plural(cell.length,'record')+' in this lens</p>'+
        '<div class="grid" style="gap:8px">'+(cell.length?cell.map(s=>solutionChip(s)).join(''):'<p class="sub">No records.</p>')+
        (gap?'<div class="gapnote"><b>Portfolio gap</b>'+esc(gap.title)+'</div>':'')+'</div></div>';
    }).join('')+'</div>';
    return h;
  }

  const practices = S.lensMode==='gap'
    ? db.practices.slice().sort((x,y)=> sols.filter(s=>s.primaryPractice===x.id).length - sols.filter(s=>s.primaryPractice===y.id).length)
    : db.practices;
  h+='<div class="grid g3" style="margin-top:6px">'+practices.map(p=>{
    const cell=sols.filter(s=>s.primaryPractice===p.id);
    const gap=db.gaps.find(g=>g.practiceId===p.id && g.lensKey===l.key);

    return '<div class="card" style="border-top:3px solid '+p.colour+'"><div class="spread" style="margin-bottom:9px">'+
      '<a class="linkish" href="#/practice/'+p.id+'">'+esc(p.displayName)+'</a><span class="chip plain">'+num(cell.length)+'</span></div>'+
      '<div class="grid" style="gap:7px">'+
      (cell.length?cell.map(s=>solutionChip(s)).join(''):'<p class="sub">No record in this lens.</p>')+
      (gap?'<div class="gapnote"><b>Portfolio gap</b>'+esc(gap.title)+'<div style="margin-top:5px;color:var(--dim)">'+esc(gap.note)+'</div></div>':'')+
      '</div></div>';
  }).join('')+'</div>';
  if(S.lensMode==='gap') h+='<p class="sub" style="margin-top:12px">Gap mode shows only practices with no record in this lens, or with a recorded gap.</p>';
  return h;
}

function solutionBody(s){
  const l=L(s.primaryLens), p=P(s.primaryPractice), rels=relsFor(s.id);
  const list=(arr,empty)=>arr&&arr.length?'<ul>'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="sub">'+esc(empty)+'</p>';
  let h='';

  h+='<div class="row" style="margin-bottom:10px">'+lensChip(s.primaryLens)+statusChip(s)+confChip(s)+provChip(s)+
     (s.customerFacing===false?'<span class="chip" style="color:var(--light-pink)"><span class="dot"></span>Not customer-facing</span>':'')+'</div>';
  h+='<h2>'+esc(s.name)+'</h2>';
  if(s.shortDescription) h+='<p class="lede">'+esc(s.shortDescription)+'</p>';
  if(!s.enriched) h+='<div class="note caution" style="margin-top:12px">This record carries the capability name from the source catalogue. Its detail has not yet been written by an owner.</div>';
  if(s.status==='proposed'||s.status==='development'||s.status==='internal')
    h+='<div class="note caution" style="margin-top:12px"><b>'+esc(STATUS_LABEL[s.status])+'.</b> '+
      (s.status==='development'?'This is in development and must not be positioned as currently saleable.':
       s.status==='internal'?'This is an internal capability concept and must not appear in customer-facing material.':
       'This is an opportunity, not an approved offer. Scope requires validation by the owning practice.')+'</div>';

  h+='<div class="row noprint" style="margin-top:14px">'+
     '<button class="btn primary" data-flag="'+esc(s.id)+'">'+ic('flag',15)+'Flag industry relevance</button>'+
     (canEditSolution(s)?'<button class="btn" data-edit="'+esc(s.id)+'">'+ic('edit',15)+'Edit record</button>':'')+
     '<a class="btn" href="#/journeys">'+ic('journey',15)+'See the journey</a></div>';

  if(S.q) h+='<div class="note" style="margin-top:14px">'+esc(whyMatched(s))+'</div>';
  h+='<div class="note" style="margin-top:14px"><b>Recommended next action.</b> '+esc(nextAction(s))+
     '<div style="font-size:12px;color:var(--dim);margin-top:7px">Recommendations in this prototype use configured catalogue relationships and matching rules. Formal opportunity qualification and solution architecture remain required.</div></div>';

  h+='<div class="grid g2" style="margin-top:16px">'+
    '<div class="kv"><b>Customer problem</b><span>'+esc(s.customerProblem||'Not recorded.')+'</span></div>'+
    '<div class="kv"><b>Customer outcome</b><span>'+esc(s.customerOutcome||'Not recorded.')+'</span></div>'+
    '<div class="kv"><b>Primary practice</b><span><a class="linkish" href="#/practice/'+p.id+'">'+esc(p.displayName)+'</a></span></div>'+
    '<div class="kv"><b>Contributing practices</b><span>'+((s.contributingPractices||[]).length?s.contributingPractices.map(c=>'<a class="linkish" href="#/practice/'+c+'">'+esc(P(c).displayName)+'</a>').join(', '):'None recorded.')+'</span></div>'+
    '<div class="kv"><b>Supporting lenses</b><span>'+((s.supportingLenses||[]).length?s.supportingLenses.map(x=>esc(L(x).name)).join(', '):'None recorded.')+'</span></div>'+
    '<div class="kv"><b>Capability category</b><span>'+esc(s.capabilityCategory||'Not recorded.')+'</span></div>'+
    '</div>';

  /* Industry */
  h+='<div class="field" style="margin-top:20px"><b>Industry relevance</b>';
  if(rels.length){
    h+='<div class="grid" style="gap:8px">'+rels.map(r=>
      '<div class="kv"><div class="spread"><a class="linkish" href="#/industry/'+r.industryId+'">'+esc(I(r.industryId).name)+'</a>'+relChip(r)+'</div>'+
      '<span style="display:block;margin-top:6px;font-size:13px;color:var(--dim)">'+esc(r.rationale||'No rationale recorded.')+'</span>'+
      (can('review-industry')&&(r.status==='proposed'||r.status==='needs-review')
        ? '<div class="row noprint" style="margin-top:9px"><button class="btn sm" data-relconfirm="'+esc(r.id)+'">'+ic('check',13)+'Confirm relevance</button>'+
          '<button class="btn sm danger" data-relreject="'+esc(r.id)+'">'+ic('x',13)+'Reject</button></div>' : '')+
      '</div>').join('')+'</div>';
  } else h+='<p class="sub">No industry has been mapped to this record. Anyone can propose one.</p>';
  h+='</div>';

  h+='<div class="field"><b>Customer triggers &mdash; what you will hear</b>'+list(s.triggers,'No customer triggers recorded.')+'</div>';
  h+='<div class="field"><b>Qualification questions</b>'+list(s.qualification.questions,'No qualification questions recorded.')+'</div>';
  if((s.qualification.inclusion||[]).length||(s.qualification.exclusion||[]).length||(s.qualification.prerequisites||[]).length){
    h+='<div class="grid g3">'+
      '<div class="kv"><b>Fits when</b><span>'+((s.qualification.inclusion||[]).join('; ')||'Not recorded.')+'</span></div>'+
      '<div class="kv"><b>Does not fit when</b><span>'+((s.qualification.exclusion||[]).join('; ')||'Not recorded.')+'</span></div>'+
      '<div class="kv"><b>Prerequisites</b><span>'+((s.qualification.prerequisites||[]).join('; ')||'Not recorded.')+'</span></div></div>';
  }

  h+='<div class="field" style="margin-top:18px"><b>Delivery and commercial</b>'+
    '<p class="sub" style="margin-bottom:10px">'+esc(s.delivery.scope||'Scope not recorded.')+'</p>'+
    '<div class="grid g3">'+
      '<div class="kv"><b>Delivery model</b><span>'+esc(s.delivery.deliveryModel||'Not recorded.')+'</span></div>'+
      '<div class="kv"><b>Commercial model</b><span>'+esc(s.delivery.commercialModel||'Not recorded.')+'</span></div>'+
      '<div class="kv"><b>Indicative duration</b><span>'+esc(s.delivery.duration||'Not recorded.')+'</span></div>'+
    '</div>'+
    '<div class="grid g2" style="margin-top:9px"><div class="kv"><b>Key activities</b><span>'+((s.delivery.activities||[]).join(' &middot; ')||'Not recorded.')+'</span></div>'+
    '<div class="kv"><b>Outputs</b><span>'+((s.delivery.outputs||[]).join(' &middot; ')||'Not recorded.')+'</span></div></div>'+
    '<p class="sub" style="margin-top:9px">Pricing is not published in this catalogue.</p></div>';

  h+='<div class="field"><b>Products and vendors</b><div class="row">'+
    ((s.products||[]).length? s.products.map(pid=>'<a class="chip" href="#/product/'+pid+'">'+esc(PR(pid).name)+' &middot; '+esc(V(PR(pid).vendor).name)+'</a>').join('')
      : '<p class="sub">No products recorded. Products support solutions; they are not the catalogue structure.</p>')+'</div></div>';

  /* Relationships */
  const relLink=(id)=>{ const t=SOL(id); return t?'<a class="chip" href="#/solution/'+t.id+'">'+esc(t.name)+'</a>':'<span class="chip plain">Missing record</span>'; };
  h+='<div class="field"><b>Where this sits in the journey</b><div class="grid g3">'+
    '<div class="kv"><b>Preceded by</b><span>'+((s.relationships.precededBy||[]).length?s.relationships.precededBy.map(relLink).join(' '):'Nothing recorded.')+'</span></div>'+
    '<div class="kv"><b>Next best</b><span>'+((s.relationships.nextSolutions||[]).length?s.relationships.nextSolutions.map(relLink).join(' '):'Nothing recorded.')+'</span></div>'+
    '<div class="kv"><b>Managed destination</b><span>'+(s.relationships.managedDestination?relLink(s.relationships.managedDestination):'No pathway to recurring value recorded.')+'</span></div>'+
    '</div></div>';

  /* Governance */
  h+='<div class="field internalonly"><b>Governance</b><div class="grid g3">'+
    '<div class="kv"><b>Owner</b><span>'+esc(s.governance.owner)+'</span></div>'+
    '<div class="kv"><b>Curator</b><span>'+esc(s.governance.curator)+'</span></div>'+
    '<div class="kv"><b>Provenance</b><span>'+esc(PROV_LABEL[s.provenance])+'</span></div>'+
    '<div class="kv"><b>Last reviewed</b><span>'+(s.governance.lastReviewed?esc(auDate(s.governance.lastReviewed)):'Never')+'</span></div>'+
    '<div class="kv"><b>Next review</b><span>'+(s.governance.nextReview?esc(auDate(s.governance.nextReview)):'Not scheduled')+'</span></div>'+
    '<div class="kv"><b>Canonical identifier</b><span>'+esc(s.id)+'</span></div>'+
    '</div>'+
    ((s.governance.gaps||[]).length?'<div class="note caution" style="margin-top:10px"><b>Known gaps.</b> '+esc(s.governance.gaps.join(' '))+'</div>':'')+
    '</div>';

  h+='<div class="field"><b>Collateral</b>'+
    ((s.content.collateral||[]).length? '<div class="row">'+s.content.collateral.map(c=>'<span class="tag">'+ic('book',13)+esc(c)+'</span>').join('')+'</div>'
      : '<p class="sub">No collateral is attached. A saleable record without collateral is a data-quality warning.</p>')+
    ((s.content.staffnetLinks||[]).length?'<div class="row" style="margin-top:8px">'+s.content.staffnetLinks.map(x=>'<span class="chip">'+ic('link',13)+esc(x)+'</span>').join('')+'</div>':'')+
    '</div>';
  return h;
}

function viewProducts(){
  const pool = visibleSolutions().filter(matchesFilters);
  const used = pid => pool.filter(s=>(s.products||[]).indexOf(pid)>-1);
  const anyFilter = Object.keys(S.filters).some(k=>S.filters[k]) || !!S.q;
  let h='<div class="head"><div><div class="eyebrow">Products and vendors</div><h1>Products support solutions</h1>'+
    '<p class="lede">A product is a vendor technology. It is never the top of the catalogue. Follow a product to the solutions that carry it to a customer outcome.</p>'+
    '<p class="sub">Vendor Alliances provides the vendor-aligned expertise behind these relationships.</p></div></div>';
  const vendors=db.vendors.map(v=>{
    const prods=db.products.filter(p=>p.vendor===v.id && (!anyFilter || used(p.id).length));
    const solCount=pool.filter(s=>(s.products||[]).some(pid=>PR(pid).vendor===v.id)).length;
    return {v:v, prods:prods, solCount:solCount};
  }).filter(x=>!anyFilter || x.solCount);
  h+='<div class="sec"><div class="spread"><h2>By vendor</h2>'+
    (anyFilter?'<span class="sub">'+num(pool.length)+' '+plural(pool.length,'solution')+' match the filters. Vendors with nothing matching are hidden.</span>':'')+
    '</div><div class="grid g3" style="margin-top:12px">'+
    (vendors.length?vendors.map(x=>
      '<div class="card"><div class="spread"><h3>'+esc(x.v.name)+'</h3><span class="chip plain">'+num(x.solCount)+' '+plural(x.solCount,'solution')+'</span></div>'+
      '<div class="row" style="margin-top:10px">'+(x.prods.length?x.prods.map(p=>'<a class="chip" href="#/product/'+p.id+'">'+esc(p.name)+' <b style="color:var(--light-blue)">'+num(used(p.id).length)+'</b></a>').join(''):'<span class="sub">No products recorded.</span>')+'</div></div>').join('')
      :'<div class="empty" style="grid-column:1/-1"><h3>No vendor matches these filters</h3><p>Clear a filter to widen the view.</p></div>')+
    '</div></div>';
  const orphan=anyFilter?[]:db.products.filter(p=>!used(p.id).length);
  if(orphan.length) h+='<div class="sec"><div class="note caution">'+num(orphan.length)+' '+plural(orphan.length,'product')+' in the taxonomy '+(orphan.length===1?'is':'are')+' not attached to any solution: '+esc(orphan.map(p=>p.name).join(', '))+'.</div></div>';
  return h;
}
function viewProduct(pid){
  const p=PR(pid); if(!p.name||p.name==='Unknown product') return viewMissing('product');
  const sols=visibleSolutions().filter(matchesFilters).filter(s=>(s.products||[]).indexOf(pid)>-1);
  const practices=db.practices.filter(pr=>sols.some(s=>s.primaryPractice===pr.id));
  const inds={}; sols.forEach(s=>relsFor(s.id).forEach(r=>inds[r.industryId]=1));
  let h='<div class="head"><div><div class="eyebrow">'+esc(V(p.vendor).name)+' &middot; '+esc(p.category)+'</div><h1>'+esc(p.name)+'</h1>'+
    '<p class="lede">'+num(sols.length)+' '+plural(sols.length,'solution')+' in this catalogue '+(sols.length===1?'uses':'use')+' this product.</p></div>'+
    '<div class="row noprint"><a class="btn" href="#/products">'+ic('product',15)+'All products</a></div></div>';
  h+='<div class="grid g3">'+
    '<div class="stat"><b>'+num(sols.length)+'</b><span>Solutions</span></div>'+
    '<div class="stat"><b>'+num(practices.length)+'</b><span>Practices</span></div>'+
    '<div class="stat"><b>'+num(Object.keys(inds).length)+'</b><span>Industries reached</span></div></div>';
  h+='<div class="sec"><h2>Solutions that carry it</h2><div class="grid g3" style="margin-top:12px">'+
    (sols.length?sols.map(s=>solutionChip(s,{showPractice:true})).join(''):'<div class="empty"><h3>No solution uses this product yet</h3><p>Attach it from a solution record.</p></div>')+'</div></div>';
  return h;
}

/* ═══════════════════════════════════════════════════════════
   13. Views — Journeys
   ═══════════════════════════════════════════════════════════ */
function viewJourneys(){
  let h='<div class="head"><div><div class="eyebrow">Relationships and progression</div><h1>From first conversation to recurring value</h1>'+
    '<p class="lede">Each chain begins with a way in and ends somewhere the relationship keeps going. Missing links are the point, not an oversight.</p></div></div>';
  const pool=visibleSolutions().filter(matchesFilters), inPool=id=>pool.some(s=>s.id===id);
  const anyFilter=Object.keys(S.filters).some(k=>S.filters[k])||!!S.q;
  const chains=CHAINS.filter(c=>!anyFilter||c.some(inPool));
  if(anyFilter) h+='<p class="sub" style="margin-bottom:12px">'+num(chains.length)+' of '+num(CHAINS.length)+
    ' journeys touch the current filters. Steps that do not match are dimmed.</p>';
  h+='<div class="grid" style="gap:16px;margin-top:6px">'+(chains.length?chains.map((chain,ci)=>{
    const steps=chain.map(id=>SOL(id)).filter(Boolean);
    if(!steps.length) return '';
    return '<div class="card"><h3>'+esc(steps[0].name)+' &rarr; '+esc(steps[steps.length-1].name)+'</h3>'+
      '<div class="journey" style="margin-top:12px">'+steps.map((s,i)=>{
        const l=L(s.primaryLens);
        const dim=anyFilter&&!inPool(s.id);
        return '<button class="jstep" data-sol="'+esc(s.id)+'" style="color:'+l.colour+(dim?';opacity:.38':'')+'">'+
          '<div style="margin-bottom:7px">'+lensChip(s.primaryLens)+'</div>'+
          '<h4 style="color:var(--txt)">'+esc(s.name)+'</h4>'+
          '<p>'+esc(P(s.primaryPractice).displayName)+'</p></button>'+
          (i<steps.length-1?'<span class="jarrow">'+ic('chev',18)+'</span>':'');
      }).join('')+'</div></div>';
  }).join(''):'<div class="empty"><h3>No journey touches these filters</h3><p>Clear a filter to see the full set of progressions.</p></div>')+'</div>';
  const orphanManaged=pool.filter(s=>s.primaryLens==='lens-managed' && !(s.relationships.precededBy||[]).length && s.status==='saleable');
  h+='<div class="sec"><h2>Managed offers with no entry pathway</h2><p class="sub">A managed offer nobody can be sold into is a commercial gap.</p>'+
    '<div class="grid g3" style="margin-top:12px">'+(orphanManaged.length?orphanManaged.map(s=>solutionChip(s,{showPractice:true})).join(''):'<p class="sub">None.</p>')+'</div></div>';
  return h;
}

/* ═══════════════════════════════════════════════════════════
   14. Views — Portfolio health
   ═══════════════════════════════════════════════════════════ */
function viewHealth(){
  let w=validate(); const grouped={};
  if(S.filters.practice) w=w.filter(x=>!x.practiceId||x.practiceId===S.filters.practice);
  w.forEach(x=>{ (grouped[x.rule]=grouped[x.rule]||[]).push(x); });
  const order=Object.keys(grouped).sort((a,b)=>grouped[b].length-grouped[a].length);
  const sev={high:0,medium:0,info:0}; w.forEach(x=>sev[x.severity]++);

  let h='<div class="head"><div><div class="eyebrow">Portfolio health</div><h1>What the catalogue cannot yet answer</h1>'+
    '<p class="lede">Every dashboard in this application reads from the same validation pass. Warnings never block a save; they show where curation is owed.</p></div>'+
    '<div class="row noprint"><button class="btn" id="exportHealth">'+ic('down',15)+'Export warnings</button></div></div>';
  h+='<div class="grid g4">'+
    [['Warnings',w.length],['High',sev.high],['Medium',sev.medium],['Recorded gaps',db.gaps.length]]
    .map(x=>'<div class="stat"><b>'+num(x[1])+'</b><span>'+x[0]+'</span></div>').join('')+'</div>';

  const unans=(db.unanswered||[]);
  if(unans.length) h+='<div class="sec"><h2>Questions the catalogue could not answer</h2>'+
    '<p class="sub">Sol records what it could not match. Repeated questions here are demand the catalogue does not yet meet.</p>'+
    '<details class="acc" style="margin-top:12px"><summary><span>Unanswered questions</span>'+
    '<span class="sright"><span class="qcount">'+num(unans.length)+'</span><span class="accchev">&#9660;</span></span></summary>'+
    '<div class="accbody">'+unans.slice(0,25).map(u=>
      '<div class="warn sev-info"><span>'+ic('search',16)+'</span><div><div class="wmsg">'+esc(u.q)+'</div>'+
      '<div class="wrule">'+esc(u.by)+' &middot; '+esc(auDate(u.at))+'</div></div></div>').join('')+'</div></details></div>';
  h+='<div class="sec"><h2>Deliberate portfolio gaps</h2><p class="sub">Recorded absences, carried in the seed so the tool shows them plainly.</p>'+
    '<div class="grid g2" style="margin-top:12px">'+db.gaps.map(g=>
      '<div class="card"><div class="spread"><h3 style="font-size:15px">'+esc(g.title)+'</h3>'+lensChip('lens-'+g.lensKey)+'</div>'+
      '<p class="sub" style="margin-top:8px">'+esc(g.note)+'</p>'+
      '<div class="row" style="margin-top:10px"><a class="linkish" href="#/practice/'+g.practiceId+'">'+esc(P(g.practiceId).displayName)+'</a></div></div>').join('')+'</div></div>';

  h+='<div class="sec"><div class="spread"><h2>Data quality warnings</h2>'+
    '<span class="sub">'+num(order.length)+' '+plural(order.length,'rule')+' firing. Open one to see the records.</span></div>'+
    '<div style="margin-top:12px">'+
    order.map(rule=>{
      const items=grouped[rule], shown=items.slice(0,25);
      return '<details class="acc"><summary><span>'+esc(RULE_LABEL[rule]||rule)+'</span>'+
        '<span class="sright"><span class="qcount">'+num(items.length)+'</span><span class="accchev">&#9660;</span></span></summary>'+
        '<div class="accbody">'+shown.map(x=>
          '<a class="warn sev-'+x.severity+'" href="'+esc(x.route||'#/health')+'"><span>'+ic('health',16)+'</span><div class="wmsg">'+esc(x.message)+'</div></a>').join('')+
        (items.length>shown.length?'<p class="sub">And '+num(items.length-shown.length)+' more of the same kind.</p>':'')+
        '</div></details>';
    }).join('')+'</div></div>';
  return h;
}
function viewMissing(kind){
  return '<div class="empty"><h3>That '+esc(kind)+' record is not in this prototype</h3>'+
    '<p>It may have been archived, renamed or removed from local data.</p>'+

}

function flagModal(solId, quick){
  const s=SOL(solId); if(!s) return;
  const existing=relsFor(solId).map(r=>r.industryId);
  const body='<p class="sub">Anyone may propose a relationship. Nothing is published as confirmed from here.</p>'+
    '<span class="lbl">Industries</span><div class="grid g2" style="gap:7px">'+
    db.industries.map(i=>'<label class="kv" style="display:flex;gap:9px;align-items:center;cursor:pointer">'+
      '<input type="checkbox" class="flagind" value="'+i.id+'"'+(existing.indexOf(i.id)>-1?' disabled':'')+'>'+
      '<span><b style="text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--txt)">'+esc(i.name)+'</b>'+
      (existing.indexOf(i.id)>-1?'<span style="display:block;font-size:11px;color:var(--dim)">Already mapped</span>':'')+'</span></label>').join('')+
    '</div>'+
    '<span class="lbl">Relevance</span><select class="inp" id="flagRel">'+
      ['core','strong','applicable','emerging'].map(r=>'<option value="'+r+'">'+REL_LABEL[r]+' &mdash; '+
        ({core:'designed directly for the industry',strong:'commonly useful in the industry',applicable:'broad solution with recognised relevance',emerging:'potential play requiring validation'}[r])+'</option>').join('')+
    '</select>'+
    '<span class="lbl">Why does this solution touch the industry? (required)</span>'+
    '<textarea class="inp" id="flagWhy" placeholder="One or two sentences is enough."></textarea>'+
    (quick?'':'<span class="lbl">Industry customer trigger (optional)</span><input class="inp" id="flagTrigger" placeholder="What you hear from customers in this industry">'+
      '<span class="lbl">Example use case (optional)</span><input class="inp" id="flagUse" placeholder="Where this has applied">'+
      '<span class="lbl">Supporting evidence or link (optional)</span><input class="inp" id="flagEvidence" placeholder="Reference, note or source">');
  modal(mshell('Flag industry relevance &mdash; '+esc(s.name), body,
    '<button class="btn" data-mclose="1">Cancel</button><button class="btn primary" id="flagSave">Submit as proposed</button>'));
  $('#flagSave').onclick=()=>{
    const inds=$$('.flagind:checked').map(c=>c.value);
    const why=($('#flagWhy').value||'').trim();
    if(!inds.length){ toast('Choose at least one industry.'); return; }
    if(why.length<10){ toast('A short rationale is required.'); return; }
    const rel=$('#flagRel').value;
    inds.forEach(indId=>{
      db.industryRelationships.push({
        id:'solution-industry-'+String(db.industryRelationships.length+1).padStart(3,'0')+'-'+Math.floor(performance.now()%100000),
        solutionId:solId, industryId:indId, relevance:rel, status:'proposed', rationale:why,
        customerTriggers:$('#flagTrigger')&&$('#flagTrigger').value?[$('#flagTrigger').value]:[],
        useCases:$('#flagUse')&&$('#flagUse').value?[$('#flagUse').value]:[],
        evidenceLinks:$('#flagEvidence')&&$('#flagEvidence').value?[$('#flagEvidence').value]:[],
        staffnetVisibility:'proposed', practiceApproval:'pending', industryApproval:'pending',

  ['archived','Archived', r=>r.status==='archived']
];
function viewIndustryAdmin(embedded){
  if(!can('review-industry')&&!can('edit-global')) return adminGate();
  const q=S.queue||'proposed';
  const def=QUEUES.find(x=>x[0]===q)||QUEUES[0];
  const rows=db.industryRelationships.filter(def[2]);
  let h='<div class="head"><div><div class="eyebrow">Industry mapping administration</div><h1>Relationship queues</h1>'+
    '<p class="lede">A relationship becomes jointly confirmed when both the owning practice and the industry owner approve it. Rejections keep their reason.</p></div></div>';
  h+='<div class="row noprint" style="margin-bottom:14px">'+QUEUES.map(x=>{
    const n=db.industryRelationships.filter(x[2]).length;
    return '<button class="btn sm'+(q===x[0]?' on':'')+'" data-queue="'+x[0]+'">'+esc(x[1])+' <span class="qcount">'+num(n)+'</span></button>';
  }).join('')+'</div>';

  h+='<div class="tw"><table class="tbl"><thead><tr><th>Solution</th><th>Practice</th><th>Industry</th><th>Relevance</th><th>Status</th><th>Rationale</th><th>Submitted</th><th></th></tr></thead><tbody>'+
    (rows.length? rows.map(r=>{ const s=SOL(r.solutionId); if(!s) return '';
      return '<tr><td><a class="linkish" href="#/solution/'+s.id+'">'+esc(s.name)+'</a></td>'+
        '<td>'+esc(P(s.primaryPractice).displayName)+'</td><td>'+esc(I(r.industryId).name)+'</td>'+
        '<td><select data-relrelevance="'+r.id+'">'+Object.keys(REL_LABEL).map(k=>'<option value="'+k+'"'+(r.relevance===k?' selected':'')+'>'+REL_LABEL[k]+'</option>').join('')+'</select></td>'+
        '<td>'+esc(RSTATUS_LABEL[r.status])+'</td>'+
        '<td style="max-width:320px">'+esc(r.rationale||'No rationale recorded.')+'</td>'+
        '<td>'+esc(r.submittedBy)+'<br><span style="color:var(--dim);font-size:11px">'+esc(auDate(r.submittedAt))+'</span></td>'+
        '<td><div class="row" style="gap:5px">'+
          '<button class="btn sm" data-relconfirm="'+r.id+'">Confirm</button>'+
          '<button class="btn sm" data-relclarify="'+r.id+'">Clarify</button>'+
          '<button class="btn sm danger" data-relreject="'+r.id+'">Reject</button></div></td></tr>'; }).join('')
      : '<tr><td colspan="8" style="padding:26px;color:var(--dim)">This queue is empty.</td></tr>')+
    '</tbody></table></div>';

  /* Coverage matrix */
  h+='<div class="sec"><h2>Coverage by industry and practice</h2><p class="sub">Intensity shows how many relationships exist. Colour shows how many are jointly confirmed.</p>'+
    '<div class="tw" style="margin-top:12px"><table class="tbl"><thead><tr><th>Industry</th>'+
    db.practices.map(p=>'<th>'+esc(p.displayName)+'</th>').join('')+'<th>Total</th></tr></thead><tbody>'+
    db.industries.map(i=>{
      const all=relsForIndustry(i.id);
      return '<tr><td><a class="linkish" href="#/industry/'+i.id+'">'+esc(i.name)+'</a></td>'+
        db.practices.map(p=>{
          const cell=all.filter(r=>{ const s=SOL(r.solutionId); return s && s.primaryPractice===p.id; });
          const conf=cell.filter(r=>r.status==='jointly-confirmed').length;
          if(!cell.length) return '<td style="color:var(--dim)">&mdash;</td>';
          return '<td><span class="chip" style="color:'+(conf?'var(--aqua)':'var(--green-yellow)')+'"><span class="dot"></span>'+num(cell.length)+(conf?' ('+num(conf)+' confirmed)':'')+'</span></td>';
        }).join('')+'<td><b>'+num(all.length)+'</b></td></tr>';
    }).join('')+'</tbody></table></div></div>';
  return h;
}

function paintPresenter(){
  const bar=$('#pbar');
  if(!S.present){ bar.classList.add('hidden'); document.body.classList.remove('present'); return; }
  document.body.classList.add('present'); bar.classList.remove('hidden');
  const st=RUNSHEET[S.presentStep];
  bar.innerHTML='<div class="pdots">'+RUNSHEET.map((_,i)=>'<i class="'+(i<S.presentStep?'done':i===S.presentStep?'now':'')+'"></i>').join('')+'</div>'+
    '<div class="ptitle">'+esc(st.t)+'</div><div class="pnote">'+esc(st.n)+'</div>'+
    '<span class="sub">Step '+num(S.presentStep+1)+' of '+num(RUNSHEET.length)+'</span>'+
    '<button class="btn sm" id="pPrev"'+(S.presentStep===0?' disabled':'')+'>Back</button>'+
    '<button class="btn sm primary" id="pNext">'+(S.presentStep===RUNSHEET.length-1?'Finish':'Next')+'</button>'+
    '<button class="btn sm" id="pExit">Exit</button>';
  $('#pPrev').onclick=()=>{ if(S.presentStep>0){ S.presentStep--; runStep(); } };
  $('#pNext').onclick=()=>{ if(S.presentStep<RUNSHEET.length-1){ S.presentStep++; runStep(); } else exitPresenter(); };
  $('#pExit').onclick=exitPresenter;
}
function runStep(){ const st=RUNSHEET[S.presentStep]; st.fn(); closeDrawer(); location.hash=st.go; render(); paintPresenter(); window.scrollTo({top:0,behavior:'smooth'}); }
function startPresenter(){ S.present=true; S.presentStep=0; S.role='read-only'; paintRole(); runStep(); toast('Presenter mode. Internal fields, admin controls and non-customer-facing records are hidden.'); }
function exitPresenter(){ S.present=false; paintPresenter(); render(); }
