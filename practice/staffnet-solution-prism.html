function sidEntities(t){
  const has = s => t.indexOf(String(s).toLowerCase())>-1;
  const practice = db.practices.find(p => has(p.displayName) || has(p.sourceName) || (p.aliases||[]).some(has)
      || (p.id==='practice-euc'&&has('end user')) || (p.id==='practice-data-ai'&&(has(' ai')||t.indexOf('ai ')===0)));
  const industry = db.industries.find(i => has(i.name) || (i.aliases||[]).some(has) || has(i.name.split(' ')[0]));
  const lens = db.lenses.find(l => has(l.name));
  const product = db.products.slice().sort((a,b)=>b.name.length-a.name.length).find(p => has(p.name)
      || (p.name.indexOf('Copilot')>-1 && has('copilot') && p.id==='product-microsoft-365-copilot'));
  const vendor = db.vendors.find(v => has(v.name));
  return {practice:practice, industry:industry, lens:lens, product:product, vendor:vendor};
}
const SID_STOP=['what','which','show','have','with','that','this','does','from','about','need','want','they','their','there','when','where','been','some','into','more','than','then','will','your','ours','tell','give','find','look','over','just','like','make','know','only','also','were','them','told','asked'];
function sidWordScore(s, t){
  let sc=0; const name=s.name.toLowerCase();
  t.split(/[^a-z0-9]+/).filter(w=>w.length>3 && SID_STOP.indexOf(w)<0).forEach(w=>{
    if(name.indexOf(w)>-1) sc+=3;
    if((s.shortDescription||'').toLowerCase().indexOf(w)>-1) sc+=1;
    if((s.triggers||[]).join(' ').toLowerCase().indexOf(w)>-1) sc+=2;
    if((s.capabilityCategory||'').toLowerCase().indexOf(w)>-1) sc+=1;
  });
  return sc;
}
function sidArt(w){ return /^[aeiou]/i.test(String(w))?'an':'a'; }
function sidHasEntity(e){ return !!(e.practice||e.industry||e.lens||e.product||e.vendor); }
function sidScore(s, t, e){
  let sc=sidWordScore(s, t);
  if(e.practice && s.primaryPractice===e.practice.id) sc+=4;
  if(e.practice && (s.contributingPractices||[]).indexOf(e.practice.id)>-1) sc+=2;
  if(e.lens && s.primaryLens===e.lens.id) sc+=4;
  if(e.industry && relsFor(s.id).some(r=>r.industryId===e.industry.id)) sc+=5;
  if(e.product && (s.products||[]).indexOf(e.product.id)>-1) sc+=5;
  if(e.vendor && (s.products||[]).some(p=>PR(p).vendor===e.vendor.id)) sc+=3;
  if(s.status==='saleable') sc+=1;
  if(s.enriched) sc+=1;
  return sc;
}
function sidHit(s, note){
  return '<button class="hit" data-sol="'+esc(s.id)+'"><b>'+esc(s.name)+'</b>'+
    '<span>'+esc(L(s.primaryLens).name)+' &middot; '+esc(P(s.primaryPractice).displayName)+' &middot; '+
    esc(STATUS_LABEL[s.status])+(note?' &middot; '+esc(note):'')+'</span></button>';
}
function sidAnswer(qRaw){
  const q=qRaw.trim(), t=q.toLowerCase(), e=sidEntities(t);
  const pool=visibleSolutions();
  const any = k => t.indexOf(k)>-1;
  const A = (conf, head, body, why) => ({conf:conf, html:'<h4>'+head+'</h4>'+body+(why?'<div class="why">'+why+'</div>':'')});

  /* How the tool works. Asked constantly, and previously answered with a shrug. */
  const howTo = [
    {k:['import','upload','reconcile','merge','spreadsheet'], t:'Importing a spreadsheet',
     b:()=>'<div class="hit"><b>Nothing is ever deleted on import</b><span>Records absent from your file stay exactly as they are</span></div>'+
        '<button class="hit" data-goto="#/admin"><b>Open the control centre to import</b><span>You will see a preview before anything changes</span></button>',
     w:'That is deliberate. A partial spreadsheet should never be able to empty the catalogue.'},
    {k:['export','download','csv','excel'], t:'Working in Excel',
     b:()=>'<button class="hit" data-goto="#/admin"><b>Export CSV from the control centre</b><span>Every record, with readable practice, lens and product names</span></button>'+
        '<div class="hit"><b>Edit the rows, then Import CSV</b><span>Matching identifiers update, rows without one are added, and anything missing from your file is left alone</span></div>'+
        '<div class="hit"><b>You see the changes before they apply</b><span>Counts of added and changed, and which fields move on each record</span></div>',
     w:'Export respects the filters you have on, so you can send one practice a spreadsheet of only their records.'},
    {k:['role','permission','who can','what can','allowed','read-only','read only','contributor','administrator'], t:'Roles',
     b:()=>ROLES.map(r=>'<div class="hit"><b>'+esc(r.name)+'</b><span>'+esc(ROLE_CAN[r.id]||'')+'</span></div>').join(''),
     w:'Roles are simulated here. Change "Viewing as" in the top bar to see what each one is given.'},
    {k:['queue','approve','confirm','review queue','waiting','pending'], t:'The review queues',
     b:()=>{const pend=db.industryRelationships.filter(r=>r.status==='proposed'||r.status==='needs-review').length;
       return '<button class="hit" data-goto="#/admin/industry"><b>'+num(pend)+' mappings awaiting a decision</b><span>The practice confirms the capability, the industry owner confirms the relevance</span></button>'+
        '<div class="hit"><b>Both sides make it jointly confirmed</b><span>A rejection keeps the record and the reason</span></div>';},
     w:'Anyone can propose a relationship. Nothing publishes itself as confirmed.'},
    {k:['present','presenter','demo','walkthrough','show someone'], t:'Presenter mode',
     b:()=>'<div class="hit"><b>Ten steps, in order</b><span>'+esc(RUNSHEET.map(r=>r.t).slice(0,4).join(', '))+' and six more</span></div>'+
        '<div class="hit"><b>Use the Presenter button in the top bar</b><span>Arrow keys move through it. Admin controls and anything not customer-facing are hidden</span></div>',
     w:'It hides internal fields, so it is safe to run on a shared screen.'},
    {k:['share','link','send this','copy view','url'], t:'Sharing what you are looking at',
     b:()=>'<div class="hit"><b>Copy view, in the filter bar</b><span>The link opens on this exact set of filters</span></div>',
     w:'Filters and search ride in the URL, so a view is something you can send.'},
    {k:['flag','propose','suggest','add industry','relevance'], t:'Proposing an industry relationship',
     b:()=>'<div class="hit"><b>Open any solution, choose Flag industry relevance</b><span>Give it a relevance type and a short reason</span></div>'+
        '<div class="hit"><b>It saves as proposed</b><span>Never as confirmed, whoever you are</span></div>',
     w:'Every role can do this, including read-only.'},
    {k:['who are you','what are you','who is sol','what is this','what is solcat','how does this work'], t:'What this is',
     b:()=>'<div class="hit"><b>I am Sol</b><span>I read the SolCat Matrix and nothing else. Sid the bilby fronts the StaffNet Intelligent Directory next door</span></div>'+
        '<button class="hit" data-goto="#/about"><b>The catalogue, read as a matrix</b><span>Seven practices, two capability layers, four commercial motions</span></button>',
     w:'Everything I say comes from configured relationships and matching rules. Nothing here is generated by a model.'}
  ];
  for(const ht of howTo){ if(ht.k.some(k=>any(k))) return A('High', ht.t, ht.b(), ht.w); }

  /* Counting the catalogue */
  if(any('how many')||any('count')||any('total')||any('how much of')){
    const rows=[['Records in the catalogue',pool.length],['Approved to position',pool.filter(s=>s.status==='saleable').length],
      ['Proposed or in development',pool.filter(s=>s.status==='proposed'||s.status==='development').length],
      ['Cross-practice',pool.filter(s=>(s.contributingPractices||[]).length).length],
      ['Industry relationships',db.industryRelationships.length],['Practices and capability layers',db.practices.length]];
    return A('High','Prototype catalogue totals',
      rows.map(r=>'<div class="hit"><b>'+num(r[1])+'</b><span>'+r[0]+'</span></div>').join(''),
      'These describe the records loaded in this browser, not enterprise catalogue metrics.');
  }

  /* Comparing two practices */
  if(any('compare')||any(' versus ')||any(' vs ')){
    const named=db.practices.filter(p=>t.indexOf(p.displayName.toLowerCase())>-1||(p.aliases||[]).some(a=>t.indexOf(String(a).toLowerCase())>-1));
    if(named.length>=2){
      const [a,b2]=named;
      const row=p=>db.lenses.map(l=>L(l.id).name+' '+num(pool.filter(s=>s.primaryPractice===p.id&&s.primaryLens===l.id).length)).join(' &middot; ');
      return A('High',esc(a.displayName)+' against '+esc(b2.displayName),
        '<div class="hit"><b>'+esc(a.displayName)+'</b><span>'+row(a)+'</span></div>'+
        '<div class="hit"><b>'+esc(b2.displayName)+'</b><span>'+row(b2)+'</span></div>'+
        '<button class="hit" data-goto="#/lens/lens-packaged"><b>Open compare mode</b><span>Side by side, one motion at a time</span></button>',
        'Counted across the four commercial motions.');
    }
  }

  /* Capability layers */
  if(any('layer')||any('lifecycle services')||any('business advisory')||any('capability structure')){
    const lay=db.practices.filter(p=>p.isCapabilityLayer);
    if(lay.length) return A('High','The two capability layers',
      lay.map(p=>'<button class="hit" data-goto="#/practice/'+p.id+'"><b>'+esc(p.displayName)+'</b><span>'+esc(p.description)+'</span></button>').join(''),
      'These span the seven delivery practices rather than sitting beside them.');
  }

  /* Collateral */
  if(any('collateral')||any('material')||any('one-pager')||any('proposal')){
    const withC=pool.filter(s=>(s.content.collateral||[]).length);
    const without=pool.filter(s=>s.status==='saleable'&&!(s.content.collateral||[]).length);
    return A('High','Collateral',
      withC.slice(0,4).map(s=>sidHit(s,(s.content.collateral||[]).join(', '))).join('')+
      '<button class="hit" data-goto="#/health"><b>'+num(without.length)+' saleable records carry none</b><span>Which is a data quality warning, not a gap in the offer</span></button>',
      'Ask the owning practice before you assume material exists.');
  }

  /* Gaps: where the portfolio does not reach */
  if(any('gap')||any('missing')||any('lack')||any('no packaged')||any('without')||any('nobody')){
    let gaps=db.gaps.slice();
    if(e.practice) gaps=gaps.filter(g=>g.practiceId===e.practice.id);
    if(e.lens) gaps=gaps.filter(g=>g.lensKey===L(e.lens.id).key);
    if(gaps.length) return A('High','Recorded portfolio gaps',
      gaps.slice(0,5).map(g=>'<button class="hit" data-goto="#/practice/'+g.practiceId+'"><b>'+esc(g.title)+'</b>'+
        '<span>'+esc(P(g.practiceId).displayName)+' &middot; '+esc(g.lensKey)+'</span></button>').join(''),
      'These are deliberate gaps carried in the catalogue. Absence is recorded, not inferred.');
    const empties=[];
    db.practices.forEach(p=>db.lenses.forEach(l=>{
      if(!pool.some(s=>s.primaryPractice===p.id&&s.primaryLens===l.id)) empties.push(p.displayName+' has no '+l.name+' record.');
    }));
    if(empties.length) return A('High','Empty cells in the matrix',
      empties.slice(0,6).map(x=>'<div class="hit"><b>'+esc(x)+'</b></div>').join(''), 'Computed from the matrix as it stands.');
  }
  /* Governance */
  if(any('who owns')||any('owner')||any('curator')){
    const noOwner=pool.filter(s=>/to be confirmed/i.test(s.governance.owner));
    const named=pool.map(s=>({s:s,sc:sidWordScore(s,t)})).sort((a,b)=>b.sc-a.sc)[0];
    if(named && named.sc>=6) return A('High','Ownership of '+esc(named.s.name),
      sidHit(named.s, named.s.governance.owner)+
      '<div class="hit"><b>Curator: '+esc(named.s.governance.curator)+'</b><span>Last reviewed '+
      esc(named.s.governance.lastReviewed?auDate(named.s.governance.lastReviewed):'never')+'</span></div>',
      'Nothing in this prototype invents a person. Records stay "to be confirmed" until a practice claims them.');
    if(e.practice||e.industry||e.product){
      const ranked=pool.map(s=>({s:s,sc:sidScore(s,t,e)})).filter(x=>x.sc>3).sort((a,b)=>b.sc-a.sc).slice(0,4);
      if(ranked.length) return A('Medium','Ownership of the closest matches',
        ranked.map(x=>sidHit(x.s, x.s.governance.owner)).join(''), 'Owners are recorded as "to be confirmed" until a practice claims them.');
    }
    return A('High','Ownership across the catalogue',
      '<div class="hit"><b>'+num(noOwner.length)+' of '+num(pool.length)+' records have no confirmed owner</b>'+
      '<span>Nothing in this prototype invents a person.</span></div>'+
      '<button class="hit" data-goto="#/health"><b>Open portfolio health</b><span>See every ownership warning</span></button>',
      'Counted from the same validation pass every dashboard uses.');
  }
  if(any('review')||any('stale')||any('out of date')||any('overdue')){
    const stale=pool.filter(s=>s.governance.nextReview && s.governance.nextReview<todayISO());
    const needs=pool.filter(s=>s.confidence==='needs-review');
    return A('High','Records that need attention',
      (stale.length?stale.slice(0,3).map(s=>sidHit(s,'review due '+auDate(s.governance.nextReview))).join(''):'')+
      (needs.length?needs.slice(0,3).map(s=>sidHit(s,'marked needs review')).join(''):'')+
      '<button class="hit" data-goto="#/health"><b>Open portfolio health</b><span>Every warning, grouped by rule</span></button>',
      num(stale.length)+' records are past their review date and '+num(needs.length)+' are marked as needing review.');
  }
  /* What can I actually sell */
  if(any('proposed')||any('approved')||any('can i sell')||any('can we sell')||any('saleable')||any('positioned')){
    let set=pool.filter(s=>s.status==='proposed'||s.status==='development'||s.status==='internal');
    if(e.practice) set=set.filter(s=>s.primaryPractice===e.practice.id);
    return A('High','Not approved to position',
      (set.length?set.slice(0,5).map(s=>sidHit(s,STATUS_LABEL[s.status])).join('')
        :'<div class="hit"><b>Everything here is saleable</b><span>No proposed or in-development records match.</span></div>'),
      'Proposed and in-development records are opportunities, not offers. Confirm scope with the owning practice first.');
  }
  /* Journey */
  if(any('next')||any('after')||any('pathway')||any('journey')||any('progress')||any('follow')||any('then what')){
    const ranked=pool.map(s=>({s:s,sc:sidScore(s,t,e)})).sort((a,b)=>b.sc-a.sc);
    const top=ranked[0];
    if(top && top.sc>=3){
      const s=top.s, nexts=(s.relationships.nextSolutions||[]).map(SOL).filter(Boolean);
      const md=s.relationships.managedDestination?SOL(s.relationships.managedDestination):null;
      if(nexts.length||md) return A('High','After '+esc(s.name),
        nexts.map(n=>sidHit(n,'next motion')).join('')+(md&&nexts.indexOf(md)<0?sidHit(md,'managed destination'):''),
        'Taken from the progression recorded on the record itself.');
      return A('Medium','No next motion is recorded for '+esc(s.name),
        sidHit(s)+'<button class="hit" data-goto="#/journeys"><b>See the journeys that are recorded</b><span>Ten chains from entry to recurring value</span></button>',
        'A packaged offer with no next motion is a data-quality warning, not a dead end.');
    }
  }
  /* Industry-first question */
  if(e.industry){
    const rels=relsForIndustry(e.industry.id);
    const sols=rels.map(r=>SOL(r.solutionId)).filter(Boolean).filter(s=>pool.indexOf(s)>-1);
    let scoped=e.lens?sols.filter(s=>s.primaryLens===e.lens.id):e.practice?sols.filter(s=>s.primaryPractice===e.practice.id):sols;
    const wantUnconfirmed=any('confirm')||any('unconfirmed')||any('pending')||any('awaiting');
    if(wantUnconfirmed){
      const un=scoped.filter(s=>{ const r=rels.find(y=>y.solutionId===s.id); return r && r.status!=='jointly-confirmed'; });
      if(un.length) return A('High','Not yet jointly confirmed for '+esc(e.industry.name),
        un.slice(0,5).map(s=>{ const r=rels.find(y=>y.solutionId===s.id); return sidHit(s, RSTATUS_LABEL[r.status]); }).join('')+
        '<button class="hit" data-goto="#/admin/industry"><b>Open the mapping workspace</b><span>Confirm, reject or ask for clarification</span></button>',
        'A relationship is jointly confirmed only when the owning practice and the industry owner both approve it.');
      return A('High','Everything mapped to '+esc(e.industry.name)+' is jointly confirmed',
        '<button class="hit" data-goto="#/industry/'+e.industry.id+'"><b>Open the '+esc(e.industry.name)+' view</b><span>'+num(rels.length)+' confirmed relationships</span></button>',
        'Both sides have approved every relationship recorded here.');
    }
    const ranked=scoped.map(s=>({s:s,sc:sidScore(s,t,e)})).sort((a,b)=>b.sc-a.sc).slice(0,4);
    const confirmed=rels.filter(r=>r.status==='jointly-confirmed').length;
    if(ranked.length) return A('High','For '+sidArt(e.industry.name)+' '+esc(e.industry.name)+' customer',
      ranked.map(x=>{ const r=rels.find(y=>y.solutionId===x.s.id); return sidHit(x.s, r?REL_LABEL[r.relevance]+' relevance':''); }).join('')+
      '<button class="hit" data-goto="#/industry/'+e.industry.id+'"><b>Open the '+esc(e.industry.name)+' view</b>'+
      '<span>'+num(rels.length)+' mapped, '+num(confirmed)+' jointly confirmed</span></button>',
      'Ranked by industry relevance and how complete the record is. '+num(rels.length-confirmed)+' of these relationships are not yet jointly confirmed.');
    return A('Low','Nothing is mapped to '+esc(e.industry.name)+' yet',
      '<button class="hit" data-goto="#/admin/industry"><b>Open the mapping workspace</b><span>Propose a relationship instead of assuming one</span></button>',
      'I will not invent an industry fit that nobody has confirmed.');
  }
  /* Practice or lens question */
  if(e.practice || e.lens){
    let set=pool;
    if(e.practice) set=set.filter(s=>s.primaryPractice===e.practice.id||(s.contributingPractices||[]).indexOf(e.practice.id)>-1);
    if(e.lens) set=set.filter(s=>s.primaryLens===e.lens.id);
    const ranked=set.map(s=>({s:s,sc:sidScore(s,t,e)})).sort((a,b)=>b.sc-a.sc).slice(0,4);
    const head=(e.practice?esc(e.practice.displayName):'The catalogue')+(e.lens?' in '+esc(e.lens.name):'');
    if(ranked.length) return A('High',head,
      ranked.map(x=>sidHit(x.s)).join('')+
      (e.practice?'<button class="hit" data-goto="#/practice/'+e.practice.id+'"><b>Open the practice view</b><span>All four motions, industry coverage and gaps</span></button>':''),
      num(set.length)+' records match. '+(e.lens?esc(e.lens.promise):'Ranked by how closely each record matches.'));
    return A('Low','Nothing matches that combination',
      (e.practice?'<button class="hit" data-goto="#/practice/'+e.practice.id+'"><b>Open '+esc(e.practice.displayName)+'</b><span>See what it does hold</span></button>':''),
      'An empty combination is usually a portfolio gap worth recording.');
  }
  /* Product or vendor */
  if(e.product || e.vendor){
    const set=pool.filter(s=>e.product?(s.products||[]).indexOf(e.product.id)>-1:(s.products||[]).some(p=>PR(p).vendor===e.vendor.id));
    const label=e.product?e.product.name:e.vendor.name;
    if(set.length) return A('High','Solutions carrying '+esc(label),
      set.slice(0,4).map(s=>sidHit(s)).join('')+
      (e.product?'<button class="hit" data-goto="#/product/'+e.product.id+'"><b>Open the product view</b><span>Every solution, practice and industry it reaches</span></button>':''),
      'A product supports solutions. It is never the thing a customer buys on its own.');
    return A('Low','No solution records '+esc(label)+' yet',
      '<button class="hit" data-goto="#/products"><b>Open products and vendors</b><span>See what is attached today</span></button>',
      'Products with no solution attached are flagged on the products view.');
  }
  /* Customer trigger phrasing */
  const trig=db.triggers.map(x=>({x:x,sc:x.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>4&&t.indexOf(w)>-1).length}))
    .sort((a,b)=>b.sc-a.sc)[0];
  if(trig && trig.sc>=2){
    const set=pool.filter(s=>(s.triggers||[]).indexOf(trig.x)>-1);
    if(set.length) return A('Medium','That sounds like: "'+esc(trig.x)+'"',
      set.slice(0,4).map(s=>sidHit(s)).join(''),
      'Matched against the customer triggers recorded on these records.');
  }
  /* General ranking */
  const ranked=pool.map(s=>({s:s,sc:sidScore(s,t,e),w:sidWordScore(s,t)}))
    .filter(x=>x.w>=3 || (sidHasEntity(e)&&x.sc>=6)).sort((a,b)=>b.sc-a.sc);
  if(ranked.length) return A(ranked[0].sc>=8?'High':'Medium','Closest records',
    ranked.slice(0,4).map(x=>sidHit(x.s)).join(''),
    'Ranked on name, description, customer triggers and the practice, lens, industry or product you named.');
  return null;
}
function sidSuggestions(){
  const r=routeParts(), out=[];
  if(r[0]==='practice'&&r[1]){ const p=P(r[1]);
    out.push('What does '+p.displayName+' have in Managed?','Where are the gaps in '+p.displayName+'?','Who owns the '+p.displayName+' records?'); }
  else if(r[0]==='industry'&&r[1]){ const i=I(r[1]);
    out.push('What can we offer a '+i.name+' customer?','Which '+i.name+' solutions are not yet confirmed?','What is proposed for '+i.name+'?'); }
  else if(r[0]==='lens'&&r[1]){ const l=L(r[1]);
    out.push('Which practices have no '+l.name+' offer?','Show me '+l.name+' for Security','What comes after a '+l.name+' engagement?'); }
  else if(r[0]==='solution'&&r[1]){ const s=SOL(r[1]);
    if(s){ out.push('What comes after '+s.name+'?','Who owns '+s.name+'?','Which industries use '+s.name+'?'); } }
  else if(r[0]==='product'&&r[1]){ const p=PR(r[1]);
    out.push('Which solutions carry '+p.name+'?','Which practices use '+p.name+'?'); }
  else if(r[0]==='health'||r[0]==='admin'){
    out.push('What needs review?','Which records have no owner?','What is proposed but not approved?'); }
  else { out.push('What can we offer a Mining customer?','Which practices have no packaged entry offer?','Show me everything for Copilot','What comes after a Copilot Readiness Assessment?'); }
  return out.slice(0,4);
}
function sidPaintPrompts(){
  const el=document.getElementById('sidPrompts'); if(!el) return;
  el.innerHTML='<b>Try</b>'+sidSuggestions().map(s=>'<button data-ask="'+esc(s)+'">'+esc(s)+'</button>').join('');
  Array.prototype.slice.call(el.querySelectorAll('[data-ask]')).forEach(b=>b.onclick=()=>sidAsk(b.getAttribute('data-ask')));
}
function sidPush(html, cls){
  const m=document.getElementById('messages');
  m.insertAdjacentHTML('beforeend','<div class="msg '+cls+'">'+html+'</div>');
  Array.prototype.slice.call(m.querySelectorAll('[data-sol]')).forEach(b=>b.onclick=()=>{ openDrawer(b.getAttribute('data-sol')); });
  Array.prototype.slice.call(m.querySelectorAll('[data-goto]')).forEach(b=>b.onclick=()=>{ location.hash=b.getAttribute('data-goto'); });
  m.scrollTop=m.scrollHeight;
}
function sidAsk(q){
  if(!q||!q.trim()) return;
  sidOpen(true);
  sidPush(esc(q),'user');
  const a=sidAnswer(q);
  if(!a){
    db.unanswered=db.unanswered||[];
    db.unanswered.unshift({q:q, at:todayISO(), by:roleName()});
    db.unanswered=db.unanswered.slice(0,50); save();
    sidPush('<div class="conf low">Low confidence &middot; recorded as an unanswered question</div>'+
      'I could not match that to a record with enough confidence, and I will not invent one. '+
      'Try naming a practice, a lens, an industry or a product.'+
      '<button class="hit" data-goto="#/health"><b>See unanswered questions</b><span>They appear in portfolio health as demand the catalogue cannot meet</span></button>','bot');
    return;
  }
  sidPush('<div class="conf'+(a.conf==='Low'?' low':'')+'">'+a.conf+' confidence &middot; deterministic match</div>'+a.html,'bot');
}
function sidOpen(force){

/* ═══════════════════════════════════════════════════════════
   25. CSV round trip — manage the catalogue in Excel
   ═══════════════════════════════════════════════════════════ */
const CSV_COLS = ['id','name','short_description','customer_problem','customer_outcome',
  'primary_practice','contributing_practices','primary_lens','supporting_lenses',
  'capability_category','solution_type','products','status','confidence','provenance',
  'customer_facing','owner','curator','last_reviewed','next_review','collateral',
  'customer_triggers','preceded_by','next_solutions','managed_destination','industries'];

function csvCell(v){ v=String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function toCSV(header, rows){
  return '﻿'+[header.map(csvCell).join(',')].concat(rows.map(r=>r.map(csvCell).join(','))).join('\r\n');
}
function parseCSV(text){
  text=String(text).replace(/^﻿/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows=[]; let row=[],field='',i=0,inQ=false;
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue; }
      field+=c;i++;continue;
    }
    if(c==='"'){inQ=true;i++;continue;}
    if(c===','){row.push(field);field='';i++;continue;}
    if(c==='\n'){row.push(field);field='';rows.push(row);row=[];i++;continue;}
    field+=c;i++;
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
const pipe = a => (a||[]).join(' | ');
const unpipe = s => String(s||'').split('|').map(x=>x.trim()).filter(Boolean);
function labelToKey(map, label){
  const t=String(label||'').trim().toLowerCase();
  return Object.keys(map).find(k=>String(map[k]).toLowerCase()===t) || (map[t]?t:'');
}
function findPractice(v){ const t=String(v||'').trim().toLowerCase();
  return db.practices.find(p=>p.id===String(v).trim()||p.displayName.toLowerCase()===t||p.sourceName.toLowerCase()===t); }
function findLens(v){ const t=String(v||'').trim().toLowerCase();
  return db.lenses.find(l=>l.id===String(v).trim()||l.name.toLowerCase()===t); }
function findProduct(v){ const t=String(v||'').trim().toLowerCase();
  return db.products.find(p=>p.id===String(v).trim()||p.name.toLowerCase()===t); }

function solutionRow(s){
  return [s.id, s.name, s.shortDescription, s.customerProblem, s.customerOutcome,
    P(s.primaryPractice).displayName,
    pipe((s.contributingPractices||[]).map(x=>P(x).displayName)),
    L(s.primaryLens).name,
    pipe((s.supportingLenses||[]).map(x=>L(x).name)),
    s.capabilityCategory, s.solutionType,
    pipe((s.products||[]).map(x=>PR(x).name)),
    STATUS_LABEL[s.status]||s.status, CONF_LABEL[s.confidence]||s.confidence, PROV_LABEL[s.provenance]||s.provenance,
    s.customerFacing===false?'No':'Yes',
    s.governance.owner, s.governance.curator, s.governance.lastReviewed, s.governance.nextReview,
    pipe(s.content.collateral), pipe(s.triggers),
    pipe(s.relationships.precededBy), pipe(s.relationships.nextSolutions), s.relationships.managedDestination||'',
    pipe(relsFor(s.id).map(r=>I(r.industryId).name+':'+REL_LABEL[r.relevance]+':'+RSTATUS_LABEL[r.status]))];
}
function exportSolutionsCSV(){
  const rows=db.solutions.filter(matchesFilters).map(solutionRow);
  download('solcat-matrix-catalogue.csv', toCSV(CSV_COLS, rows), 'text/csv;charset=utf-8');
  toast('Exported '+num(rows.length)+' records as CSV. Edit in Excel, then import to reconcile.');
}
function exportMappingsCSV(){
  const cols=['id','solution_id','solution','industry','relevance','status','rationale','submitted_by','submitted_at','last_reviewed'];
  const rows=db.industryRelationships.map(r=>[r.id,r.solutionId,(SOL(r.solutionId)||{}).name||'',I(r.industryId).name,
    REL_LABEL[r.relevance]||r.relevance,RSTATUS_LABEL[r.status]||r.status,r.rationale,r.submittedBy,r.submittedAt,r.lastReviewed]);
  download('solcat-matrix-industry-mappings.csv', toCSV(cols, rows), 'text/csv;charset=utf-8');
  toast('Exported '+num(rows.length)+' industry mappings as CSV.');
}

/* Reconcile: update what matches, add what is new, never remove what is absent. */
function reconcileCSV(text){
  const rows=parseCSV(text);
  if(rows.length<2){ toast('That file has no data rows.'); return; }
  const head=rows[0].map(x=>String(x).trim().toLowerCase().replace(/\s+/g,'_'));
  const idx={}; CSV_COLS.forEach(c=>idx[c]=head.indexOf(c));
  if(idx.name<0){ modal(mshell('Import cannot proceed','<p>The file needs at least a <b>name</b> column. Export the catalogue first to get the expected headings.</p>','<button class="btn" data-mclose="1">Close</button>')); return; }
  const cell=(r,c)=>idx[c]>=0?String(r[idx[c]]||'').trim():'';
  const updates=[], adds=[], skipped=[];
  rows.slice(1).forEach((r,n)=>{
    const line=n+2, name=cell(r,'name');
    if(!name){ skipped.push('Row '+line+': no name.'); return; }
    const id=cell(r,'id'), existing=id?SOL(id):null;
    if(id && !existing){ skipped.push('Row '+line+': identifier "'+id+'" is not in the catalogue, so it will be added as a new record.'); }
    const prac=findPractice(cell(r,'primary_practice')), lens=findLens(cell(r,'primary_lens'));
    if(!existing && !prac){ skipped.push('Row '+line+': "'+name+'" has no recognised primary practice, so it cannot be added.'); return; }
    const patch={
      name:name, shortDescription:cell(r,'short_description'), customerProblem:cell(r,'customer_problem'),
      customerOutcome:cell(r,'customer_outcome'), capabilityCategory:cell(r,'capability_category'),
      solutionType:cell(r,'solution_type')
    };
    if(prac) patch.primaryPractice=prac.id;
    if(lens) patch.primaryLens=lens.id;
    if(idx.contributing_practices>=0) patch.contributingPractices=unpipe(cell(r,'contributing_practices')).map(findPractice).filter(Boolean).map(x=>x.id);
    if(idx.supporting_lenses>=0) patch.supportingLenses=unpipe(cell(r,'supporting_lenses')).map(findLens).filter(Boolean).map(x=>x.id);
    if(idx.products>=0) patch.products=unpipe(cell(r,'products')).map(findProduct).filter(Boolean).map(x=>x.id);
    const st=labelToKey(STATUS_LABEL,cell(r,'status')); if(st) patch.status=st;
    const cf=labelToKey(CONF_LABEL,cell(r,'confidence')); if(cf) patch.confidence=cf;
    const pv=labelToKey(PROV_LABEL,cell(r,'provenance')); if(pv) patch.provenance=pv;
    if(idx.customer_facing>=0) patch.customerFacing=!/^n/i.test(cell(r,'customer_facing'));
    patch.governance={};
    if(cell(r,'owner')) patch.governance.owner=cell(r,'owner');
    if(cell(r,'curator')) patch.governance.curator=cell(r,'curator');
    if(idx.last_reviewed>=0) patch.governance.lastReviewed=cell(r,'last_reviewed');
    if(idx.next_review>=0) patch.governance.nextReview=cell(r,'next_review');
    patch.content={}; if(idx.collateral>=0) patch.content.collateral=unpipe(cell(r,'collateral'));
    if(idx.customer_triggers>=0) patch.triggers=unpipe(cell(r,'customer_triggers'));
    patch.relationships={};
    if(idx.preceded_by>=0) patch.relationships.precededBy=unpipe(cell(r,'preceded_by')).filter(SOL);
    if(idx.next_solutions>=0) patch.relationships.nextSolutions=unpipe(cell(r,'next_solutions')).filter(SOL);
    if(idx.managed_destination>=0) patch.relationships.managedDestination=SOL(cell(r,'managed_destination'))?cell(r,'managed_destination'):'';
    if(existing){
      const diffs=[];
      if(existing.name!==patch.name) diffs.push('name');
      if(existing.primaryPractice!==(patch.primaryPractice||existing.primaryPractice)) diffs.push('practice');
      if(existing.primaryLens!==(patch.primaryLens||existing.primaryLens)) diffs.push('lens');
      if(existing.status!==(patch.status||existing.status)) diffs.push('status');
      if(patch.governance.owner && existing.governance.owner!==patch.governance.owner) diffs.push('owner');
      if(existing.customerOutcome!==patch.customerOutcome) diffs.push('outcome');
      updates.push({target:existing, patch:patch, diffs:diffs});
    } else {
      adds.push({id:(id||('solution-'+slug(name)+'-'+Math.floor(performance.now()%100000))), patch:patch, name:name});
    }
  });
  const changed=updates.filter(u=>u.diffs.length);
  const body='<p class="sub">Nothing is deleted. Records already in the catalogue but missing from this file are left exactly as they are.</p>'+
    '<div class="grid g3" style="margin-top:14px">'+
      '<div class="stat"><b>'+num(adds.length)+'</b><span>To be added</span></div>'+
      '<div class="stat"><b>'+num(changed.length)+'</b><span>To be changed</span></div>'+
      '<div class="stat"><b>'+num(updates.length-changed.length)+'</b><span>Matched, unchanged</span></div>'+
    '</div>'+
    (changed.length?'<span class="lbl">Changes</span><div class="grid" style="gap:6px">'+changed.slice(0,12).map(u=>
      '<div class="kv"><b>'+esc(u.target.name)+'</b><span>'+esc(u.diffs.join(', '))+'</span></div>').join('')+
      (changed.length>12?'<p class="sub">And '+num(changed.length-12)+' more.</p>':'')+'</div>':'')+
    (adds.length?'<span class="lbl">New records</span><div class="grid" style="gap:6px">'+adds.slice(0,12).map(a=>
      '<div class="kv"><b>'+esc(a.name)+'</b><span>'+esc(P(a.patch.primaryPractice).displayName)+'</span></div>').join('')+
      (adds.length>12?'<p class="sub">And '+num(adds.length-12)+' more.</p>':'')+'</div>':'')+
    (skipped.length?'<div class="note caution" style="margin-top:14px"><b>Rows needing attention</b><ul style="margin:7px 0 0;padding-left:19px">'+
      skipped.slice(0,8).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
      (skipped.length>8?'<p class="sub">And '+num(skipped.length-8)+' more.</p>':'')+'</div>':'');
  modal(mshell('Reconcile '+num(rows.length-1)+' rows from Excel', body,
    '<button class="btn" data-mclose="1">Cancel</button>'+
    ((adds.length||changed.length)?'<button class="btn primary" id="csvApply">Apply to the catalogue</button>':'')));
  const btn=$('#csvApply'); if(!btn) return;
  btn.onclick=()=>{
    updates.forEach(u=>mergeInto(u.target, u.patch));
    adds.forEach(a=>{ const rec=mergeInto(deepClone(BLANK_SOLUTION), a.patch); rec.id=a.id;
      rec.provenance=rec.provenance||'mock-illustrative'; db.solutions.push(rec); });
    audit('csv-reconcile','', num(changed.length)+' changed, '+num(adds.length)+' added from a spreadsheet');
    save(); closeModal(); render();
    toast('Reconciled. '+num(changed.length)+' changed, '+num(adds.length)+' added, nothing deleted.');
  };
}

  $('#roleSel').innerHTML = ROLES.map(r=>'<option value="'+r.id+'"'+(S.role===r.id?' selected':'')+'>'+esc(r.name)+'</option>').join('');
}
function routeParts(){ return (location.hash.replace(/^#\/?/,'').split('?')[0]||'').split('/').filter(Boolean); }
function hashQuery(){
  const i=location.hash.indexOf('?'); if(i<0) return {};
  const o={}; location.hash.slice(i+1).split('&').forEach(kv=>{
    const p=kv.split('='); if(p[0]) o[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||''); });
  return o;
}
function readHashState(){
  const q=hashQuery(); if(!Object.keys(q).length) return;
  S.filters={}; S.q='';
  Object.keys(q).forEach(k=>{ if(k==='q') S.q=q[k]; else if(k==='density') S.density=q[k]; else S.filters[k]=q[k]; });
}
function syncHashState(){
  const parts=[];
  Object.keys(S.filters).forEach(k=>{ if(S.filters[k] && k!==S._auto) parts.push(encodeURIComponent(k)+'='+encodeURIComponent(S.filters[k])); });
  if(S.q) parts.push('q='+encodeURIComponent(S.q));
  const base='#/'+routeParts().join('/');
  const next=parts.length? base+'?'+parts.join('&') : base;
  if(location.hash!==next && history.replaceState) history.replaceState(null,'',next);
}
function copyView(){
  const url=location.href;
  const done=()=>toast('Link copied. It opens on this exact view.');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,()=>toast(url));
  else toast(url);
}
/* Navigating to a practice, lens or industry IS setting that filter. The bar
   always shows the truth, and clearing it takes you back to the whole matrix. */
function syncScope(r){
  if(S._auto){ delete S.filters[S._auto]; S._auto=null; }
  if(r[0]==='practice'&&r[1]){ S.filters.practice=r[1]; S._auto='practice'; }
  else if(r[0]==='industry'&&r[1]){ S.filters.industry=r[1]; S._auto='industry'; }
  else if(r[0]==='lens'&&r[1]){ S.filters.lens=r[1]; S._auto='lens'; }
}
function scopedNav(kind, value){
  const r=routeParts();
  if(r[0]===kind){ location.hash = value ? '#/'+kind+'/'+value : '#/matrix'; return true; }

    case 'solution': html=viewSolution(r[1]); break;
    case 'products': html=viewProducts(); break;

  $('#app').innerHTML=html;

function importJSON(text){
  let parsed;
  try{ parsed=JSON.parse(text); }catch(e){ toast('That file is not valid JSON.'); return; }
  const problems=[];
  if(!parsed || !Array.isArray(parsed.solutions)) problems.push('No solutions array was found.');
  if(parsed && Array.isArray(parsed.solutions)){
    const ids={}; parsed.solutions.forEach(s=>{ if(!s.id) problems.push('A record has no identifier.'); if(ids[s.id]) problems.push('Duplicate identifier: '+s.id); ids[s.id]=1; });
    (parsed.industryRelationships||[]).forEach(r=>{ if(!ids[r.solutionId]) problems.push('A mapping points at an unknown record: '+r.solutionId); });
    if(!Array.isArray(parsed.practices)||!parsed.practices.length) problems.push('No practices were found.');
  }
  if(problems.length){
    modal(mshell('Import cannot proceed', '<p>The file was read but did not validate.</p><ul>'+
      problems.slice(0,10).map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>'+
      (problems.length>10?'<p class="sub">And '+num(problems.length-10)+' more problems.</p>':''),
      '<button class="btn" data-mclose="1">Close</button>'));
    return;
  }
  confirmModal('Replace the local catalogue?',
    'The file contains '+num(parsed.solutions.length)+' records and '+num((parsed.industryRelationships||[]).length)+' industry relationships. '+
    'This replaces everything currently stored in this browser.',
    'Replace it', ()=>{
      db=parsed; db.seedVersion=SEED_VERSION; db.audit=db.audit||[];
      audit('import','', num(parsed.solutions.length)+' records imported');
      save(); render(); toast('Catalogue replaced from the imported file.');
    });
}

}
function decideRel(id, action){
  const r=db.industryRelationships.find(x=>x.id===id); if(!r) return;
  const s=SOL(r.solutionId);
  if(action==='reject'){
    modal(mshell('Reject this mapping', '<p class="sub">The record and the reason are kept in history.</p>'+
      '<span class="lbl">Reason (required)</span><textarea class="inp" id="rjWhy"></textarea>',
      '<button class="btn" data-mclose="1">Cancel</button><button class="btn danger" id="rjGo">Reject</button>'));
    $('#rjGo').onclick=()=>{ const why=$('#rjWhy').value.trim(); if(why.length<5){ toast('A reason is required.'); return; }
      r.history.push({at:todayISO(), by:roleName(), action:'rejected', note:why});
      r.status='rejected'; if(can('review-industry')) r.industryApproval='rejected'; else r.practiceApproval='rejected';
      r.rationale=r.rationale+' (Rejected: '+why+')'; r.lastReviewed=todayISO();
      audit('mapping-rejected', r.id, why); save(); closeModal(); render(); toast('Mapping rejected. The reason is kept.'); };
    return;
  }
  if(action==='clarify'){
    r.status='needs-review'; r.lastReviewed=todayISO();
    r.history.push({at:todayISO(), by:roleName(), action:'clarification-requested', note:''});
    audit('mapping-clarify', r.id, 'Clarification requested'); save(); render(); toast('Clarification requested from the submitter.');
    return;
  }
  /* Confirm from whichever side the current role represents */
  const asIndustry = can('review-industry') && !can('edit-global') ? true : (S.role==='industry-admin');
  if(can('edit-global')){ r.practiceApproval='approved'; r.industryApproval='approved'; }
  else if(asIndustry) r.industryApproval='approved';
  else r.practiceApproval='approved';
  r.status = (r.practiceApproval==='approved'&&r.industryApproval==='approved') ? 'jointly-confirmed'
    : (r.industryApproval==='approved' ? 'industry-confirmed' : 'practice-confirmed');
  if(r.status==='jointly-confirmed') r.staffnetVisibility='approved';
  r.lastReviewed=todayISO();
  r.history.push({at:todayISO(), by:roleName(), action:'confirmed', note:''});
  audit('mapping-confirmed', r.id, (s?s.name:'')+' to '+I(r.industryId).name+': '+RSTATUS_LABEL[r.status]);
  save(); render();
  toast(r.status==='jointly-confirmed' ? 'Jointly confirmed. Both the practice and the industry have approved it.'
    : RSTATUS_LABEL[r.status]+'. The other side still has to approve it.');
}

/* Global listeners */
document.addEventListener('click', e=>{
  const mc=e.target.closest('[data-mclose]'); if(mc){ closeModal(); return; }
  if(e.target.id==='shade' || e.target.id==='dclose' || e.target.closest('#dclose')) closeDrawer();
  if(e.target.id==='modal') closeModal();
});
document.addEventListener('keydown', e=>{
  const typing=/^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement||{}).tagName||'');
  if(e.key==='Escape'){ closeDrawer(); closeModal(); if(S.present) exitPresenter(); }
  if(e.key==='/' && !typing){ e.preventDefault(); const f=$('#fq'); if(f) f.focus(); else { location.hash='#/matrix'; setTimeout(()=>{ const g=$('#fq'); if(g) g.focus(); },60); } }
  if(S.present && !typing){
    if(e.key==='ArrowRight'){ if(S.presentStep<RUNSHEET.length-1){ S.presentStep++; runStep(); } }
    if(e.key==='ArrowLeft'){ if(S.presentStep>0){ S.presentStep--; runStep(); } }
  }
});
window.addEventListener('hashchange', ()=>{ closeDrawer(); readHashState(); render(); if(S.present) paintPresenter(); });

/* ═══════════════════════════════════════════════════════════
   23. Boot
   ═══════════════════════════════════════════════════════════ */
(function boot(){
  const how=load();
  S.density = (db.prefs&&db.prefs.density) || 'standard';
  S.sel={};
  paintRole();
  $('#roleSel').onchange=e=>{ S.role=e.target.value;
    const r=ROLES.find(x=>x.id===S.role);
    toast('Viewing as '+esc(roleName())+'.'+(r&&r.scoped==='practice'?' Scoped to '+esc(P(S.practiceScope).displayName)+'.':''));
    render(); };
  $('#presentBtn').onclick=()=>{ S.present? exitPresenter() : startPresenter(); };
  if(!location.hash) location.hash='#/';
  readHashState();
  render();
  measureTop();
  sidBoot();
  if(how==='reseeded') toast('The seed catalogue changed, so local data was rebuilt.');
})();
</script>
