      <div class="hudBottom">
        <div class="hudActions">
          <button type="button" id="backButton" hidden>← Back</button>
          <button type="button" id="resetButton" hidden>Reset view</button>
        </div>
        <a class="arChip" href="/nav/ar">
          <span>Stand inside it</span>
          <b>Open in AR ↗</b>
        </a>
      </div>
    </div>

    <aside class="detailCard" id="detailCard" hidden data-ui aria-live="polite"></aside>

    <div class="worldVeil" id="worldVeil">
      <div class="veilInner">
        <b>Building the portfolio</b>
        <span id="veilNote">Nine practices, 214 offerings.</span>
      </div>
    </div>
