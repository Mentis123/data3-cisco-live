    <style>
        html, body {
            overflow-x: auto;
            background-color: #0b1020;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.18), transparent 35%),
                        radial-gradient(circle at 80% 0%, rgba(37, 99, 235, 0.14), transparent 30%),
                        linear-gradient(135deg, #0b1020 0%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }
        .whiteboard-bg {
            background-color: #0b1020;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
                radial-gradient(circle at 30% 20%, rgba(124, 58, 237, 0.12), transparent 30%),
                radial-gradient(circle at 80% 10%, rgba(56, 189, 248, 0.1), transparent 25%);
            background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
        }
        .marker-text { font-family: 'Caveat', cursive; }
        .sticky-note {
            background: linear-gradient(145deg, #1f2937 0%, #0f172a 100%);
            box-shadow: 4px 4px 18px rgba(0,0,0,0.45), inset 0 -2px 4px rgba(255,255,255,0.04);
            position: relative;
            transition: all 0.2s ease;
            min-height: 120px;
            transform: rotate(var(--rotation, 0deg));
            border: 1px solid rgba(255,255,255,0.04);
        }
        .sticky-note:hover {
            transform: rotate(0deg) scale(1.02) translateY(-2px);
            box-shadow: 6px 6px 20px rgba(0,0,0,0.35), inset 0 -2px 4px rgba(0,0,0,0.08);
            z-index: 10;
            border-color: rgba(124, 58, 237, 0.3);
        }
        .sticky-note::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 46px;
            height: 12px;
            background: rgba(148, 163, 184, 0.6);
            border-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 26px;
            height: 26px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s ease;
            color: #e2e8f0;
        }
        .sticky-note:hover .copy-btn { opacity: 1; }
        .copy-btn:hover { background: rgba(255,255,255,0.9); color: #0f172a; transform: scale(1.05); }
        .copy-btn.copied { background: #22c55e; color: #0f172a; }
        .group-copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid rgba(124, 58, 237, 0.55);
            background: rgba(255,255,255,0.04);
            color: #c4b5fd;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .group-copy-btn:hover { background: rgba(124, 58, 237, 0.25); color: #0b1020; border-color: rgba(124, 58, 237, 0.9); transform: translateY(-1px); }
        .group-copy-btn.copied { background: #22c55e; border-color: #22c55e; color: #0b1020; }
        .phase-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
        .note-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
        .section-card {
            background: rgba(15, 23, 42, 0.78);
            border: 2px dashed rgba(124, 58, 237, 0.35);
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        /* GTM link styling - hidden, looks like normal text */
        .gtm-link {
            color: inherit;
            text-decoration: none;
            cursor: text;
        }
        .gtm-link:hover {
            color: inherit;
            text-decoration: none;
        }
        /* Navigation bar */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(11, 16, 32, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(124, 58, 237, 0.3);
            padding: 12px 20px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-link {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        .nav-link:hover {
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.05);
        }
        .nav-link.active {
            color: #c4b5fd;
            background: rgba(124, 58, 237, 0.15);
            border-color: rgba(124, 58, 237, 0.4);
        }
        .badge {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.35px;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e293b;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 200;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>

    <script>
        const phaseData = [
            { phaseNumber: 1, phase: 'Envision Discover', owner: 'Dan / Leon', layer: 'Strategy & Planning', task: 'Plan Program Roadmap' },
            { phaseNumber: 1, phase: 'Envision Discover', owner: 'Dan / Leon', layer: 'Strategy & Planning', task: 'Innovation pipeline mgmt / Customer Maturity' },
            { phaseNumber: 1, phase: 'Envision Discover', owner: 'Dan / Leon', layer: 'Strategy & Planning', task: 'Readiness Assessment (AI readiness)' },
            { phaseNumber: 1, phase: 'Envision Discover', owner: 'Dan / Leon', layer: 'Technical', task: 'Use Case Development' },
            { phaseNumber: 1, phase: 'Envision Discover', owner: 'Dan / Leon', layer: 'Technical', task: 'POC -> Value Hypothesis' },
            { phaseNumber: 1, phase: 'Envision Discover', owner: 'Dan / Leon', layer: 'Output (Advise)', task: 'Workshops; Strategy Consult; Discovery; Value Prop' },

            { phaseNumber: 2, phase: 'Prototype & Validate', owner: 'Steve', layer: 'Execution', task: 'Prototyping Model (experiment & tuning)', dependencies: 'Bypass if COTS?' },
            { phaseNumber: 2, phase: 'Prototype & Validate', owner: 'Steve', layer: 'Execution', task: 'POV (Proof of Value)' },
            { phaseNumber: 2, phase: 'Prototype & Validate', owner: 'Steve', layer: 'Validation', task: 'Validated Hypothesis' },
            { phaseNumber: 2, phase: 'Prototype & Validate', owner: 'Steve', layer: 'Validation', task: 'Solution options / Budgeting' },
            { phaseNumber: 2, phase: 'Prototype & Validate', owner: 'Steve', layer: 'Validation', task: 'Tech & Biz Change' },
            { phaseNumber: 2, phase: 'Prototype & Validate', owner: 'Steve', layer: 'Financial', task: 'Business Case +/- 50%' },
            { phaseNumber: 2, phase: 'Prototype & Validate', owner: 'Steve', layer: 'Decision Gate', task: 'Define POC -> Go/No Go -> ROI' },

            { phaseNumber: 3, phase: 'Sol Design', owner: 'Mark', layer: 'Governance & Biz', task: 'Governance Framework' },
            { phaseNumber: 3, phase: 'Sol Design', owner: 'Mark', layer: 'Governance & Biz', task: 'Test Plan / Req Documents' },
            { phaseNumber: 3, phase: 'Sol Design', owner: 'Mark', layer: 'Governance & Biz', task: 'ROI & Business Case' },
            { phaseNumber: 3, phase: 'Sol Design', owner: 'Mark', layer: 'Governance & Biz', task: 'Sol Blueprint Proposal' },
            { phaseNumber: 3, phase: 'Sol Design', owner: 'Mark', layer: 'Security & Risk', task: 'Security & Compliance' },
            { phaseNumber: 3, phase: 'Sol Design', owner: 'Mark', layer: 'Security & Risk', task: 'Risk Arch & Change' },
            { phaseNumber: 3, phase: 'Sol Design', owner: 'Mark', layer: 'Security & Risk', task: 'Change Operating Model' },
            { phaseNumber: 3, phase: 'Sol Design', owner: 'Mark', layer: 'Architecture', task: 'Collaborative Agile Enterprise Architecture' },
            { phaseNumber: 3, phase: 'Sol Design', owner: 'Mark', layer: 'Architecture', task: 'Process design map model' },
            { phaseNumber: 3, phase: 'Sol Design', owner: 'Mark', layer: 'Output (Procure)', task: 'Governance Model; Architecture Blueprint; Business Case +/- 10%' },

            { phaseNumber: 4, phase: 'Build & Deploy', owner: 'David', layer: 'Technical Dev', task: 'Production Agent Dev' },
            { phaseNumber: 4, phase: 'Build & Deploy', owner: 'David', layer: 'Technical Dev', task: 'RAG & Knowledge Integration' },
            { phaseNumber: 4, phase: 'Build & Deploy', owner: 'David', layer: 'Security & Orch', task: 'Multi-Agent Orchestration' },
            { phaseNumber: 4, phase: 'Build & Deploy', owner: 'David', layer: 'Security & Orch', task: 'Security Hardening & Testing' },
            { phaseNumber: 4, phase: 'Build & Deploy', owner: 'David', layer: 'Testing', task: 'Red Teaming' },
            { phaseNumber: 4, phase: 'Build & Deploy', owner: 'David', layer: 'Testing', task: 'UAT' },
            { phaseNumber: 4, phase: 'Build & Deploy', owner: 'David', layer: 'Workflow (Deploy)', task: 'CI/CD -> Integration -> Production Release', dependencies: 'Agile Methodology' },

            { phaseNumber: 5, phase: 'Adopt & Scale', owner: 'Dan / Mark', layer: 'Change Mgmt', task: 'Change Management' },
            { phaseNumber: 5, phase: 'Adopt & Scale', owner: 'Dan / Mark', layer: 'Change Mgmt', task: 'User training & enablement' },
            { phaseNumber: 5, phase: 'Adopt & Scale', owner: 'Dan / Mark', layer: 'Growth', task: 'Champion Network Development' },
            { phaseNumber: 5, phase: 'Adopt & Scale', owner: 'Dan / Mark', layer: 'Growth', task: 'Expansion to new use cases' },
            { phaseNumber: 5, phase: 'Adopt & Scale', owner: 'Dan / Mark', layer: 'Workflow (Adopt)', task: 'Training -> OCM Plan -> Adoption KPI -> Impact ROI Measurement' },

            { phaseNumber: 6, phase: 'Operate Optimize', owner: 'Bruce', layer: 'Value', task: 'ROI Validation' },
            { phaseNumber: 6, phase: 'Operate Optimize', owner: 'Bruce', layer: 'Operations', task: 'Managed AI Operations' },
            { phaseNumber: 6, phase: 'Operate Optimize', owner: 'Bruce', layer: 'Operations', task: 'Performance Tuning & Optimization' },
            { phaseNumber: 6, phase: 'Operate Optimize', owner: 'Bruce', layer: 'Governance', task: 'AMS (Security & Compliance Audit)' },
            { phaseNumber: 6, phase: 'Operate Optimize', owner: 'Bruce', layer: 'Growth', task: 'Innovation Pipeline Mgmt -> Publish to Mgmt gallery' },
            { phaseNumber: 6, phase: 'Operate Optimize', owner: 'Bruce', layer: 'Workflow (Operate)', task: 'CSI Service Imp Roadmap -> MLOps -> Analytics' }
        ];
        const phaseGrid = document.querySelector('.phase-grid');
        const toast = document.getElementById('toast');

        const groupByPhase = phaseData.reduce((acc, item) => {
            acc[item.phase] = acc[item.phase] || [];
            acc[item.phase].push(item);
            return acc;
        }, {});

        const noteBackgrounds = [
            'linear-gradient(145deg, #1f2937 0%, #0f172a 100%)',
            'linear-gradient(145deg, #1e293b 0%, #0b162d 100%)',
            'linear-gradient(145deg, #18233a 0%, #0b1326 100%)',
            'linear-gradient(145deg, #202f45 0%, #0c1427 100%)',
            'linear-gradient(145deg, #1c2840 0%, #0c162d 100%)'
        ];

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1700);
        }

        function copyNote(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                button.classList.add('copied');
                button.innerHTML = '✓';
                showToast('Copied to clipboard');
                setTimeout(() => {
                    button.classList.remove('copied');
                    button.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>';
                }, 1200);
            });
        }

        function copyGroup(lines, button, label) {
            if (!lines.length) {
                showToast('No items to copy');
                return;
            }

            navigator.clipboard.writeText([label, ...lines].join('\n')).then(() => {
                button.classList.add('copied');
                showToast('Copied list to clipboard');
                setTimeout(() => button.classList.remove('copied'), 1200);
            });
        }

        Object.entries(groupByPhase).forEach(([phase, notes], index) => {
            const phaseNumber = notes[0]?.phaseNumber || index + 1;
            const phaseOwner = notes[0]?.owner || 'Owner TBD';

            const section = document.createElement('section');
            section.className = 'section-card';
            section.innerHTML = `
                <div class="flex items-start justify-between gap-3 flex-wrap">
                    <div>
                        <p class="text-xs uppercase tracking-[0.2em] text-purple-200">Phase ${phaseNumber}</p>
                        <h2 class="marker-text text-3xl text-purple-100">${phase}</h2>
                        <div class="flex items-center gap-2 mt-2">
                            <span class="badge" style="background: rgba(124, 58, 237, 0.18); color: #c4b5fd;">Owner: ${phaseOwner}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="badge" style="background: rgba(124, 58, 237, 0.18); color: #d8b4fe;">${notes.length} workstreams</span>
                        <button class="group-copy-btn tile-copy-btn" data-label="Phase ${phaseNumber} - ${phase}" aria-label="Copy ${phase} workstreams">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                            Copy tile
                        </button>
                    </div>
                </div>
                <div class="note-grid"></div>
            `;

            const noteGrid = section.querySelector('.note-grid');

            notes.forEach((note, noteIndex) => {
                const card = document.createElement('div');
                card.className = 'sticky-note rounded-lg p-4 text-slate-100';
                card.style.setProperty('--rotation', `${(noteIndex % 3 - 1) * 1.5}deg`);
                card.style.background = noteBackgrounds[noteIndex % noteBackgrounds.length];

                const detail = note.dependencies || (note.task.includes(':') ? note.task.split(':').slice(1).join(':').trim() : '');
                const primaryTask = note.task.includes(':') ? note.task.split(':')[0] : note.task;
                const copyText = `${note.phase} | ${note.owner} | ${note.layer}: ${note.task}${note.dependencies ? ` (${note.dependencies})` : ''}`;

                card.innerHTML = `
                    <button class="copy-btn" title="Copy note" aria-label="Copy note">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    </button>
                    <div class="flex items-center gap-2 mb-2">
                        <span class="badge" style="background: rgba(124,58,237,0.25); color: #c4b5fd;">${note.layer}</span>
                    </div>
                    <div class="marker-text text-xl text-slate-100 leading-tight">${primaryTask}</div>
                    <p class="text-[13px] text-slate-300 mt-2 leading-relaxed">${detail}</p>
                `;

                card.querySelector('.copy-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    copyNote(copyText, e.currentTarget);
                });

                noteGrid.appendChild(card);
            });

            section.querySelector('.tile-copy-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                const lines = notes.map(item => `${item.phase} | ${item.owner} | ${item.layer}: ${item.task}${item.dependencies ? ` (${item.dependencies})` : ''}`);
                copyGroup(lines, e.currentTarget, `Phase ${phaseNumber} - ${phase}`);
            });

            phaseGrid.appendChild(section);
        });
    </script>

    <style>
        /* AI Chat Widget Styles */
        #agent-chat-widget {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 10000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            pointer-events: none;
        }

        #agent-chat-toggle,
        #agent-chat-window {
            pointer-events: auto;
        }

        #agent-chat-toggle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4), 0 0 40px rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            animation: pulse-glow 2s ease-in-out infinite;
            overflow: hidden;
            padding: 0;
        }

        .agent-avatar-toggle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
        }

        .agent-avatar-header {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4), 0 0 40px rgba(139, 92, 246, 0.2); }
            50% { box-shadow: 0 4px 30px rgba(99, 102, 241, 0.6), 0 0 60px rgba(139, 92, 246, 0.4); }
        }

        #agent-chat-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.6), 0 0 60px rgba(139, 92, 246, 0.4);
        }

        #agent-chat-toggle:active {
            transform: scale(0.95);
        }

        #agent-chat-toggle.hidden {
            display: none;
        }

        #agent-chat-window {
            position: absolute;
            bottom: 70px;
            left: 0;
            width: min(380px, calc(100vw - 24px));
            height: 500px;
            max-height: calc(100vh - 120px);
            box-sizing: border-box;
            background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 80px rgba(99, 102, 241, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        #agent-chat-window.hidden {
            display: none;
        }

        .agent-chat-header {
            padding: 14px 16px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
            border-bottom: 1px solid rgba(99, 102, 241, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .agent-chat-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 15px;
            font-weight: 600;
        }

        .agent-chat-header button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .agent-chat-header button:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .agent-chat-header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .agent-chat-header-actions button.hidden {
            display: none;
        }

        /* Fullscreen mode */
        #agent-chat-window.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            max-height: 100%;
            border-radius: 0;
            border: none;
            z-index: 10001;
        }

        #agent-chat-window.fullscreen #agent-chat-messages {
            padding: 24px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        #agent-chat-window.fullscreen .agent-chat-message {
            max-width: 75%;
        }

        #agent-chat-window.fullscreen #agent-chat-form {
            max-width: 100%;
            width: 100%;
            margin: 0;
            padding: 16px 48px;
            box-sizing: border-box;
        }

        #agent-chat-window.fullscreen #agent-chat-input {
            width: 100%;
            max-width: none;
        }

        /* Copy button for assistant messages */
        .agent-chat-message.assistant {
            position: relative;
        }

        .agent-chat-copy-btn {
            position: absolute;
            top: 4px;
            right: -32px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            opacity: 0;
        }

        .agent-chat-message.assistant:hover .agent-chat-copy-btn {
            opacity: 1;
        }

        .agent-chat-copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .agent-chat-copy-btn.copied {
            color: #22c55e;
        }

        .agent-chat-copy-btn.copied:hover {
            color: #22c55e;
        }

        /* Adjust message wrapper to accommodate copy button */
        .agent-chat-message.assistant .agent-chat-bubble {
            position: relative;
        }

        #agent-chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            font-size: 14px;
            background: transparent;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #agent-chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        #agent-chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        #agent-chat-messages::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 3px;
        }

        .agent-chat-message {
            max-width: 85%;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .agent-chat-message.user {
            margin-left: auto;
        }

        .agent-chat-message.assistant {
            margin-right: auto;
        }

        .agent-chat-bubble {
            display: inline-block;
            padding: 10px 14px;
            border-radius: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .agent-chat-message.user .agent-chat-bubble {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .agent-chat-message.assistant .agent-chat-bubble {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-bottom-left-radius: 4px;
            white-space: normal;
        }

        .agent-chat-bubble p {
            margin: 0 0 8px 0;
        }

        .agent-chat-bubble p:last-child {
            margin-bottom: 0;
        }

        .agent-chat-bubble strong {
            font-weight: 600;
            color: #a5b4fc;
        }

        .agent-chat-bubble em {
            font-style: italic;
            color: #c4b5fd;
        }

        .agent-chat-bubble .chat-code {
            background: rgba(99, 102, 241, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9em;
            color: #a5b4fc;
        }

        .agent-chat-bubble .chat-list {
            margin: 8px 0;
            padding-left: 20px;
        }

        .agent-chat-bubble .chat-list:first-child {
            margin-top: 0;
        }

        .agent-chat-bubble .chat-list:last-child {
            margin-bottom: 0;
        }

        .agent-chat-bubble .chat-list li {
            margin: 4px 0;
            line-height: 1.5;
        }

        .agent-chat-bubble ul.chat-list {
            list-style-type: disc;
        }

        .agent-chat-bubble ul.chat-list li::marker {
            color: #8b5cf6;
        }

        .agent-chat-bubble ol.chat-list {
            list-style-type: decimal;
        }

        .agent-chat-bubble ol.chat-list li::marker {
            color: #8b5cf6;
        }

        .agent-chat-typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .agent-chat-typing span {
            width: 8px;
            height: 8px;
            background: rgba(99, 102, 241, 0.6);
            border-radius: 50%;
            animation: typing 1.4s ease-in-out infinite;
        }

        .agent-chat-typing span:nth-child(2) { animation-delay: 0.2s; }
        .agent-chat-typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }

        #agent-chat-form {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid rgba(99, 102, 241, 0.2);
            background: rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        #agent-chat-input {
            flex: 1;
            border-radius: 12px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 10px 14px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            outline: none;
            transition: all 0.2s ease;
            min-height: 44px;
            max-height: 120px;
            resize: none;
            overflow: auto;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #agent-chat-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #agent-chat-input:focus {
            border-color: rgba(99, 102, 241, 0.6);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        #agent-chat-submit {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: none;
            padding: 0;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        #agent-chat-submit:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        #agent-chat-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            #agent-chat-widget {
                bottom: 12px;
                left: 12px;
                right: auto;
            }

            #agent-chat-toggle {
                width: 48px;
                height: 48px;
            }

            #agent-chat-window {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                height: 100dvh;
                max-height: 100dvh;
                border-radius: 0;
                border: none;
                padding: 0;
                margin: 0;
                overscroll-behavior: contain;
                display: flex;
                flex-direction: column;
            }

            .agent-chat-header {
                padding-top: max(14px, env(safe-area-inset-top));
                min-height: max(52px, calc(38px + env(safe-area-inset-top)));
            }

            #agent-chat-messages {
                padding: 12px;
            }

            .agent-chat-message {
                max-width: 90%;
            }

            #agent-chat-form {
                padding: 12px;
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            #agent-chat-window {
                width: 340px;
                height: 450px;
            }
        }
    </style>

    <script>
        (function() {
            const widget = document.getElementById('agent-chat-widget');
            if (!widget) return;

            const toggleButton = document.getElementById('agent-chat-toggle');
            const chatWindow = document.getElementById('agent-chat-window');
            const closeButton = document.getElementById('agent-chat-close');
            const expandButton = document.getElementById('agent-chat-expand');
            const collapseButton = document.getElementById('agent-chat-collapse');
            const messagesEl = document.getElementById('agent-chat-messages');
            const form = document.getElementById('agent-chat-form');
            const input = document.getElementById('agent-chat-input');
            const submitButton = document.getElementById('agent-chat-submit');

            let isSending = false;
            let threadId = null;
            let isFullscreen = false;

            const resizeInput = () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 120) + 'px';
            };

            input.addEventListener('input', resizeInput);
            input.addEventListener('focus', resizeInput);

            function parseMarkdown(text) {
                if (!text) return '';

                let html = text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');

                const lines = html.split('\n');
                let result = [];
                let inList = false;
                let listType = null;

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i];

                    const bulletMatch = line.match(/^(\s*)[*-]\s+(.+)$/);
                    const numberMatch = line.match(/^(\s*)\d+\.\s+(.+)$/);

                    if (bulletMatch) {
                        if (!inList || listType !== 'ul') {
                            if (inList) result.push(listType === 'ul' ? '</ul>' : '</ol>');
                            result.push('<ul class="chat-list">');
                            inList = true;
                            listType = 'ul';
                        }
                        result.push('<li>' + formatInline(bulletMatch[2]) + '</li>');
                    } else if (numberMatch) {
                        if (!inList || listType !== 'ol') {
                            if (inList) result.push(listType === 'ul' ? '</ul>' : '</ol>');
                            result.push('<ol class="chat-list">');
                            inList = true;
                            listType = 'ol';
                        }
                        result.push('<li>' + formatInline(numberMatch[2]) + '</li>');
                    } else {
                        if (inList) {
                            result.push(listType === 'ul' ? '</ul>' : '</ol>');
                            inList = false;
                            listType = null;
                        }
                        if (line.trim()) {
                            result.push('<p>' + formatInline(line) + '</p>');
                        }
                    }
                }

                if (inList) {
                    result.push(listType === 'ul' ? '</ul>' : '</ol>');
                }

                return result.join('');
            }

            function formatInline(text) {
                return text
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/__(.+?)__/g, '<strong>$1</strong>')
                    .replace(/(?<!\w)\*([^*]+?)\*(?!\w)/g, '<em>$1</em>')
                    .replace(/(?<!\w)_([^_]+?)_(?!\w)/g, '<em>$1</em>')
                    .replace(/`([^`]+?)`/g, '<code class="chat-code">$1</code>');
            }

            function appendMessage(text, role) {
                const typingEl = messagesEl.querySelector('.agent-chat-typing-wrapper');
                if (typingEl) typingEl.remove();

                const msg = document.createElement('div');
                msg.className = `agent-chat-message ${role}`;

                const bubble = document.createElement('div');
                bubble.className = 'agent-chat-bubble';

                if (role === 'assistant') {
                    bubble.innerHTML = parseMarkdown(text);

                    // Add copy button for assistant messages
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'agent-chat-copy-btn';
                    copyBtn.setAttribute('aria-label', 'Copy message');
                    copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>`;
                    copyBtn.addEventListener('click', () => {
                        navigator.clipboard.writeText(text).then(() => {
                            copyBtn.classList.add('copied');
                            copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>`;
                            setTimeout(() => {
                                copyBtn.classList.remove('copied');
                                copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>`;
                            }, 2000);
                        });
                    });
                    msg.appendChild(copyBtn);
                } else {
                    bubble.textContent = text;
                }

                msg.appendChild(bubble);
                messagesEl.appendChild(msg);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function showTyping() {
                const wrapper = document.createElement('div');
                wrapper.className = 'agent-chat-message assistant agent-chat-typing-wrapper';

                const typing = document.createElement('div');
                typing.className = 'agent-chat-bubble agent-chat-typing';
                typing.innerHTML = '<span></span><span></span><span></span>';

                wrapper.appendChild(typing);
                messagesEl.appendChild(wrapper);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function setSendingState(sending) {
                isSending = sending;
                input.disabled = sending;
                submitButton.disabled = sending;
            }

            toggleButton.addEventListener('click', () => {
                chatWindow.classList.toggle('hidden');

                if (!chatWindow.classList.contains('hidden')) {
                    input.focus();
                    if (messagesEl.childElementCount === 0) {
                        appendMessage("You're viewing our GTM Phases - the journey from Envision to Operate. I can help you understand phase transitions, owner responsibilities, or how governance applies at each stage. Which phase would you like to explore?", 'assistant');
                    }
                }
            });

            closeButton.addEventListener('click', () => {
                chatWindow.classList.add('hidden');
                // Reset fullscreen state when closing
                if (isFullscreen) {
                    chatWindow.classList.remove('fullscreen');
                    expandButton.classList.remove('hidden');
                    collapseButton.classList.add('hidden');
                    isFullscreen = false;
                }
            });

            // Fullscreen expand/collapse handlers
            expandButton.addEventListener('click', () => {
                chatWindow.classList.add('fullscreen');
                expandButton.classList.add('hidden');
                collapseButton.classList.remove('hidden');
                isFullscreen = true;
                input.focus();
            });

            collapseButton.addEventListener('click', () => {
                chatWindow.classList.remove('fullscreen');
                expandButton.classList.remove('hidden');
                collapseButton.classList.add('hidden');
                isFullscreen = false;
                input.focus();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !chatWindow.classList.contains('hidden')) {
                    if (isFullscreen) {
                        // First collapse from fullscreen
                        chatWindow.classList.remove('fullscreen');
                        expandButton.classList.remove('hidden');
                        collapseButton.classList.add('hidden');
                        isFullscreen = false;
                    } else {
                        // Then close the chat
                        chatWindow.classList.add('hidden');
                    }
                }
            });

            window.openAgentChat = function() {
                toggleButton.classList.remove('hidden');
                chatWindow.classList.remove('hidden');
                input.focus();
                if (messagesEl.childElementCount === 0) {
                    appendMessage("You're viewing our GTM Phases - the journey from Envision to Operate. I can help you understand phase transitions, owner responsibilities, or how governance applies at each stage. Which phase would you like to explore?", 'assistant');
                }
            };

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (isSending) return;

                const text = input.value.trim();
                if (!text) return;

                appendMessage(text, 'user');
                input.value = '';
                resizeInput();
                setSendingState(true);
                showTyping();

                try {
                    const response = await fetch('/api/agent-chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            input: text,
                            threadId: threadId,
                            contextSource: 'gtm_strategy',
                            uiContext: 'GTM Strategy - Phases, Owners & Layers'
                        }),
                    });

                    const data = await response.json();

                    if (data.threadId) {
                        threadId = data.threadId;
                    }

                    appendMessage(data.reply || '(no reply)', 'assistant');
                } catch (err) {
                    console.error('Chat error:', err);
                    appendMessage('Sorry, I had trouble connecting. Please try again.', 'assistant');
                } finally {
                    setSendingState(false);
                    input.focus();
                    resizeInput();
                }
            });
        })();
    </script>
</body>
</html>
