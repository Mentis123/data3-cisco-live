                            <polyline points="9 21 3 21 3 15"></polyline>
                            <line x1="21" y1="3" x2="14" y2="10"></line>
                            <line x1="3" y1="21" x2="10" y2="14"></line>
                        </svg>
                    </button>
                    <button id="prometheus-chat-collapse" class="hidden" aria-label="Collapse chat">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="4 14 10 14 10 20"></polyline>
                            <polyline points="20 10 14 10 14 4"></polyline>
                            <line x1="14" y1="10" x2="21" y2="3"></line>
                            <line x1="3" y1="21" x2="10" y2="14"></line>
                        </svg>
                    </button>
                    <button id="prometheus-chat-close" aria-label="Close chat">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M18 6L6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div id="prometheus-chat-messages">
                <div class="prometheus-hero-logo">
                    <div class="prometheus-hero-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 16v-4"></path>
                            <path d="M12 8h.01"></path>
                        </svg>
                    </div>
                    <span>Prometheus Agent</span>
                    <p class="prometheus-hero-desc">Ask questions or upload documents for analysis</p>
                </div>
            </div>

            <div id="prometheus-file-preview" class="hidden">
                <div id="prometheus-file-list"></div>
            </div>

            <form id="prometheus-chat-form">
                <div class="prometheus-input-container">
                    <input
                        type="file"
                        id="prometheus-file-input"
                        accept=".pdf,.doc,.docx,.txt"
                        multiple
                        hidden
                    />
                    <button type="button" id="prometheus-attach-btn" aria-label="Attach file">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                    </button>
                    <textarea
                        id="prometheus-chat-input"
                        placeholder="Ask about Azure AI Foundry agents..."
                        autocomplete="off"
                        rows="1"
                    ></textarea>
                    <button type="submit" id="prometheus-chat-submit">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
                <div class="prometheus-file-hint">Supports PDF, Word, and text files (max 10MB)</div>
            </form>
        </div>
    </div>

    <style>
        /* Prometheus Chat Widget Styles */
        #prometheus-chat-widget {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #prometheus-chat-widget.hidden {
            display: none;
        }

        #prometheus-chat-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }

        #prometheus-chat-modal {
            position: relative;
            width: min(600px, calc(100vw - 40px));
            height: min(700px, calc(100vh - 80px));
            background: linear-gradient(180deg, #0a1628 0%, #0f2847 100%);
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6), 0 0 120px rgba(6, 182, 212, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        #prometheus-chat-modal.fullscreen {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            border-radius: 0;
            border: none;
        }

        .prometheus-chat-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.15) 0%, rgba(20, 184, 166, 0.15) 100%);
            border-bottom: 1px solid rgba(6, 182, 212, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .prometheus-chat-header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .prometheus-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #06b6d4 0%, #14b8a6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .prometheus-title {
            display: block;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .prometheus-subtitle {
            display: block;
            color: rgba(6, 182, 212, 0.8);
            font-size: 12px;
        }

        .prometheus-chat-header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .prometheus-chat-header button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .prometheus-chat-header button:hover {
            background: rgba(6, 182, 212, 0.3);
            color: white;
        }

        .prometheus-chat-header button.hidden {
            display: none;
        }

        #prometheus-chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .prometheus-hero-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            gap: 16px;
            text-align: center;
        }

        .prometheus-hero-icon {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2) 0%, rgba(20, 184, 166, 0.2) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #06b6d4;
            border: 2px solid rgba(6, 182, 212, 0.3);
            box-shadow: 0 8px 32px rgba(6, 182, 212, 0.2);
        }

        .prometheus-hero-logo span {
            font-size: 22px;
            font-weight: 600;
            color: white;
        }

        .prometheus-hero-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin: 0;
        }

        .prometheus-chat-message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .prometheus-chat-message.user {
            align-self: flex-end;
        }

        .prometheus-chat-message.assistant {
            align-self: flex-start;
        }

        .prometheus-chat-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 14px;
        }

        .prometheus-chat-message.user .prometheus-chat-bubble {
            background: linear-gradient(135deg, #06b6d4 0%, #14b8a6 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .prometheus-chat-message.assistant .prometheus-chat-bubble {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.9);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }

        /* File preview area */
        #prometheus-file-preview {
            padding: 12px 20px;
            background: rgba(6, 182, 212, 0.1);
            border-top: 1px solid rgba(6, 182, 212, 0.2);
        }

        #prometheus-file-preview.hidden {
            display: none;
        }

        #prometheus-file-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .prometheus-file-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(6, 182, 212, 0.2);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            color: #06b6d4;
        }

        .prometheus-file-chip button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .prometheus-file-chip button:hover {
            color: #ef4444;
        }

        #prometheus-chat-form {
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(6, 182, 212, 0.2);
        }

        .prometheus-input-container {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 16px;
            padding: 8px 12px;
            transition: all 0.2s ease;
        }

        .prometheus-input-container:focus-within {
            border-color: #06b6d4;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }

        #prometheus-attach-btn {
            background: none;
            border: none;
            color: rgba(6, 182, 212, 0.7);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        #prometheus-attach-btn:hover {
            background: rgba(6, 182, 212, 0.2);
            color: #06b6d4;
        }

        #prometheus-chat-input {
            flex: 1;
            border: none;
            background: transparent;
            color: white;
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 24px;
            max-height: 120px;
            line-height: 1.5;
        }

        #prometheus-chat-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #prometheus-chat-submit {
            background: linear-gradient(135deg, #06b6d4 0%, #14b8a6 100%);
            border: none;
            color: white;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        #prometheus-chat-submit:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.4);
        }

        #prometheus-chat-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .prometheus-file-hint {
            margin-top: 8px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        /* Typing indicator */
        .prometheus-chat-typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .prometheus-chat-typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #06b6d4;
            animation: prometheus-typing 1.4s infinite ease-in-out;
        }

        .prometheus-chat-typing span:nth-child(1) { animation-delay: 0s; }
        .prometheus-chat-typing span:nth-child(2) { animation-delay: 0.2s; }
        .prometheus-chat-typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes prometheus-typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Markdown formatting for messages */
        .prometheus-chat-bubble p {
            margin: 0 0 8px 0;
        }

        .prometheus-chat-bubble p:last-child {
            margin-bottom: 0;
        }

        .prometheus-chat-bubble ul,
        .prometheus-chat-bubble ol {
            margin: 8px 0;
            padding-left: 20px;
        }

        .prometheus-chat-bubble li {
            margin: 4px 0;
        }

        .prometheus-chat-bubble code {
            background: rgba(6, 182, 212, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }

        .prometheus-chat-bubble strong {
            color: #06b6d4;
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            #prometheus-chat-modal {
                width: 100%;
                height: 100%;
                border-radius: 0;
                border: none;
            }

            .prometheus-chat-header {
                padding-top: max(16px, env(safe-area-inset-top));
            }

            #prometheus-chat-form {
                padding-bottom: max(16px, env(safe-area-inset-bottom));
            }
        }
    </style>

    <script>
        (function() {
            const widget = document.getElementById('prometheus-chat-widget');
            if (!widget) return;

            const overlay = document.getElementById('prometheus-chat-overlay');
            const modal = document.getElementById('prometheus-chat-modal');
            const closeButton = document.getElementById('prometheus-chat-close');
            const expandButton = document.getElementById('prometheus-chat-expand');
            const collapseButton = document.getElementById('prometheus-chat-collapse');
            const messagesEl = document.getElementById('prometheus-chat-messages');
            const form = document.getElementById('prometheus-chat-form');
            const input = document.getElementById('prometheus-chat-input');
            const submitButton = document.getElementById('prometheus-chat-submit');
            const attachButton = document.getElementById('prometheus-attach-btn');
            const fileInput = document.getElementById('prometheus-file-input');
            const filePreview = document.getElementById('prometheus-file-preview');
            const fileList = document.getElementById('prometheus-file-list');

            let isSending = false;
            let threadId = null;
            let isFullscreen = false;
            let selectedFiles = [];

            const resizeInput = () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 120) + 'px';
            };

            input.addEventListener('input', resizeInput);
            input.addEventListener('focus', resizeInput);

            // Markdown parser
            function parseMarkdown(text) {
                if (!text) return '';

                let html = text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');

                const lines = html.split('\n');
                let result = [];
                let inList = false;
                let listType = null;

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i];
                    const bulletMatch = line.match(/^(\s*)[*-]\s+(.+)$/);
                    const numberMatch = line.match(/^(\s*)\d+\.\s+(.+)$/);

                    if (bulletMatch) {
                        if (!inList || listType !== 'ul') {
                            if (inList) result.push(listType === 'ul' ? '</ul>' : '</ol>');
                            result.push('<ul>');
                            inList = true;
                            listType = 'ul';
                        }
                        result.push('<li>' + formatInline(bulletMatch[2]) + '</li>');
                    } else if (numberMatch) {
                        if (!inList || listType !== 'ol') {
                            if (inList) result.push(listType === 'ul' ? '</ul>' : '</ol>');
                            result.push('<ol>');
                            inList = true;
                            listType = 'ol';
                        }
                        result.push('<li>' + formatInline(numberMatch[2]) + '</li>');
                    } else {
                        if (inList) {
                            result.push(listType === 'ul' ? '</ul>' : '</ol>');
                            inList = false;
                            listType = null;
                        }
                        if (line.trim()) {
                            result.push('<p>' + formatInline(line) + '</p>');
                        }
                    }
                }

                if (inList) {
                    result.push(listType === 'ul' ? '</ul>' : '</ol>');
                }

                return result.join('');
            }

            function formatInline(text) {
                return text
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/__(.+?)__/g, '<strong>$1</strong>')
                    .replace(/(?<!\w)\*([^*]+?)\*(?!\w)/g, '<em>$1</em>')
                    .replace(/(?<!\w)_([^_]+?)_(?!\w)/g, '<em>$1</em>')
                    .replace(/`([^`]+?)`/g, '<code>$1</code>');
            }

            function appendMessage(text, role) {
                const typingEl = messagesEl.querySelector('.prometheus-chat-typing-wrapper');
                if (typingEl) typingEl.remove();

                // Hide hero on first message
                const heroEl = messagesEl.querySelector('.prometheus-hero-logo');
                if (heroEl) heroEl.style.display = 'none';

                const msg = document.createElement('div');
                msg.className = `prometheus-chat-message ${role}`;

                const bubble = document.createElement('div');
                bubble.className = 'prometheus-chat-bubble';

                if (role === 'assistant') {
                    bubble.innerHTML = parseMarkdown(text);
                } else {
                    bubble.textContent = text;
                }

                msg.appendChild(bubble);
                messagesEl.appendChild(msg);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function showTyping() {
                const wrapper = document.createElement('div');
                wrapper.className = 'prometheus-chat-message assistant prometheus-chat-typing-wrapper';

                const typing = document.createElement('div');
                typing.className = 'prometheus-chat-bubble prometheus-chat-typing';
                typing.innerHTML = '<span></span><span></span><span></span>';

                wrapper.appendChild(typing);
                messagesEl.appendChild(wrapper);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function setSendingState(sending) {
                isSending = sending;
                input.disabled = sending;
                submitButton.disabled = sending;
                attachButton.disabled = sending;
            }

            function updateFilePreview() {
                if (selectedFiles.length === 0) {
                    filePreview.classList.add('hidden');
                    fileList.innerHTML = '';
                    return;
                }

                filePreview.classList.remove('hidden');
                fileList.innerHTML = selectedFiles.map((file, idx) => `
                    <div class="prometheus-file-chip" data-idx="${idx}">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        <span>${file.name}</span>
                        <button type="button" onclick="window.removePrometheusFile(${idx})" aria-label="Remove file">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 6L6 18M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                `).join('');
            }

            window.removePrometheusFile = function(idx) {
                selectedFiles.splice(idx, 1);
                updateFilePreview();
            };

            attachButton.addEventListener('click', () => {
                fileInput.click();
            });

            fileInput.addEventListener('change', (e) => {
                const newFiles = Array.from(e.target.files);
                selectedFiles = [...selectedFiles, ...newFiles].slice(0, 5); // Max 5 files
                updateFilePreview();
                fileInput.value = '';
            });

            // Open chat function (called from TechSpec)
            window.openPrometheusChat = function() {
                widget.classList.remove('hidden');
                input.focus();
                if (!messagesEl.querySelector('.prometheus-chat-message')) {
                    const heroEl = messagesEl.querySelector('.prometheus-hero-logo');
                    if (heroEl) heroEl.style.display = 'flex';
                }
            };

            // Close handlers
            closeButton.addEventListener('click', () => {
                widget.classList.add('hidden');
                if (isFullscreen) {
                    modal.classList.remove('fullscreen');
                    expandButton.classList.remove('hidden');
                    collapseButton.classList.add('hidden');
                    isFullscreen = false;
                }
            });

            overlay.addEventListener('click', () => {
                widget.classList.add('hidden');
                if (isFullscreen) {
                    modal.classList.remove('fullscreen');
                    expandButton.classList.remove('hidden');
                    collapseButton.classList.add('hidden');
                    isFullscreen = false;
                }
            });

            // Fullscreen handlers
            expandButton.addEventListener('click', () => {
                modal.classList.add('fullscreen');
                expandButton.classList.add('hidden');
                collapseButton.classList.remove('hidden');
                isFullscreen = true;
            });

            collapseButton.addEventListener('click', () => {
                modal.classList.remove('fullscreen');
                expandButton.classList.remove('hidden');
                collapseButton.classList.add('hidden');
                isFullscreen = false;
            });

            // Escape key handler
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !widget.classList.contains('hidden')) {
                    if (isFullscreen) {
                        modal.classList.remove('fullscreen');
                        expandButton.classList.remove('hidden');
                        collapseButton.classList.add('hidden');
                        isFullscreen = false;
                    } else {
                        widget.classList.add('hidden');
                    }
                }
            });

            // Form submission
            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (isSending) return;

                const text = input.value.trim();
                if (!text && selectedFiles.length === 0) return;

                // Show user message
                let userMessage = text;
                if (selectedFiles.length > 0) {
                    const fileNames = selectedFiles.map(f => f.name).join(', ');
                    userMessage = text ? `${text}\n\n[Attached: ${fileNames}]` : `[Attached: ${fileNames}]`;
                }
                appendMessage(userMessage, 'user');

                input.value = '';
                resizeInput();
                setSendingState(true);
                showTyping();

                try {
                    // Build FormData for file upload
                    const formData = new FormData();
                    formData.append('input', text);
                    if (threadId) {
                        formData.append('threadId', threadId);
                    }
                    selectedFiles.forEach(file => {
                        formData.append('files', file);
                    });

                    // Clear files after sending
                    selectedFiles = [];
                    updateFilePreview();

                    const response = await fetch('/api/prometheus-chat', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (data.threadId) {
                        threadId = data.threadId;
                    }

                    appendMessage(data.reply || '(no reply)', 'assistant');
                } catch (err) {
                    console.error('Prometheus chat error:', err);
                    appendMessage('Sorry, I had trouble connecting. Please try again.', 'assistant');
                } finally {
                    setSendingState(false);
                    input.focus();
                    resizeInput();
                }
            });
        })();
    </script>
</body>
