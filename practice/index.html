<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Enterprise Agent Governance Framework | Interactive Model</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            overflow-x: hidden;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(51, 65, 85, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            background: rgba(51, 65, 85, 0.8);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        .active-layer {
            border-color: #6366f1; /* Indigo 500 */
            background: rgba(49, 46, 129, 0.6);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        /* Dynamic Layer Color Classes */
        .active-layer-sky {
            border-color: #38bdf8 !important;
            background: rgba(12, 74, 110, 0.6) !important;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3) !important;
        }
        .active-layer-emerald {
            border-color: #34d399 !important;
            background: rgba(6, 78, 59, 0.6) !important;
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.3) !important;
        }
        .active-layer-indigo {
            border-color: #818cf8 !important;
            background: rgba(49, 46, 129, 0.6) !important;
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.3) !important;
        }

        /* Layer-themed detail panel backgrounds */
        .level-bg-sky {
            background: linear-gradient(135deg, rgba(12, 74, 110, 0.15) 0%, rgba(15, 23, 42, 0) 50%);
        }
        .level-bg-emerald {
            background: linear-gradient(135deg, rgba(6, 78, 59, 0.15) 0%, rgba(15, 23, 42, 0) 50%);
        }
        .level-bg-indigo {
            background: linear-gradient(135deg, rgba(49, 46, 129, 0.15) 0%, rgba(15, 23, 42, 0) 50%);
        }

        /* Pillar icon colors in bullets */
        .pillar-icon-guardrails { color: #f97316; } /* orange */
        .pillar-icon-grounding { color: #22c55e; } /* green */
        .pillar-icon-confidence { color: #a855f7; } /* purple */
        .pillar-icon-observability { color: #06b6d4; } /* cyan */
        .pillar-icon-evaluation { color: #f59e0b; } /* amber */
        .active-pillar {
            border-bottom: 2px solid #38bdf8; /* Sky 400 */
            color: #38bdf8;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        /* Splash modal fade-in animation */
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Mobile-First Responsive Styles */

        /* Touch-friendly minimum sizes */
        .touch-target {
            min-height: 44px;
            min-width: 44px;
        }

        /* Mobile drawer styles */
        .mobile-drawer {
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }
        .mobile-drawer.open {
            transform: translateX(0);
        }
        .drawer-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
        }
        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* Mobile typography scaling */
        @media (max-width: 640px) {
            html {
                font-size: 14px;
            }
            .mobile-title {
                font-size: 1.125rem !important;
                line-height: 1.3 !important;
            }
            .mobile-subtitle {
                font-size: 0.75rem !important;
            }
            .mobile-text-sm {
                font-size: 0.8125rem !important;
            }
        }

        /* Improved scrollbar for mobile */
        @media (max-width: 768px) {
            ::-webkit-scrollbar {
                width: 4px;
            }
            .glass-card:hover {
                transform: none;
            }
        }

        /* Safe area insets for notched devices */
        @supports (padding: max(0px)) {
            .safe-area-top {
                padding-top: max(env(safe-area-inset-top), 0.5rem);
            }
            .safe-area-bottom {
                padding-bottom: max(env(safe-area-inset-bottom), 0.5rem);
            }
        }

        /* Hamburger menu animation */
        .hamburger-line {
            transition: all 0.3s ease;
        }
        .hamburger-open .hamburger-line:first-child {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger-open .hamburger-line:nth-child(2) {
            opacity: 0;
        }
        .hamburger-open .hamburger-line:last-child {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* Mobile Floating Pill Bar - positioned bottom right, expands left */
        .pillar-pill-bar {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: right center;
        }
        .pillar-pill-bar.expanded {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }
        .pillar-pill-bar.collapsed {
            transform: scale(0.8);
            opacity: 0;
            pointer-events: none;
        }
        .pillar-fab {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pillar-fab.visible {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }
        .pillar-fab.hidden {
            transform: scale(0.5);
            opacity: 0;
            pointer-events: none;
        }
        .pillar-toggle-btn {
            transition: all 0.15s ease;
        }
        .pillar-toggle-btn:active {
            transform: scale(0.9);
        }
        .pillar-toggle-btn.inactive {
            opacity: 0.35;
        }
        .pillar-toggle-btn.is-global-active {
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4);
        }

        /* Mobile Pillar Controls - positioned bottom right, same level as chat button */
        @media (max-width: 480px) {
            .pillar-pill-bar {
                bottom: 12px !important;
                right: 12px !important;
                left: auto !important;
            }
            .pillar-pill-bar .flex {
                gap: 0.25rem;
                padding: 0.375rem 0.5rem;
            }
            .pillar-pill-bar .pillar-toggle-btn {
                width: 2rem !important;
                height: 2rem !important;
            }
            .pillar-pill-bar .pillar-toggle-btn img,
            .pillar-pill-bar .pillar-toggle-btn svg {
                width: 1.75rem !important;
                height: 1.75rem !important;
            }
            .pillar-fab {
                bottom: 12px !important;
                right: 12px !important;
                left: auto !important;
            }
            .pillar-fab .touch-target {
                width: 2.75rem !important;
                height: 2.75rem !important;
            }
            .pillar-fab .touch-target img {
                width: 2.75rem !important;
                height: 2.75rem !important;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .pillar-pill-bar {
                bottom: 20px !important;
                right: 20px !important;
                left: auto !important;
            }
            .pillar-pill-bar .pillar-toggle-btn {
                width: 2.5rem !important;
                height: 2.5rem !important;
            }
            .pillar-pill-bar .pillar-toggle-btn img,
            .pillar-pill-bar .pillar-toggle-btn svg {
                width: 2.25rem !important;
                height: 2.25rem !important;
            }
            .pillar-fab {
                bottom: 20px !important;
                right: 20px !important;
                left: auto !important;
            }
        }

        /* Wiki Console Styles */
        .wiki-overlay {
            animation: wikiOverlayIn 0.3s ease-out;
        }
        .wiki-overlay.closing {
            animation: wikiOverlayOut 0.2s ease-in forwards;
        }
        @keyframes wikiOverlayIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes wikiOverlayOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .wiki-panel {
            animation: wikiPanelIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .wiki-panel.closing {
            animation: wikiPanelOut 0.25s ease-in forwards;
        }
        @keyframes wikiPanelIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        @keyframes wikiPanelOut {
            from {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            to {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
        }
        .wiki-sidebar {
            scrollbar-width: thin;
            scrollbar-color: #475569 transparent;
        }
        .wiki-content {
            scrollbar-width: thin;
            scrollbar-color: #475569 #1e293b;
        }
        .wiki-nav-item {
            transition: all 0.15s ease;
        }
        .wiki-nav-item:hover {
            background: rgba(99, 102, 241, 0.1);
        }
        .wiki-nav-item.active {
            background: rgba(99, 102, 241, 0.2);
            border-left: 3px solid #6366f1;
        }
        .wiki-section-card {
            transition: all 0.2s ease;
        }
        .wiki-section-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px -10px rgba(0, 0, 0, 0.4);
        }
        .wiki-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .wiki-table {
            border-collapse: separate;
            border-spacing: 0;
        }
        .wiki-table th {
            background: rgba(51, 65, 85, 0.5);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.05em;
        }
        .wiki-table td, .wiki-table th {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(71, 85, 105, 0.5);
        }
        .wiki-table tr:last-child td {
            border-bottom: none;
        }
        .wiki-code-block {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            line-height: 1.6;
            overflow-x: auto;
        }
        .wiki-accordion {
            transition: all 0.25s ease;
        }
        .wiki-accordion-content {  
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .wiki-accordion-content.open {
            max-height: 2000px;
        }
        .logo-clickable {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .logo-clickable:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }
        .logo-clickable:active {
            transform: scale(0.98);
        }

        /* Knowledge Center mobile tweaks */
        @media (max-width: 768px) {
            .wiki-overlay {
                padding: 0.5rem;
            }
            .wiki-panel {
                width: 100% !important;
                max-width: none !important;
                height: calc(100vh - 1rem);
                max-height: none;
                margin: 0;
                border-radius: 1rem;
            }
            .wiki-content {
                padding: 1rem !important;
                flex: 1 1 0%;
                min-height: 0;
                overflow-y: auto;
            }
            .wiki-mobile-nav {
                flex-wrap: wrap;
                padding: 0.75rem;
                gap: 0.5rem;
                flex-shrink: 0;
                overflow-x: auto;
            }
            .wiki-mobile-nav button {
                flex: 1 1 calc(50% - 0.5rem);
                min-width: 80px;
                justify-content: center;
                white-space: nowrap;
            }
        }

        @media (max-width: 480px) {
            .wiki-overlay {
                padding: 0.25rem;
            }
            .wiki-panel {
                height: calc(100vh - 0.5rem);
                border-radius: 0.75rem;
            }
            .wiki-content {
                padding: 0.75rem !important;
            }
            .wiki-mobile-nav {
                padding: 0.5rem;
                gap: 0.25rem;
            }
            .wiki-mobile-nav button {
                flex: 1 1 calc(25% - 0.25rem);
                min-width: 50px;
                font-size: 9px;
                padding: 0.25rem 0.375rem;
            }
        }

        @media (max-width: 360px) {
            .wiki-mobile-nav button {
                flex: 1 1 calc(33.33% - 0.25rem);
                min-width: 45px;
                font-size: 8px;
                padding: 0.25rem 0.25rem;
            }
        }

        /* Mobile content responsiveness */
        @media (max-width: 768px) {
            .wiki-table {
                display: block;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .wiki-table th,
            .wiki-table td {
                padding: 8px 10px;
                font-size: 11px;
            }
            .wiki-code-block {
                font-size: 10px;
                padding: 12px;
            }
            .wiki-section-card {
                padding: 1rem !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Global page context for chat - updated by React component
        window.pageContext = {
            contextSource: 'governance_framework',
            uiContext: 'Governance Framework - Executive Summary',
            section: 'overview',
            showingWiki: false
        };

        // --- Inline Icon System to prevent Runtime Errors ---
        // Replacing external Lucide library with reliable React Components
        
        const IconBase = ({ children, className, size = 24, color = "currentColor", ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke={color} 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
                {...props}
            >
                {children}
            </svg>
        );

        const Icons = {
            Shield: (props) => <IconBase {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></IconBase>,
            Layers: (props) => <IconBase {...props}><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></IconBase>,
            Database: (props) => <IconBase {...props}><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" /><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" /></IconBase>,
            Bot: (props) => <IconBase {...props}><rect x="3" y="11" width="18" height="10" rx="2" /><circle cx="12" cy="5" r="2" /><path d="M12 7v4" /><line x1="8" y1="16" x2="8" y2="16" /><line x1="16" y1="16" x2="16" y2="16" /></IconBase>,
            Activity: (props) => <IconBase {...props}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></IconBase>,
            Eye: (props) => <IconBase {...props}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></IconBase>,
            Lock: (props) => <IconBase {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></IconBase>,
            FileText: (props) => <IconBase {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></IconBase>,
            CheckCircle: (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></IconBase>,
            AlertTriangle: (props) => <IconBase {...props}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></IconBase>,
            Server: (props) => <IconBase {...props}><rect x="2" y="2" width="20" height="8" rx="2" ry="2" /><rect x="2" y="14" width="20" height="8" rx="2" ry="2" /><line x1="6" y1="6" x2="6.01" y2="6" /><line x1="6" y1="18" x2="6.01" y2="18" /></IconBase>,
            PauseCircle: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10" /><rect x="9" y="9" width="2" height="6" rx="0.5" /><rect x="13" y="9" width="2" height="6" rx="0.5" /></IconBase>,
            Globe: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10" /><line x1="2" y1="12" x2="22" y2="12" /><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /></IconBase>,
            Cpu: (props) => <IconBase {...props}><rect x="4" y="4" width="16" height="16" rx="2" ry="2" /><rect x="9" y="9" width="6" height="6" /><line x1="9" y1="1" x2="9" y2="4" /><line x1="15" y1="1" x2="15" y2="4" /><line x1="9" y1="20" x2="9" y2="23" /><line x1="15" y1="20" x2="15" y2="23" /><line x1="20" y1="9" x2="23" y2="9" /><line x1="20" y1="14" x2="23" y2="14" /><line x1="1" y1="9" x2="4" y2="9" /><line x1="1" y1="14" x2="4" y2="14" /></IconBase>,
            Users: (props) => <IconBase {...props}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></IconBase>,

            ArrowDownRight: (props) => <IconBase {...props}><line x1="7" y1="7" x2="17" y2="17" /><polyline points="17 7 17 17 7 17" /></IconBase>,
            Play: (props) => <IconBase {...props}><polygon points="5 3 19 12 5 21 5 3" /></IconBase>,
            SkipForward: (props) => <IconBase {...props}><polygon points="5 4 15 12 5 20 5 4" /><line x1="19" y1="5" x2="19" y2="19" /></IconBase>,
            RefreshCw: (props) => <IconBase {...props}><polyline points="23 4 23 10 17 10" /><polyline points="1 20 1 14 7 14" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></IconBase>,
            Terminal: (props) => <IconBase {...props}><polyline points="4 17 10 11 4 5" /><line x1="12" y1="19" x2="20" y2="19" /></IconBase>,
            ShieldCheck: (props) => <IconBase {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><path d="m9 12 2 2 4-4" /></IconBase>,
            Search: (props) => <IconBase {...props}><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></IconBase>,
            Scale: (props) => <IconBase {...props}><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1z" /><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1z" /><path d="M7 21h10" /><path d="M12 3v18" /><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" /></IconBase>,
            Menu: (props) => <IconBase {...props}><line x1="4" y1="6" x2="20" y2="6" /><line x1="4" y1="12" x2="20" y2="12" /><line x1="4" y1="18" x2="20" y2="18" /></IconBase>,
            X: (props) => <IconBase {...props}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></IconBase>,
            ChevronRight: (props) => <IconBase {...props}><polyline points="9 18 15 12 9 6" /></IconBase>,

                }
            }, []);

            // Sync page context to global for chat widget
            useEffect(() => {
                const sectionLabels = {
                    'overview': 'Executive Summary',
                    'pillars': 'Five Governance Pillars',
                    'architecture': 'Three-Layer Architecture',
                    'tech-entra': 'Microsoft Entra ID',
                    'tech-purview': 'Microsoft Purview',
                    'tech-azure': 'Azure Infrastructure',
                    'tech-power': 'Power Platform',
                    'tech-copilot': 'Copilot Studio',
                    'tech-foundry': 'Azure AI Foundry',
                    'ai-services': 'AI Services',
                    'matrix': 'Control Matrix',
                    'implementation': 'Implementation Guide',
                    'scenarios': 'Security Scenarios'
                };

                window.pageContext = {
                    contextSource: 'governance_framework',
                    uiContext: showWiki
                        ? `Governance Framework - ${sectionLabels[wikiSection] || wikiSection}`
                        : 'Governance Framework - Interactive Demo',
                    section: wikiSection,
                    showingWiki: showWiki
                };
            }, [wikiSection, showWiki]);

            const [expandedAccordions, setExpandedAccordions] = useState(new Set(['pillar-guardrails']));

            const currentScenario = scenariosData[selectedScenario];
            const simulationSteps = currentScenario.steps;

            const closeWiki = () => {
                if (isStandaloneKB) {
                    // Redirect to main app when closing standalone KB
                    window.location.href = '/';
                    return;
                }
                setWikiClosing(true);
                setTimeout(() => {
                    setShowWiki(false);
                    setWikiClosing(false);
                }, 250);
            };

            const toggleAccordion = (id) => {
                setExpandedAccordions(prev => {
                    const newSet = new Set(prev);
                    if (newSet.has(id)) {
                        newSet.delete(id);
                    } else {
                        newSet.add(id);
                    }
                    return newSet;
                });
            };

            useEffect(() => {
                if (!mobilePillBarExpanded) {
                    setShowPillarLegend(false);
                }
            }, [mobilePillBarExpanded]);

            // ESC key to close wiki (only in modal mode, not standalone)
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && showWiki && !isStandaloneKB) {
                        closeWiki();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [showWiki, isStandaloneKB]);

            const handleLayerSelect = (layerId, { openDetails = false } = {}) => {
                setActiveLayer(layerId);
                if (openDetails) {
                    setMobileView('details');
                }
            };

            // Simulation Logic
            useEffect(() => {
                let timer;
                if (simMode && isPlaying && simStep < simulationSteps.length) {
                    timer = setTimeout(() => {
                        setSimStep(prev => Math.min(prev + 1, simulationSteps.length));
                    }, 10000); // Step every 10 seconds
                }
                return () => clearTimeout(timer);
            }, [simMode, simStep, isPlaying]);

            useEffect(() => {
                if (simStep >= simulationSteps.length) {
                    setIsPlaying(false);
                }
            }, [simStep]);

            const startSimulation = () => {
                setShowScenarioSelector(true);
            };

            const selectScenarioAndStart = (scenarioId) => {
                setSelectedScenario(scenarioId);
                setShowScenarioSelector(false);
                setSimMode(true);
                setSimStep(0);
                setActiveLayer(null);
                setIsPlaying(true);
            };

            const resetView = () => {
                setSimMode(false);
                setSimStep(0);
                setActiveLayer('agent');
                setIsPlaying(false);
                setShowScenarioSelector(false);
            };

            const togglePlayPause = () => {
                if (!simMode) return;
                if (simStep >= simulationSteps.length) {
                    setSimStep(0);
                }
                setIsPlaying(prev => !prev);
            };

            const nextStep = () => {
                if (!simMode) return;
                setSimStep(prev => Math.min(prev + 1, simulationSteps.length));
            };

            const goToStep = (index) => {
                if (!simMode) return;
                const targetStep = Math.max(0, Math.min(index, simulationSteps.length - 1));
                setIsPlaying(false);
                setSimStep(targetStep);
            };

            const currentLayerData = layersData.find(l => l.id === activeLayer);

            // Helper to get scenario icon component
            const getScenarioIcon = (iconName, className = "w-6 h-6") => {
                const iconMap = {
                    Users: <Users className={className} />,
                    AlertTriangle: <AlertTriangle className={className} />,
                    Terminal: <Terminal className={className} />
                };
                return iconMap[iconName] || <Shield className={className} />;
            };

            return (
                <div className="min-h-screen bg-slate-900 flex flex-col overflow-hidden relative">
                    {/* Background Grid FX */}
                    <div className="absolute inset-0 z-0 opacity-20 pointer-events-none"
                         style={{
                             backgroundImage: 'radial-gradient(#475569 1px, transparent 1px)',
                             backgroundSize: '24px 24px'
                         }}>
                    </div>

                    {/* Welcome Splash Modal */}
                    {showSplash && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                            <div className="w-full max-w-3xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden animate-fadeIn">
                                {/* Header with gradient */}
                                <div className="relative p-6 pb-4 border-b border-slate-700 bg-gradient-to-r from-indigo-900/40 via-purple-900/30 to-sky-900/40">
                                    <div className="flex items-start justify-between">
                                        <div className="flex items-center gap-4">
                                            <img src="g_logo.png" alt="D3 Logo" className="w-12 h-12" />
                                            <div>
                                                <h1 className="text-2xl font-bold text-white">Welcome to the Data<sup>#</sup>3<br />Enterprise Agent Governance Framework</h1>
                                                <p className="text-slate-400 mt-1">Your guide to navigating the Agentic AI landscape</p>
                                            </div>
                                        </div>
                                        <button
                                            onClick={closeSplash}
                                            className="w-10 h-10 flex items-center justify-center rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
                                        >
                                            <X className="w-5 h-5" />
                                        </button>
                                    </div>
                                </div>

                                {/* Content */}
                                <div className="p-6 max-h-[65vh] overflow-y-auto">
                                    {/* Introduction */}
                                    <div className="mb-6 p-4 rounded-xl bg-slate-800/50 border border-slate-700/50">
                                        <p className="text-slate-300 leading-relaxed">
                                            As AI agents become more autonomous, governing them effectively is critical.
                                            This interactive framework helps you understand and implement <span className="text-indigo-400 font-semibold">comprehensive governance controls</span> across
                                            your entire AI ecosystem.
                                        </p>
                                    </div>

                                    {/* Feature Grid */}
                                    <div className="grid md:grid-cols-2 gap-4 mb-6">
                                        {/* Three Layers */}
                                        <div className="p-4 rounded-xl bg-slate-800/30 border border-slate-700/50 hover:border-slate-600 transition-colors">
                                            <div className="flex items-center gap-3 mb-3">
                                                <img src="3l_logo.png" alt="Layers" className="w-10 h-10" />
                                                <h3 className="font-bold text-white">Three Governance Layers</h3>
                                            </div>
                                            <p className="text-sm text-slate-400 mb-3">
                                                Explore controls organized across three architectural layers:
                                            </p>
                                            <div className="space-y-2">
                                                <div className="flex items-center gap-2 text-sm">
                                                    <span className="w-2 h-2 rounded-full bg-sky-400"></span>
                                                    <span className="text-sky-400 font-medium">Agent Layer</span>
                                                    <span className="text-slate-500">- The "Brain"</span>
                                                </div>
                                                <div className="flex items-center gap-2 text-sm">
                                                    <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                                                    <span className="text-emerald-400 font-medium">Data Layer</span>
                                                    <span className="text-slate-500">- The "Physics"</span>
                                                </div>
                                                <div className="flex items-center gap-2 text-sm">
                                                    <span className="w-2 h-2 rounded-full bg-indigo-400"></span>
                                                    <span className="text-indigo-400 font-medium">Platform Layer</span>
                                                    <span className="text-slate-500">- The "Shell"</span>
                                                </div>
                                            </div>
                                            <p className="text-xs text-slate-500 mt-3 italic">
                                                Click any layer in the left panel to explore its controls
                                            </p>
                                        </div>

                                        {/* Five Pillars */}
                                        <div className="p-4 rounded-xl bg-slate-800/30 border border-slate-700/50 hover:border-slate-600 transition-colors">
                                            <div className="flex items-center gap-3 mb-3">
                                                <img src="5p_logo.png" alt="Pillars" className="w-10 h-10" />
                                                <h3 className="font-bold text-white">Five Governance Pillars</h3>
                                            </div>
                                            <p className="text-sm text-slate-400 mb-3">
                                                Toggle pillars on/off to filter controls by category:
                                            </p>
                                            <div className="flex flex-wrap gap-2">
                                                <span className="px-2 py-1 text-xs rounded-full bg-orange-500/20 text-orange-400 border border-orange-500/30">Guardrails</span>
                                                <span className="px-2 py-1 text-xs rounded-full bg-green-500/20 text-green-400 border border-green-500/30">Grounding</span>
                                                <span className="px-2 py-1 text-xs rounded-full bg-purple-500/20 text-purple-400 border border-purple-500/30">Confidence</span>
                                                <span className="px-2 py-1 text-xs rounded-full bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">Observability</span>
                                                <span className="px-2 py-1 text-xs rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">Evaluation</span>
                                            </div>
                                            <p className="text-xs text-slate-500 mt-3 italic">
                                                Use the pillar bar at the bottom to filter your view
                                            </p>
                                        </div>

                                        {/* Knowledge Base */}
                                        <div className="p-4 rounded-xl bg-slate-800/30 border border-slate-700/50 hover:border-slate-600 transition-colors">
                                            <div className="flex items-center gap-3 mb-3">
                                                <img src="kb.png" alt="Knowledge Base" className="w-10 h-10" />
                                                <h3 className="font-bold text-white">Knowledge Base</h3>
                                            </div>
                                            <p className="text-sm text-slate-400">
                                                Access comprehensive documentation on each pillar, layer architecture,
                                                technical specifications, and implementation guidance.
                                            </p>
                                            <p className="text-xs text-slate-500 mt-3 italic">
                                                Click the "KB" button in the header to open
                                            </p>
                                        </div>

                                        {/* Simulations */}
                                        <div className="p-4 rounded-xl bg-slate-800/30 border border-slate-700/50 hover:border-slate-600 transition-colors">
                                            <div className="flex items-center gap-3 mb-3">
                                                <img src="play.png" alt="Simulations" className="w-10 h-10" />
                                                <h3 className="font-bold text-white">Threat Simulations</h3>
                                            </div>
                                            <p className="text-sm text-slate-400">
                                                Run interactive scenarios to see how governance controls respond to
                                                real-world threats like rogue bots, data exfiltration, and shadow IT.
                                            </p>
                                            <p className="text-xs text-slate-500 mt-3 italic">
                                                Click "Run Simulation" to start a scenario
                                            </p>
                                        </div>
                                    </div>

                                </div>

                                {/* Footer */}
                                <div className="p-4 border-t border-slate-700 bg-slate-800/30 flex items-center justify-between">
                                    <label className="flex items-center gap-2 cursor-pointer group">
                                        <input
                                            type="checkbox"
                                            checked={dontShowAgain}
                                            onChange={(e) => setDontShowAgain(e.target.checked)}
                                            className="w-4 h-4 rounded border-slate-600 bg-slate-700 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-slate-900"
                                        />
                                        <span className="text-sm text-slate-400 group-hover:text-slate-300 transition-colors">
                                            Don't show this again
                                        </span>
                                    </label>
                                    <button
                                        onClick={closeSplash}
                                        className="px-6 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition-colors flex items-center gap-2"
                                    >
                                        Let's go!
                                        <ArrowRight className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Scenario Selector Modal */}
                    {showScenarioSelector && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
                            <div className="w-full max-w-2xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
                                <div className="p-6 border-b border-slate-700">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <h2 className="text-xl font-bold text-white">Select Simulation Scenario</h2>
                                            <p className="text-sm text-slate-400 mt-1">Choose a threat scenario to observe the governance framework in action</p>
                                        </div>
                                        <button
                                            onClick={() => setShowScenarioSelector(false)}
                                            className="w-10 h-10 flex items-center justify-center rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
                                        >
                                            <X className="w-5 h-5" />
                                        </button>
                                    </div>
                                </div>
                                <div className="p-4 space-y-3 max-h-[60vh] overflow-y-auto">
                                    {scenariosList.map((scenario) => (
                                        <button
                                            key={scenario.id}
                                            onClick={() => selectScenarioAndStart(scenario.id)}
                                            className={`w-full p-4 rounded-xl border text-left transition-all hover:scale-[1.01] ${
                                                scenario.color === 'amber' ? 'border-amber-500/30 hover:border-amber-500/60 hover:bg-amber-900/20' :
                                                scenario.color === 'red' ? 'border-red-500/30 hover:border-red-500/60 hover:bg-red-900/20' :
                                                'border-purple-500/30 hover:border-purple-500/60 hover:bg-purple-900/20'
                                            } bg-slate-800/50`}
                                        >
                                            <div className="flex items-start gap-4">
                                                <div className={`p-3 rounded-lg ${
                                                    scenario.color === 'amber' ? 'bg-amber-900/30 text-amber-400' :
                                                    scenario.color === 'red' ? 'bg-red-900/30 text-red-400' :
                                                    'bg-purple-900/30 text-purple-400'
                                                }`}>
                                                    {getScenarioIcon(scenario.icon)}
                                                </div>
                                                <div className="flex-1">
                                                    <h3 className="font-bold text-white text-lg">{scenario.title}</h3>
                                                    <p className="text-sm text-slate-400 mt-1 leading-relaxed">{scenario.description}</p>
                                                    <div className="flex items-center gap-2 mt-3">
                                                        <span className="text-xs text-slate-500">{scenario.steps.length} steps</span>
                                                        <span className="text-slate-600">•</span>
                                                        <span className={`text-xs ${
                                                            scenario.color === 'amber' ? 'text-amber-400' :
                                                            scenario.color === 'red' ? 'text-red-400' :
                                                            'text-purple-400'
                                                        }`}>Click to run</span>
                                                    </div>
                                                </div>
                                                <ChevronRight className="w-5 h-5 text-slate-500" />
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="z-10 px-4 py-3 sm:p-4 md:p-6 border-b border-slate-700 bg-slate-900/90 backdrop-blur safe-area-top">
                        <div className="flex justify-between items-center" id="simulations">
                            {/* Logo & Title */}
                            <div className="flex items-center gap-2 sm:gap-3 min-w-0 flex-1">
                                <img
                                    src="g_logo.png"
                                    alt="Governance Framework Logo"
                                    className="w-8 h-8 sm:w-10 sm:h-10 object-contain flex-shrink-0"
                                />
                                <div className="min-w-0">
                                    <h1 className="text-base sm:text-lg md:text-2xl font-bold tracking-tight text-white truncate mobile-title">
                                        <span className="hidden sm:inline">Enterprise Agent </span>
                                        <span className="sm:hidden">Agent </span>
                                        <span className="text-indigo-400">Governance</span>
                                        <span className="hidden md:inline text-indigo-400"> Framework</span>
                                    </h1>
                                    <p className="text-slate-400 text-xs sm:text-sm mt-0.5 font-mono hidden sm:block mobile-subtitle">
                                        One Model &bull; Three Layers &bull; Five Pillars
                                    </p>
                                </div>
                            </div>

                            {/* Right side controls */}
                            <div className="flex items-center gap-2 sm:gap-4 flex-shrink-0">
                                {/* System Status - hidden on mobile */}
                                <div className="text-right hidden lg:block">
                                    <div className="text-xs text-slate-500 uppercase font-semibold">System Status</div>
                                    <div className="flex items-center justify-end gap-2">
                                        <span className="relative flex h-2 w-2">
                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                            <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                        </span>
                                        <span className="text-sm font-mono text-emerald-400">OPERATIONAL</span>
                                    </div>
                                </div>

                                {/* Knowledge Center Button - Desktop only */}
                                <button
                                    onClick={() => setShowWiki(true)}
                                    className="hidden lg:flex items-center justify-center w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 transition-all group relative"
                                    aria-label="Open Knowledge Center"
                                >
                                    <img src="kb.png" alt="Knowledge Center" className="w-10 h-10 object-contain" />
                                    {/* Tooltip */}
                                    <span className="absolute -bottom-10 left-1/2 -translate-x-1/2 px-2 py-1 bg-slate-800 text-white text-xs rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none border border-slate-600 z-50">
                                        Open Knowledge Center
                                    </span>
                                </button>

                                {/* Knowledge Center Button - Mobile only */}
                                <button
                                    onClick={() => setShowWiki(true)}
                                    className="lg:hidden flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 transition-all"
                                    aria-label="Open Knowledge Center"
                                >
                                    <img src="kb.png" alt="Knowledge Center" className="w-9 h-9 sm:w-10 sm:h-10 object-contain" />
                                </button>

                                {/* Simulation Button - Mobile/Tablet: icon only matching KB button, Desktop: Globe with Play icon only */}
                                <button
                                    onClick={simMode ? resetView : startSimulation}
                                    className={`flex items-center justify-center gap-1 sm:gap-2 rounded-lg font-semibold text-sm sm:text-base transition-all group relative ${simMode
                                        ? 'touch-target px-3 sm:px-4 py-2 sm:py-2.5 bg-slate-700 text-white hover:bg-slate-600 active:bg-slate-500'
                                        : 'w-9 h-9 sm:w-10 sm:h-10 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white'}`}
                                >
                                    {simMode ? (
                                        <>
                                            <RefreshCw className="w-4 h-4" />
                                            <span className="hidden sm:inline">Reset Model</span>
                                            <span className="sm:hidden">Reset</span>
                                        </>
                                    ) : (
                                        <>
                                            {/* Play icon - sized smaller than button to show bg */}
                                            <img src="play.png" alt="Run Simulation" className="w-9 h-9 sm:w-10 sm:h-10 object-contain" />
                                        </>
                                    )}
                                    {/* Tooltip - Desktop only */}
                                    {!simMode && (
                                        <span className="hidden lg:block absolute -bottom-10 left-1/2 -translate-x-1/2 px-2 py-1 bg-slate-800 text-white text-xs rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none border border-slate-600 z-50">
                                            Simulate Threat Scenarios
                                        </span>
                                    )}
                                </button>

                                {/* GTM Whiteboard Icon */}
                                <a
                                    href="gtm_strategy.html"
                                    className="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 transition-all group relative"
                                    aria-label="GTM Whiteboard"
                                >
                                    <img src="whiteboard.png" alt="GTM Whiteboard" className="w-9 h-9 sm:w-10 sm:h-10 object-contain" />
                                    <span className="hidden lg:block absolute -bottom-10 left-1/2 -translate-x-1/2 px-2 py-1 bg-slate-800 text-white text-xs rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none border border-slate-600 z-50">
                                        GTM Whiteboard
                                    </span>
                                </a>

                                {/* Services Map Icon */}
                                <a
                                    href="services_map.html"
                                    className="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 transition-all group relative"
                                    aria-label="Services Map"
                                >
                                    <svg className="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                                    </svg>
                                    <span className="hidden lg:block absolute -bottom-10 left-1/2 -translate-x-1/2 px-2 py-1 bg-slate-800 text-white text-xs rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none border border-slate-600 z-50">
                                        Services Map
                                    </span>
                                </a>

                                {/* AI Practice Plan Icon */}
                                <a
                                    href="ai_practice.html"
                                    className="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 transition-all group relative"
                                    aria-label="AI Practice Plan"
                                >
                                    <svg className="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
                                    </svg>
                                    <span className="hidden lg:block absolute -bottom-10 left-1/2 -translate-x-1/2 px-2 py-1 bg-slate-800 text-white text-xs rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none border border-slate-600 z-50">
                                        AI Practice Plan
                                    </span>
                                </a>

                            </div>
                        </div>

                        {/* Mobile status indicator */}
                        <div className="flex items-center gap-2 mt-2 lg:hidden">
                            <span className="relative flex h-2 w-2">
                                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                            </span>
                            <span className="text-xs font-mono text-emerald-400">OPERATIONAL</span>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col md:flex-row overflow-hidden z-10 min-h-0">

                        {/* Mobile Tab Navigation */}
                        {!simMode && (
                            <div className="md:hidden flex border-b border-slate-700 bg-slate-900/80">
                                <button
                                    onClick={() => setMobileView('layers')}
                                    className={`flex-1 py-3 px-4 text-sm font-medium transition-colors ${mobileView === 'layers' ? 'text-indigo-400 border-b-2 border-indigo-400 bg-slate-800/50' : 'text-slate-400'}`}
                                >
                                    <Layers className="w-4 h-4 inline-block mr-2" />
                                    Layers
                                </button>
                                <button
                                    onClick={() => setMobileView('details')}
                                    className={`flex-1 py-3 px-4 text-sm font-medium transition-colors ${mobileView === 'details' ? 'text-indigo-400 border-b-2 border-indigo-400 bg-slate-800/50' : 'text-slate-400'}`}
                                >
                                    <FileText className="w-4 h-4 inline-block mr-2" />
                                    Details
                                </button>
                            </div>
                        )}

    <script>
        (function() {
            const widget = document.getElementById('agent-chat-widget');
            if (!widget) return;

            const toggleButton = document.getElementById('agent-chat-toggle');
            const chatWindow = document.getElementById('agent-chat-window');
            const closeButton = document.getElementById('agent-chat-close');
            const expandButton = document.getElementById('agent-chat-expand');
            const collapseButton = document.getElementById('agent-chat-collapse');
            const messagesEl = document.getElementById('agent-chat-messages');
            const form = document.getElementById('agent-chat-form');
            const input = document.getElementById('agent-chat-input');
            const submitButton = document.getElementById('agent-chat-submit');

            let isSending = false;
            let threadId = null;
            let isFullscreen = false;

            const resizeInput = () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 120) + 'px';
            };

            input.addEventListener('input', resizeInput);
            input.addEventListener('focus', resizeInput);

            // Simple markdown parser for chat messages
            function parseMarkdown(text) {
                if (!text) return '';

                // Escape HTML to prevent XSS
                let html = text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');

                // Process line by line for lists and paragraphs
                const lines = html.split('\n');
                let result = [];
                let inList = false;
                let listType = null;

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i];

                    // Check for bullet points (- or *)
                    const bulletMatch = line.match(/^(\s*)[*-]\s+(.+)$/);
                    // Check for numbered lists
                    const numberMatch = line.match(/^(\s*)\d+\.\s+(.+)$/);

                    if (bulletMatch) {
                        if (!inList || listType !== 'ul') {
                            if (inList) result.push(listType === 'ul' ? '</ul>' : '</ol>');
                            result.push('<ul class="chat-list">');
                            inList = true;
                            listType = 'ul';
                        }
                        result.push('<li>' + formatInline(bulletMatch[2]) + '</li>');
                    } else if (numberMatch) {
                        if (!inList || listType !== 'ol') {
                            if (inList) result.push(listType === 'ul' ? '</ul>' : '</ol>');
                            result.push('<ol class="chat-list">');
                            inList = true;
                            listType = 'ol';
                        }
                        result.push('<li>' + formatInline(numberMatch[2]) + '</li>');
                    } else {
                        if (inList) {
                            result.push(listType === 'ul' ? '</ul>' : '</ol>');
                            inList = false;
                            listType = null;
                        }
                        if (line.trim()) {
                            result.push('<p>' + formatInline(line) + '</p>');
                        }
                    }
                }

                if (inList) {
                    result.push(listType === 'ul' ? '</ul>' : '</ol>');
                }

                return result.join('');
            }

            // Format inline markdown (bold, italic, code)
            function formatInline(text) {
                return text
                    // Bold: **text** or __text__
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/__(.+?)__/g, '<strong>$1</strong>')
                    // Italic: *text* or _text_ (but not inside words)
                    .replace(/(?<!\w)\*([^*]+?)\*(?!\w)/g, '<em>$1</em>')
                    .replace(/(?<!\w)_([^_]+?)_(?!\w)/g, '<em>$1</em>')
                    // Inline code: `code`
                    .replace(/`([^`]+?)`/g, '<code class="chat-code">$1</code>');
            }

            function appendMessage(text, role) {
                // Remove typing indicator if present
                const typingEl = messagesEl.querySelector('.agent-chat-typing-wrapper');
                if (typingEl) typingEl.remove();

                const msg = document.createElement('div');
                msg.className = `agent-chat-message ${role}`;

                const bubble = document.createElement('div');
                bubble.className = 'agent-chat-bubble';

                // Use markdown parsing for assistant messages, plain text for user
                if (role === 'assistant') {
                    bubble.innerHTML = parseMarkdown(text);

                    // Add copy button for assistant messages
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'agent-chat-copy-btn';
                    copyBtn.setAttribute('aria-label', 'Copy message');
                    copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>`;
                    copyBtn.addEventListener('click', () => {
                        navigator.clipboard.writeText(text).then(() => {
                            copyBtn.classList.add('copied');
                            copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>`;
                            setTimeout(() => {
                                copyBtn.classList.remove('copied');
                                copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>`;
                            }, 2000);
                        });
                    });
                    msg.appendChild(copyBtn);
                } else {
                    bubble.textContent = text;
                }

                msg.appendChild(bubble);
                messagesEl.appendChild(msg);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function showTyping() {
                const wrapper = document.createElement('div');
                wrapper.className = 'agent-chat-message assistant agent-chat-typing-wrapper';

                const typing = document.createElement('div');
                typing.className = 'agent-chat-bubble agent-chat-typing';
                typing.innerHTML = '<span></span><span></span><span></span>';

                wrapper.appendChild(typing);
                messagesEl.appendChild(wrapper);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function setSendingState(sending) {
                isSending = sending;
                input.disabled = sending;
                submitButton.disabled = sending;
            }

            toggleButton.addEventListener('click', () => {
                chatWindow.classList.toggle('hidden');

                if (!chatWindow.classList.contains('hidden')) {
                    input.focus();
                    if (messagesEl.childElementCount === 0) {
                        appendMessage("Hi! I'm your D3 Governance assistant. Ask me anything about the Enterprise Agent Governance Framework, the five pillars, or the three architecture layers.", 'assistant');
                    }
                }
            });

            closeButton.addEventListener('click', () => {
                chatWindow.classList.add('hidden');
                // Reset fullscreen state when closing
                if (isFullscreen) {
                    chatWindow.classList.remove('fullscreen');
                    expandButton.classList.remove('hidden');
                    collapseButton.classList.add('hidden');
                    isFullscreen = false;
                }
            });

            // Fullscreen expand/collapse handlers
            expandButton.addEventListener('click', () => {
                chatWindow.classList.add('fullscreen');
                expandButton.classList.add('hidden');
                collapseButton.classList.remove('hidden');
                isFullscreen = true;
                input.focus();
            });

            collapseButton.addEventListener('click', () => {
                chatWindow.classList.remove('fullscreen');
                expandButton.classList.remove('hidden');
                collapseButton.classList.add('hidden');
                isFullscreen = false;
                input.focus();
            });

            // Close on escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !chatWindow.classList.contains('hidden')) {
                    if (isFullscreen) {
                        // First collapse from fullscreen
                        chatWindow.classList.remove('fullscreen');
                        expandButton.classList.remove('hidden');
                        collapseButton.classList.add('hidden');
                        isFullscreen = false;
                    } else {
                        // Then close the chat
                        chatWindow.classList.add('hidden');
                    }
                }
            });

            // Global function to open the chat (called from KB footer)
            window.openAgentChat = function() {
                toggleButton.classList.remove('hidden');
                chatWindow.classList.remove('hidden');
                input.focus();
                if (messagesEl.childElementCount === 0) {
                    appendMessage("Hi! I'm your D3 Governance assistant. Ask me anything about the Enterprise Agent Governance Framework, the five pillars, or the three architecture layers.", 'assistant');
                }
            };

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (isSending) return;

                const text = input.value.trim();
                if (!text) return;

                appendMessage(text, 'user');
                input.value = '';
                resizeInput();
                setSendingState(true);
                showTyping();

                try {
                    // Get current page context for the agent
                    const ctx = window.pageContext || {};

                    const response = await fetch('/api/agent-chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            input: text,
                            threadId: threadId,
                            contextSource: ctx.contextSource || 'governance_framework',
                            uiContext: ctx.uiContext || 'Governance Framework'
                        }),
                    });

                    const data = await response.json();

                    if (data.threadId) {
                        threadId = data.threadId;
                    }

                    appendMessage(data.reply || '(no reply)', 'assistant');
                } catch (err) {
                    console.error('Chat error:', err);
                    appendMessage('Sorry, I had trouble connecting. Please try again.', 'assistant');
                } finally {
                    setSendingState(false);
                    input.focus();
                    resizeInput();
                }
            });
        })();
    </script>

                            <path d="M12 16v-4"></path>
